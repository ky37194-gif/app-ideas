const NAV = [
  ['home', 'Home', 'home'],
  ['calendar', 'Calendar', 'calendar'],
  ['board', 'Board', 'board'],
  ['list', 'Ideas', 'list'],
  ['accounts', 'Accounts', 'users'],
];

function App() {
  const [data, setData] = useState(loadData);
  const [tab, setTab] = useState('home');
  const [openIdeaId, setOpenIdeaId] = useState(null);
  const [openAccountId, setOpenAccountId] = useState(null);
  const [quick, setQuick] = useState(null); // null = closed, {} = open (with optional preset)
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [filters, setFilters] = useState(DEFAULT_FILTERS);
  const [toastMsg, setToastMsg] = useState(null);
  const [systemDark, setSystemDark] = useState(() => matchMedia('(prefers-color-scheme: dark)').matches);
  const toastTimer = useRef(null);

  // Save to localStorage whenever data changes
  const saveWarned = useRef(false);
  useEffect(() => {
    const ok = saveData(data);
    if (!ok && !saveWarned.current) { saveWarned.current = true; toast('⚠️ Could not save – storage full? Export a backup.'); }
  }, [data]);

  // Theme handling
  const theme = data.settings.theme;
  const isDark = theme === 'dark' || (theme === 'system' && systemDark);
  useEffect(() => {
    const mq = matchMedia('(prefers-color-scheme: dark)');
    const onChange = () => setSystemDark(mq.matches);
    mq.addEventListener('change', onChange);
    return () => mq.removeEventListener('change', onChange);
  }, []);
  useEffect(() => {
    document.documentElement.classList.toggle('dark', isDark);
    document.querySelector('meta[name=theme-color]').setAttribute('content', isDark ? '#09090b' : '#fafafa');
  }, [isDark]);

  // Keyboard shortcut: N = quick idea (when not typing)
  useEffect(() => {
    const onKey = e => {
      const typing = ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName);
      if (!typing && !e.metaKey && !e.ctrlKey && !e.altKey && e.key.toLowerCase() === 'n' && !sheetStack.length) { e.preventDefault(); setQuick({}); }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  function toast(msg) {
    setToastMsg(msg);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToastMsg(null), 2200);
  }

  /* ---------- Cloud sync engine ---------- */
  const [sync, setSync] = useState(() => {
    const info = loadSyncInfo();
    // Auto sync: unless you turned sync off on this device, use the built-in key
    return info.code ? { ...info, status: 'idle' } : { status: 'off' };
  });
  // First start: ask for the sync password once (unless sync is on or you said "Not now")
  const [askPassword, setAskPassword] = useState(() => { const i = loadSyncInfo(); return !i.code && !i.off; });
  const skipPassword = () => { saveSyncInfo({ off: true }); setAskPassword(false); };
  const dataRef = useRef(data); dataRef.current = data;
  const syncRef = useRef(sync); syncRef.current = sync;
  const busy = useRef(false);     // a sync is running
  const again = useRef(false);    // something changed while syncing → run once more
  const lastSynced = useRef(null); // JSON of what the cloud has, to skip useless uploads

  /* Pull cloud copy → merge with this device → push the result.
     opts.code        use this code (when connecting)
     opts.mustExist   fail if the cloud has nothing for this code (typo protection)
     opts.replaceLocal take the cloud data as-is (new device with no ideas yet) */
  async function runSync(opts = {}) {
    const code = opts.code || syncRef.current.code;
    if (!code) return false;
    if (busy.current) { again.current = true; return false; }
    if (!navigator.onLine) { setSync(s => ({ ...s, status: 'offline' })); return false; }
    busy.current = true;
    setSync(s => ({ ...s, status: 'syncing' }));
    try {
      for (let attempt = 0; attempt < 4; attempt++) {
        const remote = await syncRequest('GET', code);
        if (!remote.data && opts.mustExist) throw new Error('No data found for this sync code');
        const local = dataRef.current;
        const remoteData = remote.data ? normalizeData(remote.data) : null;
        const merged = !remoteData ? local
          : opts.replaceLocal ? { ...remoteData, settings: local.settings }
          : mergeData(local, remoteData);
        const mergedJSON = JSON.stringify(syncable(merged));
        if (!remoteData || mergedJSON !== JSON.stringify(syncable(remoteData))) {
          const saved = await syncRequest('PUT', code, { data: syncable(merged), etag: remote.etag });
          if (saved.conflict) { await new Promise(r => setTimeout(r, 300 * (attempt + 1))); continue; } // another device saved at the same moment → pull again
        }
        lastSynced.current = mergedJSON;
        // If you edited something while we were syncing, merge that in too
        setData(d => (d === local ? merged : mergeData(d, merged)));
        const info = { code: prettyCode(code), lastSync: Date.now() };
        saveSyncInfo(info);
        setSync({ ...info, status: 'ok' });
        return true;
      }
      throw new Error('Too many conflicts, will retry');
    } catch (err) {
      console.warn('Sync:', err);
      setSync(s => ({ ...s, status: navigator.onLine ? 'error' : 'offline', error: err.message }));
      if (opts.code) toast('⚠️ ' + err.message);
      return false;
    } finally {
      busy.current = false;
      if (again.current) { again.current = false; setTimeout(() => runSync(), 400); }
    }
  }

  // Upload ~1.5 s after any change
  useEffect(() => {
    if (!sync.code) return;
    if (JSON.stringify(syncable(data)) === lastSynced.current) return;
    const t = setTimeout(() => runSync(), 1500);
    return () => clearTimeout(t);
  }, [data, sync.code]);

  // Download when the app opens, comes back to the screen, gets internet, and every 30 s
  useEffect(() => {
    if (!sync.code) return;
    runSync();
    const onShow = () => { if (document.visibilityState === 'visible') runSync(); };
    document.addEventListener('visibilitychange', onShow);
    window.addEventListener('online', onShow);
    const timer = setInterval(onShow, 30000);
    return () => { document.removeEventListener('visibilitychange', onShow); window.removeEventListener('online', onShow); clearInterval(timer); };
  }, [sync.code]);

  // mode 'new' = start syncing this device's data with a new code; 'join' = use the code from your other device
  async function connectSync(code, mode) {
    const clean = cleanCode(code);
    if (clean.length < 16) { toast('That sync code looks too short'); return false; }
    const ok = await runSync({
      code: clean,
      mustExist: mode === 'join',
      replaceLocal: mode === 'join' && dataRef.current.ideas.length === 0,
    });
    if (ok) toast(mode === 'join' ? '☁️ Connected – your data is here' : '☁️ Sync is on – phone & computer stay the same');
    return ok;
  }
  function disconnectSync() {
    saveSyncInfo({ off: true }); // remember: don't auto-connect again on this device
    lastSynced.current = null;
    setSync({ status: 'off' });
    toast('Sync turned off on this device');
  }

  // Setup link: opening https://…/#sync=CODE on a new device offers to connect it
  useEffect(() => {
    const m = location.hash.match(/sync=([A-Za-z0-9-]+)/);
    if (!m) return;
    history.replaceState(null, '', location.pathname + location.search); // remove the code from the address bar
    if (syncRef.current.code) return;
    if (confirm('Connect this device to your Content Planner cloud data?')) connectSync(m[1], 'join');
  }, []);

  /* ---------- Actions (everything that changes data) ---------- */
  const updateIdea = (id, patch) => setData(d => ({
    ...d,
    ideas: d.ideas.map(i => {
      if (i.id !== id) return i;
      const next = { ...i, ...patch, updatedAt: Date.now() };
      // Remember the day it was posted (used for streaks)
      if (patch.status && patch.status !== i.status) next.postedAt = patch.status === 'posted' ? (i.date && i.date <= todayISO() ? i.date : todayISO()) : null;
      return next;
    }),
  }));

  const addIdea = partial => {
    const idea = blankIdea(partial);
    setData(d => ({ ...d, ideas: [idea, ...d.ideas] }));
    return idea.id;
  };

  // Deleting remembers the id + time in `deleted`, so sync removes it on your other devices too
  const deleteIdea = id => setData(d => ({ ...d, ideas: d.ideas.filter(i => i.id !== id), deleted: { ...d.deleted, [id]: Date.now() } }));

  const duplicateIdea = (id, overrides = {}, keepContent = true) => {
    const src = data.ideas.find(i => i.id === id); if (!src) return;
    const copy = blankIdea({
      ...JSON.parse(JSON.stringify(src)),
      id: uid(), title: src.title + ' (copy)', status: 'idea', postedAt: null, date: '', time: '',
      createdAt: Date.now(), updatedAt: Date.now(),
      checklist: src.checklist.map(c => ({ ...c, id: uid(), done: false })),
      links: keepContent ? src.links.filter(l => l.type !== 'final').map(l => ({ ...l, id: uid() })) : [],
      ...overrides,
    });
    if (!keepContent) Object.assign(copy, { notes: '', caption: '', hashtags: '', ytTitle: '', ytDescription: '', ytTags: '' });
    setData(d => ({ ...d, ideas: [copy, ...d.ideas] }));
    setOpenIdeaId(copy.id);
    toast('Copy created – edit it now');
  };

  const createNextPart = id => {
    const src = data.ideas.find(i => i.id === id); if (!src) return;
    const part = (src.seriesPart || 1) + 1;
    const title = /part\s*\d+/i.test(src.title) ? src.title.replace(/part\s*\d+/i, `Part ${part}`) : `${src.seriesName} – Part ${part}`;
    const next = blankIdea({ title, accountIds: src.accountIds, formats: src.formats, tags: src.tags, priority: src.priority, seriesName: src.seriesName, seriesPart: part });
    setData(d => ({ ...d, ideas: [next, ...d.ideas.map(i => (i.id === id && !i.seriesPart ? { ...i, seriesPart: 1 } : i))] }));
    setOpenIdeaId(next.id);
    toast(`Part ${part} created`);
  };

  const updateAccount = (id, patch) => setData(d => ({ ...d, accounts: d.accounts.map(a => (a.id === id ? { ...a, ...patch, updatedAt: Date.now() } : a)) }));

  const addAccount = platform => {
    const count = data.accounts.filter(a => a.platform === platform).length + 1;
    const acc = {
      id: uid(), platform, hashtagSets: [], targets: starterTargets(platform), updatedAt: Date.now(),
      name: platform === 'youtube' ? `YT Channel ${count}` : `IG Account ${count}`,
      color: platform === 'youtube' ? 'coral' : 'violet',
      icon: platform === 'youtube' ? '📺' : '🌸',
    };
    setData(d => ({ ...d, accounts: [...d.accounts, acc] }));
    return acc.id;
  };

  const deleteAccount = id => {
    setData(d => ({
      ...d,
      accounts: d.accounts.filter(a => a.id !== id),
      ideas: d.ideas.map(i => (i.accountIds.includes(id) ? { ...i, accountIds: i.accountIds.filter(x => x !== id), updatedAt: Date.now() } : i)),
      deleted: { ...d.deleted, [id]: Date.now() },
    }));
    if (openAccountId === id) setOpenAccountId(null);
  };

  const setSettings = patch => setData(d => ({ ...d, settings: { ...d.settings, ...patch } }));

  // Daily to-do: tick / untick a task for today (only the last 60 days of ticks are kept)
  const toggleTask = id => setData(d => {
    const today = todayISO();
    const list = d.taskLog[today]?.ids || [];
    const log = { ...d.taskLog, [today]: { ids: toggleIn(list, id), at: Date.now() } };
    const cutoff = toISO(addDays(new Date(), -60));
    Object.keys(log).forEach(k => { if (k < cutoff) delete log[k]; });
    return { ...d, taskLog: log };
  });
  const setDailyTasks = list => setData(d => {
    const deleted = { ...d.deleted };
    d.dailyTasks.forEach(t => { if (!list.some(x => x.id === t.id)) deleted[t.id] = Date.now(); });
    return { ...d, dailyTasks: list, deleted };
  });
  const replaceData = next => { setData(next); setOpenIdeaId(null); setOpenAccountId(null); };

  // Erase: mark everything as deleted (so synced devices erase too), then start fresh
  const eraseAll = () => {
    setData(d => {
      const now = Date.now();
      const deleted = { ...d.deleted };
      [...d.ideas, ...d.dailyTasks, ...d.accounts].forEach(x => { deleted[x.id] = now; });
      const fresh = defaultData();
      // the fresh default accounts/tasks are newer than the deletion, so they survive
      fresh.accounts.forEach(a => { a.updatedAt = now + 1; });
      fresh.dailyTasks.forEach(t => { t.updatedAt = now + 1; });
      return { ...fresh, deleted, settings: d.settings };
    });
    setOpenIdeaId(null); setOpenAccountId(null);
  };
  const addSampleIdeas = () => setData(d => ({ ...d, ideas: [...makeSampleIdeas(d.accounts.map(a => a.id)), ...d.ideas] }));

  const accountsById = useMemo(() => Object.fromEntries(data.accounts.map(a => [a.id, a])), [data.accounts]);

  // Names used by more than one account (so labels can add "· YT" / "· IG")
  const seen = new Set();
  DUP_NAMES = new Set();
  data.accounts.forEach(a => { if (seen.has(a.name)) DUP_NAMES.add(a.name); seen.add(a.name); });

  // Everything components can use via useStore()
  const store = {
    data, accountsById, toast,
    updateIdea, addIdea, deleteIdea, duplicateIdea, createNextPart,
    updateAccount, addAccount, deleteAccount, setSettings, replaceData, addSampleIdeas,
    toggleTask, setDailyTasks, eraseAll,
    sync, runSync: () => runSync(), connectSync, disconnectSync,
    openIdea: id => setOpenIdeaId(id),
    openQuick: (preset = {}) => setQuick(preset),
  };

  const goTab = id => { setTab(id); if (id === 'accounts') setOpenAccountId(null); window.scrollTo(0, 0); };
  const openAccount = id => { setTab('accounts'); setOpenAccountId(id); window.scrollTo(0, 0); };
  const filterList = patch => { setFilters({ ...DEFAULT_FILTERS, ...patch }); goTab('list'); };

  const openIdeaObj = data.ideas.find(i => i.id === openIdeaId);
  const seriesNames = [...new Set(data.ideas.map(i => i.seriesName).filter(Boolean))];
  const titles = { home: 'Content Planner', calendar: 'Calendar', board: 'Board', list: 'All ideas', accounts: 'Accounts' };

  return (
    <StoreContext.Provider value={store}>
      <div className="min-h-[100dvh] pb-[calc(150px_+_env(safe-area-inset-bottom))] lg:pb-12 lg:pl-64">
        {/* Computer screens: menu on the left side instead of the bottom bar */}
        <aside className="hidden lg:flex fixed left-0 top-0 bottom-0 z-40 w-64 flex-col gap-1 p-4 border-r border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900">
          <div className="flex items-center gap-2.5 px-2 h-12 mb-3">
            <span className="w-9 h-9 rounded-xl grid place-items-center text-white shadow" style={{ background: BRAND_GRADIENT }}>▶</span>
            <span className="font-extrabold text-lg tracking-tight">Content Planner</span>
          </div>
          <button onClick={() => setQuick({})} className="mb-3 flex items-center justify-center gap-2 rounded-xl text-white font-bold min-h-[46px] shadow-lg shadow-pink-500/30 active:scale-[.98] transition" style={{ background: BRAND_GRADIENT }}>
            <Icon name="plus" className="w-5 h-5" strokeWidth={2.5} /> New idea <kbd className="ml-1 text-[11px] font-semibold opacity-80 border border-white/40 rounded px-1">N</kbd>
          </button>
          {NAV.map(([id, label, icon]) => (
            <button key={id} onClick={() => goTab(id)} aria-current={tab === id ? 'page' : undefined}
              className={`flex items-center gap-3 rounded-xl px-3 min-h-[44px] text-sm font-semibold transition ${tab === id ? 'bg-pink-50 text-pink-600 dark:bg-pink-500/10 dark:text-pink-400' : 'text-zinc-600 dark:text-zinc-400 hover:bg-zinc-100 dark:hover:bg-zinc-800'}`}>
              <Icon name={icon} className="w-5 h-5" />{label}
            </button>
          ))}
          <div className="flex-1" />
          {data.accounts.map(a => (
            <button key={a.id} onClick={() => openAccount(a.id)} className="flex items-center gap-2.5 rounded-xl px-2 min-h-[38px] text-sm text-left hover:bg-zinc-100 dark:hover:bg-zinc-800">
              <AccountAvatar account={a} size="w-7 h-7 text-sm" /><span className="truncate font-medium">{accLabel(a)}</span>
            </button>
          ))}
          <button onClick={() => setSettingsOpen(true)} className="mt-3 flex items-center gap-2.5 rounded-xl px-3 min-h-[44px] text-sm font-semibold border border-zinc-200 dark:border-zinc-800 hover:bg-zinc-100 dark:hover:bg-zinc-800">
            <span className={`w-2.5 h-2.5 rounded-full ${(SYNC_STATUS[sync.status] || SYNC_STATUS.off).dot}`} />
            {sync.code ? (SYNC_STATUS[sync.status] || SYNC_STATUS.off).text : 'Connect with phone'}
          </button>
        </aside>

        {/* Top bar */}
        <header className="sticky top-0 z-30 bg-zinc-50/85 dark:bg-zinc-950/85 backdrop-blur border-b border-zinc-200/70 dark:border-zinc-800/70" style={{ paddingTop: 'env(safe-area-inset-top)' }}>
          <div className="max-w-5xl lg:max-w-7xl mx-auto px-4 lg:px-8 h-14 flex items-center gap-2">
            <span className="lg:hidden w-8 h-8 rounded-xl grid place-items-center text-white text-sm shadow" style={{ background: BRAND_GRADIENT }}>▶</span>
            <h1 className="font-extrabold text-lg tracking-tight flex-1 truncate">{titles[tab]}</h1>
            <SyncBadge sync={sync} onClick={() => setSettingsOpen(true)} />
            <button onClick={() => setSettings({ theme: isDark ? 'light' : 'dark' })} className={ICON_BTN} aria-label="Toggle dark mode"><Icon name={isDark ? 'sun' : 'moon'} /></button>
            <button onClick={() => setSettingsOpen(true)} className={ICON_BTN} aria-label="Settings"><Icon name="sliders" /></button>
          </div>
        </header>

        <main className="max-w-5xl lg:max-w-7xl mx-auto px-4 lg:px-8 pt-4">
          {/* Until this device uses password sync, show the password box right on Home */}
          {tab === 'home' && !isPasswordCode(sync.code) && (
            <div className={`${CARD} p-4 mb-4 border-2 !border-pink-400`}>
              <div className="font-extrabold mb-1">🔑 Phone + computer: same data</div>
              <PasswordConnect />
            </div>
          )}
          {tab === 'home' && <Dashboard onOpenAccount={openAccount} onFilterList={filterList} />}
          {tab === 'calendar' && <CalendarView />}
          {tab === 'board' && <BoardView />}
          {tab === 'list' && <ListView filters={filters} setFilters={setFilters} />}
          {tab === 'accounts' && <AccountsView openAccountId={openAccountId} setOpenAccountId={setOpenAccountId} />}
        </main>

        {/* Big + button (quick capture) */}
        <button onClick={() => setQuick({})} aria-label="Quick add idea"
          className="lg:hidden fixed right-4 z-40 w-16 h-16 rounded-full text-white grid place-items-center shadow-xl shadow-pink-500/40 active:scale-90 transition"
          style={{ background: BRAND_GRADIENT, bottom: 'calc(76px + env(safe-area-inset-bottom))' }}>
          <Icon name="plus" className="w-8 h-8" strokeWidth={2.5} />
        </button>

        {/* Bottom navigation */}
        <nav className="lg:hidden fixed bottom-0 inset-x-0 z-40 bg-white/90 dark:bg-zinc-950/90 backdrop-blur border-t border-zinc-200 dark:border-zinc-800 pb-safe">
          <div className="max-w-xl mx-auto grid grid-cols-5">
            {NAV.map(([id, label, icon]) => (
              <button key={id} onClick={() => goTab(id)} aria-current={tab === id ? 'page' : undefined}
                className={`flex flex-col items-center justify-center gap-0.5 min-h-[62px] text-[11px] font-semibold transition ${tab === id ? 'text-pink-600 dark:text-pink-400' : 'text-zinc-500'}`}>
                <Icon name={icon} className="w-6 h-6" />{label}
              </button>
            ))}
          </div>
        </nav>

        {/* Popups */}
        {openIdeaObj && <IdeaEditor key={openIdeaObj.id} idea={openIdeaObj} onClose={() => setOpenIdeaId(null)} />}
        {quick && <QuickCapture preset={quick} onClose={() => setQuick(null)} />}
        {settingsOpen && <SettingsSheet onClose={() => setSettingsOpen(false)} />}
        {askPassword && !sync.code && !settingsOpen && (
          <Sheet title="☁️ Same data on phone & computer" onClose={skipPassword}>
            <div className="p-4 pb-6 space-y-3">
              <PasswordConnect onDone={() => setAskPassword(false)} />
              <button onClick={skipPassword} className="w-full text-sm text-zinc-500 min-h-[40px]">Not now (turn on later in Settings → Cloud sync)</button>
            </div>
          </Sheet>
        )}

        <datalist id="series-names">{seriesNames.map(n => <option key={n} value={n} />)}</datalist>

        {toastMsg && (
          <div className="animate-toast fixed left-1/2 z-[70] -translate-x-1/2 rounded-xl bg-zinc-900 text-white dark:bg-white dark:text-zinc-900 px-4 py-3 text-sm font-semibold shadow-xl max-w-[90vw] text-center"
            style={{ bottom: window.innerWidth >= 1024 ? 32 : 'calc(152px + env(safe-area-inset-bottom))' }} role="status">
            {toastMsg}
          </div>
        )}
      </div>
    </StoreContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
