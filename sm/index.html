/* =====================================================================
   CONTENT PLANNER
   One-file React app. All data lives in your browser's localStorage.

   File map (search for these headings):
     1. CONSTANTS      – statuses, formats, colours, default checklist

const ICON_CHOICES = ['▶️', '🎬', '📺', '🎥', '📸', '✨', '🌸', '🎨', '🍳', '💪', '🎮', '📚', '💼', '🎵', '✈️', '😂', '💄', '🧠', '💰', '🔥'];

const DEFAULT_CHECKLIST = ['Script', 'Voiceover', 'Video', 'Thumbnail / Cover', 'Caption', 'Hashtags'];

// Daily to-do list you tick off every day (editable on the Home screen)
const DEFAULT_TASKS = ['Reply to comments & DMs', 'Write down 1 new idea', '15 min engaging with niche creators'];

const ALL_DAYS = [0, 1, 2, 3, 4, 5, 6]; // Mon..Sun

/* Posting targets per account. Each target says:
   format  – what to post (e.g. 'ig-reel')
   count   – how many
   per     – 'day' or 'week'
   days    – which weekdays (0 = Mon … 6 = Sun)
   time    – planned posting time ("" = any time) */
function starterTargets(platform) {

    ? [
        { id: uid(), format: 'yt-short', count: 1, per: 'day', days: ALL_DAYS, time: '18:00' },
        { id: uid(), format: 'yt-long', count: 1, per: 'week', days: [5], time: '11:00' },
      ]
    : [

        { id: uid(), format: 'ig-carousel', count: 2, per: 'week', days: [1, 4], time: '13:00' },
        { id: uid(), format: 'ig-story', count: 3, per: 'day', days: ALL_DAYS, time: '' },
      ];
}

/* Account label. If two accounts share a name (e.g. "Pharmsstrasse" on YouTube AND Instagram),
   we add "· YT" / "· IG" so you can tell them apart. DUP_NAMES is refreshed by <App>. */
let DUP_NAMES = new Set();
const accLabel = a => (a ? (DUP_NAMES.has(a.name) ? `${a.name} · ${a.platform === 'youtube' ? 'YT' : 'IG'}` : a.name) : '');

const LINK_TYPES = {
  reference: { label: 'Reference / Inspiration', emoji: '🔍', hint: 'Other reels, videos, articles' },
  asset:     { label: 'Assets',                  emoji: '📁', hint: 'Drive folder, Canva, thumbnail, music' },

};

// Reusable Tailwind class strings (keeps the JSX below shorter)
const INPUT = 'w-full rounded-xl border border-zinc-200 dark:border-zinc-700 bg-white dark:bg-zinc-900 px-3 min-h-[44px] text-base outline-none focus:border-pink-500 focus:ring-2 focus:ring-pink-500/30 placeholder:text-zinc-400';
const CARD = 'rounded-2xl bg-white dark:bg-zinc-900 border border-zinc-200/80 dark:border-zinc-800';
const BTN = 'inline-flex items-center justify-center gap-2 rounded-xl px-4 min-h-[44px] font-semibold transition active:scale-[.97] disabled:opacity-40';
const BTN_PRIMARY = BTN + ' bg-zinc-900 text-white dark:bg-white dark:text-zinc-900';
const BTN_GHOST = BTN + ' bg-zinc-100 text-zinc-800 hover:bg-zinc-200 dark:bg-zinc-800 dark:text-zinc-100 dark:hover:bg-zinc-700';
const BTN_DANGER = BTN + ' bg-red-50 text-red-600 hover:bg-red-100 dark:bg-red-500/10 dark:text-red-400';
const ICON_BTN = 'inline-grid place-items-center w-11 h-11 rounded-xl text-zinc-600 hover:bg-zinc-100 dark:text-zinc-300 dark:hover:bg-zinc-800 active:scale-95 transition';

/* =====================================================================
   2. HELPERS
   ===================================================================== */
const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-5);
const pad = n => String(n).padStart(2, '0');

// Dates are stored as plain "YYYY-MM-DD" strings (local time) – easy to compare and sort.
const toISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const todayISO = () => toISO(new Date());
const addDays = (date, n) => { const d = new Date(date.getFullYear(), date.getMonth(), date.getDate()); d.setDate(d.getDate() + n); return d; };
const startOfWeek = date => { const d = new Date(date.getFullYear(), date.getMonth(), date.getDate()); return addDays(d, -((d.getDay() + 6) % 7)); }; // Monday
const fmtDate = (iso, opts = { day: 'numeric', month: 'short' }) => (iso ? fromISO(iso).toLocaleDateString('en-IN', opts) : '');
const fmtTime = t => {
  if (!t) return '';
  const [h, m] = t.split(':').map(Number);
  return `${h % 12 || 12}:${pad(m)} ${h >= 12 ? 'PM' : 'AM'}`;
};
const WEEKDAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

const toggleIn = (list, value) => (list.includes(value) ? list.filter(x => x !== value) : [...list, value]);
const arr = v => (Array.isArray(v) ? v : []);

// Checklist progress in %
const progressOf = idea => {
  const total = idea.checklist.length;
  return total ? Math.round((idea.checklist.filter(c => c.done).length / total) * 100) : 0;
};

// Links: only allow http(s) so a bad link can never run code
const normalizeUrl = u => {
  u = (u || '').trim();
  if (/^https?:\/\//i.test(u)) return u;
  return 'https://' + u.replace(/^[a-z]+:\/*/i, '');
};
const hostOf = u => { try { return new URL(normalizeUrl(u)).hostname.replace(/^www\./, ''); } catch { return u; } };

// Hashtags: "#a b, #c" -> ["#a", "#b", "#c"]
const parseHashtags = str => (str || '').split(/[\s,]+/).filter(Boolean).map(t => (t.startsWith('#') ? t : '#' + t));
const mergeHashtags = (a, b) => {
  const seen = new Set(); const out = [];
  [...parseHashtags(a), ...parseHashtags(b)].forEach(t => { const k = t.toLowerCase(); if (!seen.has(k)) { seen.add(k); out.push(t); } });
  return out.join(' ');
};

const wordCount = s => ((s || '').trim().match(/\S+/g) || []).length;
const voiceoverTime = words => { const sec = Math.round((words / 150) * 60); return sec < 60 ? `${sec}s` : `${Math.floor(sec / 60)}m ${sec % 60}s`; };

const gradientOf = acc => (COLORS[acc?.color] || COLORS.slate).gradient;
const solidOf = acc => (COLORS[acc?.color] || COLORS.slate).solid;

// Copy text to clipboard (with a fallback for older browsers / file:// pages)
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch {}
    ta.remove(); return ok;
  }
}

/* Posting stats for one account:
   - streak  = how many weeks in a row (up to now) had at least 1 post
   - weeks8  = true/false for each of the last 8 weeks (oldest -> newest)
   - last30  = posts in the last 30 days */
function postingStats(ideas, accountId) {
  const today = todayISO();
  const dates = ideas
    .filter(i => i.status === 'posted' && i.accountIds.includes(accountId))
    .map(i => i.postedAt || i.date)
    .filter(Boolean);
  const weekKeys = new Set(dates.map(s => toISO(startOfWeek(fromISO(s)))));

  let w = startOfWeek(new Date());
  if (!weekKeys.has(toISO(w))) w = addDays(w, -7); // this week not posted yet? streak is still alive from last week
  let streak = 0;
  while (weekKeys.has(toISO(w))) { streak++; w = addDays(w, -7); }

  const thisWeek = startOfWeek(new Date());
  const weeks8 = [...Array(8)].map((_, k) => weekKeys.has(toISO(addDays(thisWeek, -7 * (7 - k)))));
  const since = toISO(addDays(new Date(), -30));
  const last30 = dates.filter(s => s > since && s <= today).length;
  return { streak, weeks8, last30, totalPosted: dates.length };
}

/* ---------- Targets ---------- */
const weekdayIndex = date => (date.getDay() + 6) % 7; // Mon = 0 … Sun = 6

// Does this target need something from you today?
const appliesToday = (t, dow) => t.days.includes(dow);

// "Every day", "Weekdays", or "Mon, Thu"
const daysLabel = days => {
  if (days.length === 7) return 'Every day';
  if (days.length === 5 && [0, 1, 2, 3, 4].every(d => days.includes(d))) return 'Weekdays';
  return [...days].sort().map(d => WEEKDAYS[d]).join(', ');
};

/* How far along a target is.
   done    = posts with status ✅ Posted in the period (today, or this week)
   planned = ideas dated in the rest of the period that are not posted yet */
function targetStatus(ideas, accountId, t) {
  const today = todayISO();
  const weekStart = toISO(startOfWeek(new Date()));
  const weekEnd = toISO(addDays(startOfWeek(new Date()), 6));
  const [from, to] = t.per === 'day' ? [today, today] : [weekStart, weekEnd];
  const matches = i => i.accountIds.includes(accountId) && i.formats.includes(t.format);
  const done = ideas.filter(i => matches(i) && i.status === 'posted' && (i.postedAt || i.date) >= from && (i.postedAt || i.date) <= to).length;
  const planned = ideas.filter(i => matches(i) && i.status !== 'posted' && i.date >= today && i.date <= to).length;
  return { done, planned, need: t.count, met: done >= t.count };
}

/* =====================================================================
   3. DATA / STORAGE
   ===================================================================== */
function blankIdea(overrides = {}) {
  const now = Date.now();
  return {
    id: uid(),
    title: '', description: '', notes: '',
    accountIds: [], formats: [],
    status: 'idea', priority: 'medium', tags: [],
    seriesName: '', seriesPart: null,
    date: '', time: '',
    links: [],
    checklist: DEFAULT_CHECKLIST.map(text => ({ id: uid(), text, done: false })),
    caption: '', hashtags: '', ytTitle: '', ytDescription: '', ytTags: '',
    postedAt: null, createdAt: now, updatedAt: now,
    ...overrides,
  };
}

const DATA_VERSION = 5;

// Your 4 starting accounts
const DEFAULT_ACCOUNTS = [
  { id: 'yt1', name: 'Pharmsstrasse',          platform: 'youtube',   color: 'red',     icon: '▶️' },
  { id: 'ig1', name: 'Pharmsstrasse',          platform: 'instagram', color: 'insta',   icon: '📸' },
  { id: 'yt2', name: 'German learning mit JK', platform: 'youtube',   color: 'crimson', icon: '🇩🇪' },
  { id: 'ig2', name: 'German learning mit JK', platform: 'instagram', color: 'pink',    icon: '🇩🇪' },
];

// Fixed ids, so two fresh devices don't create duplicate default tasks when they sync
const defaultTasks = () => DEFAULT_TASKS.map((text, k) => ({ id: 'task' + (k + 1), text, accountId: '', updatedAt: 0 }));

function defaultData() {
  return {
    version: DATA_VERSION,
    accounts: DEFAULT_ACCOUNTS.map(a => ({ ...a, hashtagSets: [], targets: starterTargets(a.platform) })),
    ideas: [],
    dailyTasks: defaultTasks(),
    taskLog: {}, // { "2026-10-21": { ids: [tasks ticked that day], at: time of last change } }
    deleted: {}, // { id: time deleted } – lets cloud sync know something was deleted on another device
    settings: { theme: 'system', lastQuickAccounts: [] },
  };
}

/* Upgrades data saved by older versions of the app.
   v1 → v2: rename the untouched default accounts, add starter targets + daily tasks. */
function migrate(raw) {
  if ((raw.version || 1) < 2) {
    const oldNames = { yt1: 'YT Channel 1', yt2: 'YT Channel 2', ig1: 'IG Account 1', ig2: 'IG Account 2' };
    raw.accounts = arr(raw.accounts).map(a => {
      const def = DEFAULT_ACCOUNTS.find(d => d.id === a.id);
      const renamed = def && a.name === oldNames[a.id] ? { name: def.name, icon: def.icon } : {};
      return { ...a, ...renamed, targets: a.targets || starterTargets(a.platform) };
    });
    // Keep each brand's YT + IG next to each other (Pharmsstrasse, Pharmsstrasse, German, German); extra accounts stay at the end
    const order = id => { const k = DEFAULT_ACCOUNTS.findIndex(d => d.id === id); return k < 0 ? 99 : k; };
    raw.accounts.sort((x, y) => order(x.id) - order(y.id));
    if (!raw.dailyTasks) raw.dailyTasks = defaultTasks();
    raw.version = 2;
  }
  // v2 → v3: to-do ticks get a timestamp (needed for sync), deletions are remembered
  if (raw.version < 3) {
    const log = raw.taskLog && typeof raw.taskLog === 'object' ? raw.taskLog : {};
    Object.keys(log).forEach(day => { if (Array.isArray(log[day])) log[day] = { ids: log[day], at: Date.now() }; });
    raw.taskLog = log;
    raw.deleted = raw.deleted || {};
    raw.version = 3;
  }
  // v3 → v4: "PS" is now called "Pharmsstrasse" (only if you hadn't renamed it yourself)
  if (raw.version < 4) {
    raw.accounts = arr(raw.accounts).map(a => (['yt1', 'ig1'].includes(a.id) && a.name === 'PS' ? { ...a, name: 'Pharmsstrasse', updatedAt: Date.now() } : a));
    raw.version = 4;
  }
  // v4 → v5: Instagram accounts also get a simple IG Post target (3 per week: Mon, Wed, Fri)
  if (raw.version < 5) {
    raw.accounts = arr(raw.accounts).map(a => (a.platform === 'instagram' && Array.isArray(a.targets) && !a.targets.some(t => t.format === 'ig-post')
      ? { ...a, targets: [{ id: 'tgt-igpost-' + a.id, format: 'ig-post', count: 3, per: 'week', days: [0, 2, 4], time: '12:00' }, ...a.targets], updatedAt: Date.now() }
      : a));
    raw.version = 5;
  }
  return raw;
}

// Makes sure data loaded from storage / an imported file has every field we expect
function normalizeData(raw) {
  const base = defaultData();
  if (!raw || typeof raw !== 'object') return base;
  raw = migrate(raw);
  const accounts = Array.isArray(raw.accounts)
    ? raw.accounts.map(a => ({
        id: a.id || uid(),
        name: a.name || 'Account',
        platform: a.platform === 'youtube' ? 'youtube' : 'instagram',
        color: COLORS[a.color] ? a.color : 'slate',
        icon: a.icon || '⭐',
        updatedAt: a.updatedAt || 0,
        hashtagSets: arr(a.hashtagSets).map(s => ({ id: s.id || uid(), name: s.name || 'Set', tags: s.tags || '' })),
        targets: arr(a.targets).map(t => ({
          id: t.id || uid(),
          format: FORMAT_BY_ID[t.format] ? t.format : 'ig-reel',
          count: Math.max(1, Number(t.count) || 1),
          per: t.per === 'week' ? 'week' : 'day',
          days: Array.isArray(t.days) && t.days.length ? t.days : ALL_DAYS,
          time: t.time || '',
        })),
      }))
    : base.accounts;
  const ideas = arr(raw.ideas).map(i => {
    const b = blankIdea();
    return {
      ...b, ...i,
      id: i.id || b.id,
      status: STATUS_BY_ID[i.status] ? i.status : 'idea',
      priority: PRIORITY_BY_ID[i.priority] ? i.priority : 'medium',
      accountIds: arr(i.accountIds), formats: arr(i.formats), tags: arr(i.tags),
      links: arr(i.links), checklist: Array.isArray(i.checklist) ? i.checklist : b.checklist,
    };
  });
  const dailyTasks = Array.isArray(raw.dailyTasks)
    ? raw.dailyTasks.filter(t => t && t.text).map(t => ({ id: t.id || uid(), text: t.text, accountId: t.accountId || '', updatedAt: t.updatedAt || 0 }))
    : base.dailyTasks;
  const taskLog = {};
  Object.entries(raw.taskLog && typeof raw.taskLog === 'object' ? raw.taskLog : {}).forEach(([day, v]) => {
    taskLog[day] = Array.isArray(v) ? { ids: v, at: 0 } : { ids: arr(v && v.ids), at: (v && v.at) || 0 };
  });
  const deleted = raw.deleted && typeof raw.deleted === 'object' ? raw.deleted : {};
  return { version: DATA_VERSION, accounts, ideas, dailyTasks, taskLog, deleted, settings: { ...base.settings, ...(raw.settings || {}) } };
}

/* =====================================================================
   3b. CLOUD SYNC
   Same data on the website and the phone app.
   - Each device keeps its own copy (localStorage) → works offline.
   - With a "sync code", changes are merged with the cloud copy automatically
     (on open, every 30 s, and ~1.5 s after you change something).
   - Merge rule: for each idea / account / task, the most recently edited version wins.
     Deletions are remembered in `deleted` so they spread to other devices too.
   ===================================================================== */
const SITE_URL = 'https://content-planner-ps.vercel.app';
const SYNC_URL = (location.origin === SITE_URL ? '' : SITE_URL) + '/api/sync';
const SYNC_STORAGE_KEY = 'contentPlanner.sync'; // { code, lastSync } – stays on this device only

const SYNC_ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // no 0/O/1/I to avoid typos
function newSyncCode() {
  const bytes = crypto.getRandomValues(new Uint8Array(20)); // 20 random chars ≈ 100 bits – impossible to guess
  return [...bytes].map(b => SYNC_ALPHABET[b % 32]).join('').match(/.{4}/g).join('-');
}
const cleanCode = c => (c || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
const prettyCode = c => (cleanCode(c).match(/.{1,4}/g) || []).join('-');
// Password sync: the same password on every device → the same private cloud file.
// The password is turned into a long code with PBKDF2 (slow on purpose, so it can't be guessed fast).
// The password itself is never saved or sent anywhere.
async function passwordToCode(password) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(password.trim()), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: enc.encode('content-planner-ps-sync-v1'), iterations: 300000, hash: 'SHA-256' }, base, 256);
  return [...new Uint8Array(bits)].map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase(); // 64 chars
}
const isPasswordCode = code => cleanCode(code).length === 64;
const loadSyncInfo = () => { try { return JSON.parse(localStorage.getItem(SYNC_STORAGE_KEY)) || {}; } catch { return {}; } };
const saveSyncInfo = info => { try { localStorage.setItem(SYNC_STORAGE_KEY, JSON.stringify(info)); } catch {} };

// Only these parts go to the cloud (theme etc. stay per device)
const syncable = d => ({ version: d.version, accounts: d.accounts, ideas: d.ideas, dailyTasks: d.dailyTasks, taskLog: d.taskLog, deleted: d.deleted });

// Merge two lists of {id, updatedAt}: newest version of each item wins, deleted ones are dropped
function mergeList(local, remote, deleted) {
  const newest = new Map();
  [...remote, ...local].forEach(x => {
    const cur = newest.get(x.id);
    if (!cur || (x.updatedAt || 0) > (cur.updatedAt || 0)) newest.set(x.id, x);
  });
  const ids = [...new Set([...remote.map(x => x.id), ...local.map(x => x.id)])];
  return ids.map(id => newest.get(id)).filter(x => !(deleted[x.id] && deleted[x.id] >= (x.updatedAt || 0)));
}

function mergeData(local, remote) {
  const deleted = { ...(remote.deleted || {}) };
  Object.entries(local.deleted || {}).forEach(([id, t]) => { if (!deleted[id] || t > deleted[id]) deleted[id] = t; });
  const forgetBefore = Date.now() - 120 * 86400000; // forget deletions older than 120 days
  Object.keys(deleted).forEach(id => { if (deleted[id] < forgetBefore) delete deleted[id]; });

  const taskLog = { ...(remote.taskLog || {}) };
  Object.entries(local.taskLog || {}).forEach(([day, v]) => { if (!taskLog[day] || (v.at || 0) > (taskLog[day].at || 0)) taskLog[day] = v; });

  return {
    ...local, // keeps this device's settings
    version: DATA_VERSION,
    accounts: mergeList(local.accounts, remote.accounts, deleted),
    ideas: mergeList(local.ideas, remote.ideas, deleted).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)),
    dailyTasks: mergeList(local.dailyTasks, remote.dailyTasks, deleted),
    taskLog,
    deleted,
  };
}

async function syncRequest(method, code, body) {
  const url = method === 'GET' ? `${SYNC_URL}?t=${Date.now()}` : SYNC_URL;
  const res = await fetch(url, {
    method,
    cache: 'no-store',
    headers: { 'x-sync-key': cleanCode(code), ...(body ? { 'content-type': 'application/json' } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (res.status === 409) return { conflict: true };
  if (!res.ok) throw new Error(`Sync failed (${res.status})`);
  return res.json();
}

const timeAgo = ts => {
  if (!ts) return 'never';
  const s = Math.round((Date.now() - ts) / 1000);
  if (s < 10) return 'just now';
  if (s < 60) return `${s}s ago`;
  if (s < 3600) return `${Math.round(s / 60)} min ago`;
  return new Date(ts).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
};

/* Sheet = popup panel. Slides up from the bottom on phones, centred on bigger screens.
   Only the top-most open sheet reacts to the Escape key. */
const sheetStack = [];
function Sheet({ title, onClose, children, full = false, headerRight = null, footer = null }) {
  const idRef = useRef(uid());
  const closeRef = useRef(onClose);
  closeRef.current = onClose;
  useEffect(() => {
    const id = idRef.current;
    sheetStack.push(id);
    document.body.style.overflow = 'hidden';
    const onKey = e => { if (e.key === 'Escape' && sheetStack[sheetStack.length - 1] === id) closeRef.current(); };
    window.addEventListener('keydown', onKey);
    return () => {
      window.removeEventListener('keydown', onKey);
      sheetStack.splice(sheetStack.indexOf(id), 1);
      if (!sheetStack.length) document.body.style.overflow = '';
    };
  }, []);
  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center sm:p-4">
      <div className="absolute inset-0 bg-black/50 backdrop-blur-[2px]" onClick={onClose} />
      <div
        className={`animate-sheet relative w-full sm:max-w-2xl bg-zinc-50 dark:bg-zinc-950 shadow-2xl flex flex-col overflow-hidden ${full ? 'h-[100dvh] sm:h-[92vh] sm:rounded-3xl' : 'max-h-[88dvh] rounded-t-3xl sm:rounded-3xl'}`}

    .map(a => ({
      account: a,
      rows: (a.targets || [])
        .filter(t => appliesToday(t, dow))
        .map(t => ({ t, s: targetStatus(data.ideas, a.id, t) }))
        .sort((x, y) => (x.t.time || '99').localeCompare(y.t.time || '99')),
    }))
    .filter(g => g.rows.length);

  // All weekly targets (to see the week at a glance)
  const weekly = data.accounts.flatMap(a => (a.targets || []).filter(t => t.per === 'week').map(t => ({ a, t, s: targetStatus(data.ideas, a.id, t) })));

  const ticked = data.taskLog[today]?.ids || [];
  const allRows = groups.flatMap(g => g.rows);
  const total = allRows.length + data.dailyTasks.length;
  const doneCount = allRows.filter(r => r.s.met).length + data.dailyTasks.filter(t => ticked.includes(t.id)).length;
  const pct = total ? Math.round((doneCount / total) * 100) : 0;
  const hasTargets = data.accounts.some(a => (a.targets || []).length);

  const addTask = () => {
    if (!newTask.trim()) return;
    setDailyTasks([...data.dailyTasks, { id: uid(), text: newTask.trim(), accountId: newTaskAcc, updatedAt: Date.now() }]);
    setNewTask('');
  };

  return (
    <div className={`${CARD} mt-4 overflow-hidden`}>
      {/* Header with today's overall progress */}
      <div className="p-4 pb-3">
        <div className="flex items-center justify-between">
          <h2 className="font-extrabold text-base">🎯 Today's targets</h2>
          <span className={`text-sm font-extrabold tabular-nums ${pct === 100 ? 'text-emerald-600' : ''}`}>{doneCount}/{total} {pct === 100 ? '🎉' : ''}</span>
        </div>
        <ProgressBar pct={pct} className="h-2 mt-2" />
        <div className="text-xs text-zinc-500 mt-1.5">{fmtDate(today, { weekday: 'long' })} · a target counts as done when the idea is marked ✅ Posted</div>
      </div>

      {!hasTargets && (
        <div className="px-4 pb-4 text-sm text-zinc-500">No posting targets yet. Open an account in <b>Accounts</b> to set them.</div>
      )}

      {/* Per-account posting targets */}
      {groups.map(({ account, rows }) => (
        <div key={account.id} className="border-t border-zinc-100 dark:border-zinc-800 px-4 py-2">
          <button onClick={() => onOpenAccount(account.id)} className="flex items-center gap-2 min-h-[36px]">
            <AccountAvatar account={account} size="w-6 h-6 text-xs rounded-lg" />
            <span className="font-bold text-sm">{accLabel(account)}</span>
            <span className="text-[11px] text-zinc-400">{PLATFORMS[account.platform].label}</span>
          </button>
          {rows.map(({ t, s }) => {
            const f = FORMAT_BY_ID[t.format];
            return (
              <div key={t.id} className="flex items-center gap-3 min-h-[48px]">
                <span className="w-8 text-center text-xl">{f.emoji}</span>
                <div className="flex-1 min-w-0">
                  <div className={`text-sm font-semibold ${s.met ? 'line-through text-zinc-400' : ''}`}>
                    {t.count} × {f.label}{t.per === 'week' ? <span className="font-normal text-zinc-500"> (this week)</span> : ''}
                  </div>
                  <div className="text-xs text-zinc-500">
                    {t.time ? `⏰ ${fmtTime(t.time)}` : 'Any time'}
                    {s.planned > 0 && !s.met ? ` · ${s.planned} planned` : ''}
                  </div>
                </div>
                <CountDots done={Math.min(s.done, s.need)} need={s.need} color={solidOf(account)} />
                {s.met ? (
                  <span className="w-[68px] text-right text-sm font-bold text-emerald-600 dark:text-emerald-400">✓ Done</span>
                ) : (
                  <button onClick={() => openQuick({ accountIds: [account.id], formats: [t.format], date: today, time: t.time })}
                    className="w-[68px] shrink-0 rounded-xl min-h-[38px] text-sm font-bold text-white" style={{ background: gradientOf(account) }}>+ Plan</button>
                )}
              </div>
            );
          })}
        </div>
      ))}

      {/* This week's progress for weekly targets */}
      {weekly.length > 0 && (
        <div className="border-t border-zinc-100 dark:border-zinc-800 px-4 py-3">
          <div className="text-xs font-bold text-zinc-500 uppercase mb-2">This week</div>
          <div className="space-y-2">
            {weekly.map(({ a, t, s }) => {
              const f = FORMAT_BY_ID[t.format];
              return (
                <div key={t.id} className="flex items-center gap-2 text-sm">
                  <span className="w-2 h-2 rounded-full shrink-0" style={{ background: solidOf(a) }} />
                  <span className="flex-1 min-w-0 truncate"><b>{accLabel(a)}</b> · {f.emoji} {f.label} <span className="text-zinc-400 text-xs">({daysLabel(t.days)})</span></span>
                  <span className={`font-bold tabular-nums ${s.met ? 'text-emerald-600' : ''}`}>{s.done}/{s.need}</span>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* Daily to-do list */}
      <div className="border-t border-zinc-100 dark:border-zinc-800 px-4 py-3 bg-zinc-50/60 dark:bg-zinc-900/40">
        <div className="flex items-center justify-between">
          <div className="text-xs font-bold text-zinc-500 uppercase">Daily to-do</div>
          <button onClick={() => setEditTasks(v => !v)} className="text-xs font-bold text-pink-600 dark:text-pink-400 min-h-[36px] px-2">{editTasks ? 'Done' : 'Edit'}</button>
        </div>
        <div className="space-y-1">
          {data.dailyTasks.map(task => {
            const on = ticked.includes(task.id);
            const acc = data.accounts.find(a => a.id === task.accountId);
            return (
              <div key={task.id} className="flex items-center gap-2">
                <button onClick={() => toggleTask(task.id)} className="flex-1 flex items-center gap-3 text-left min-h-[44px]">
                  <span className={`w-6 h-6 shrink-0 rounded-lg grid place-items-center border-2 ${on ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-zinc-300 dark:border-zinc-600'}`}>
                    {on && <Icon name="check" className="w-3.5 h-3.5" strokeWidth={3} />}
                  </span>
                  <span className={`text-sm font-medium ${on ? 'line-through text-zinc-400' : ''}`}>{task.text}</span>
                  {acc && <span className="text-[11px] rounded-md px-1.5 py-0.5 text-white shrink-0" style={{ background: gradientOf(acc) }}>{acc.icon} {accLabel(acc)}</span>}
                </button>
                {editTasks && (
                  <button onClick={() => setDailyTasks(data.dailyTasks.filter(x => x.id !== task.id))} className={ICON_BTN} aria-label="Remove task"><Icon name="trash" className="w-4 h-4" /></button>
                )}
              </div>
            );
          })}
          {data.dailyTasks.length === 0 && !editTasks && <div className="text-sm text-zinc-400 py-2">No daily tasks. Tap Edit to add some.</div>}
        </div>
        {editTasks && (
          <div className="mt-2 space-y-2">
            <input value={newTask} onChange={e => setNewTask(e.target.value)} onKeyDown={e => e.key === 'Enter' && addTask()} placeholder="e.g. Learn 10 German words for content" className={INPUT} />
            <div className="flex gap-2">
              <select value={newTaskAcc} onChange={e => setNewTaskAcc(e.target.value)} className={INPUT + ' flex-1'}>
                <option value="">All accounts</option>
                {data.accounts.map(a => <option key={a.id} value={a.id}>{a.icon} {accLabel(a)}</option>)}
              </select>
              <button onClick={addTask} disabled={!newTask.trim()} className={BTN_PRIMARY}><Icon name="plus" /> Add</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function Dashboard({ onOpenAccount, onFilterList }) {
  const { data, openQuick, openIdea, accountsById } = useStore();
  const { accounts, ideas } = data;
  const today = todayISO();
  const in6 = toISO(addDays(new Date(), 6)); // "next 7 days" = today + 6 more days
  const weekStart = startOfWeek(new Date());
  const weekDays = [...Array(7)].map((_, k) => toISO(addDays(weekStart, k)));

  const accountStats = accounts.map(a => {
    const mine = ideas.filter(i => i.accountIds.includes(a.id));
    const upcoming = mine.filter(i => i.status !== 'posted' && i.date >= today && i.date <= in6).length;
    return { account: a, total: mine.length, active: mine.filter(i => i.status !== 'posted').length, upcoming, ...postingStats(ideas, a.id) };
  });
  const noPlan = accountStats.filter(s => s.upcoming === 0);
  const overdue = ideas.filter(i => i.status !== 'posted' && i.date && i.date < today);
  const statusCounts = STATUSES.map(s => ({ ...s, count: ideas.filter(i => i.status === s.id).length }));
  const maxCount = Math.max(1, ...statusCounts.map(s => s.count));
  const postedDate = i => i.postedAt || i.date;
  const postedThisWeek = ideas.filter(i => i.status === 'posted' && postedDate(i) >= weekDays[0] && postedDate(i) <= weekDays[6]).length;
  const plannedThisWeek = ideas.filter(i => i.status !== 'posted' && i.date >= weekDays[0] && i.date <= weekDays[6]).length;
  const inProgress = ideas.filter(i => ['script', 'shooting', 'editing'].includes(i.status)).length;

  const hour = new Date().getHours();
  const greeting = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';

  return (
    <div>
      {/* Hero */}
      <div className="rounded-3xl p-5 text-white shadow-lg shadow-pink-500/20" style={{ background: BRAND_GRADIENT }}>
        <div className="text-sm/5 opacity-90">{fmtDate(today, { weekday: 'long', day: 'numeric', month: 'long' })}</div>
        <div className="text-2xl font-extrabold tracking-tight mt-0.5">{greeting} 👋</div>
        <div className="mt-1 text-sm opacity-95">
          {plannedThisWeek} planned · {postedThisWeek} posted this week
        </div>
        <button onClick={() => openQuick()} className="mt-4 inline-flex items-center gap-2 rounded-xl bg-white/20 hover:bg-white/30 backdrop-blur px-4 min-h-[44px] font-semibold">
          <Icon name="plus" /> Dump an idea
        </button>
      </div>

      <TodayTargets onOpenAccount={onOpenAccount} />

      {/* Warnings */}
      {(noPlan.length > 0 || overdue.length > 0) && (
        <div className="mt-4 grid gap-2 lg:grid-cols-2">
          {noPlan.map(({ account }) => (
            <div key={account.id} className="flex items-center gap-3 rounded-2xl border border-amber-300/70 bg-amber-50 dark:bg-amber-500/10 dark:border-amber-500/30 p-3">
              <AccountAvatar account={account} size="w-9 h-9 text-base" />
              <div className="flex-1 min-w-0 text-sm">
                <div className="font-bold text-amber-900 dark:text-amber-200 truncate">{accLabel(account)}</div>
                <div className="text-amber-800/80 dark:text-amber-200/70">Nothing scheduled in the next 7 days</div>
              </div>
              <button onClick={() => openQuick({ accountIds: [account.id], date: today })} className="shrink-0 rounded-xl bg-amber-500 text-white font-semibold px-3 min-h-[40px] text-sm">Plan one</button>
            </div>
          ))}
          {overdue.length > 0 && (
            <button onClick={() => onFilterList({ when: 'overdue' })} className="w-full flex items-center gap-3 rounded-2xl border border-red-300/70 bg-red-50 dark:bg-red-500/10 dark:border-red-500/30 p-3 text-left">
              <span className="w-9 h-9 grid place-items-center text-lg">⏰</span>
              <div className="flex-1 text-sm">
                <div className="font-bold text-red-700 dark:text-red-300">{overdue.length} overdue idea{overdue.length > 1 ? 's' : ''}</div>
                <div className="text-red-700/70 dark:text-red-300/70">Planned date passed but not posted yet</div>
              </div>
              <Icon name="right" className="w-5 h-5 text-red-400" />
            </button>
          )}
        </div>
      )}

      {/* Quick stats */}
      <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mt-4">
        {[
          ['Total ideas', ideas.length, '💡', {}],
          ['In progress', inProgress, '🛠️', {}],
          ['Scheduled', statusCounts[4].count, '📅', { status: 'scheduled' }],
          ['Posted (week)', postedThisWeek, '✅', { status: 'posted' }],
        ].map(([label, value, emoji, filter]) => (
          <button key={label} onClick={() => onFilterList(filter)} className={`${CARD} p-3.5 text-left active:scale-[.98] transition`}>
            <div className="text-xs font-semibold text-zinc-500">{emoji} {label}</div>
            <div className="text-2xl font-extrabold mt-1 tabular-nums">{value}</div>
          </button>
        ))}
      </div>

      {/* Accounts */}
      <SectionTitle>Accounts</SectionTitle>
      <div className="grid grid-cols-1 min-[400px]:grid-cols-2 lg:grid-cols-4 gap-3">
        {accountStats.map(s => (
          <button key={s.account.id} onClick={() => onOpenAccount(s.account.id)} className={`${CARD} overflow-hidden text-left active:scale-[.98] transition`}>
            <div className="p-3 flex items-center gap-2.5 text-white" style={{ background: gradientOf(s.account) }}>
              <span className="text-xl">{s.account.icon}</span>
              <div className="min-w-0">
                <div className="font-bold truncate leading-tight">{s.account.name}</div>
                <div className="text-[11px] opacity-90">{PLATFORMS[s.account.platform].label}</div>
              </div>
            </div>
            <div className="p-3">
              <div className="grid grid-cols-3 text-center">
                <div><div className="text-lg font-extrabold tabular-nums">{s.total}</div><div className="text-[10px] text-zinc-500 font-semibold">IDEAS</div></div>
                <div><div className={`text-lg font-extrabold tabular-nums ${s.upcoming === 0 ? 'text-amber-500' : ''}`}>{s.upcoming}</div><div className="text-[10px] text-zinc-500 font-semibold">NEXT 7D</div></div>
                <div><div className="text-lg font-extrabold tabular-nums">{s.streak}{s.streak > 0 ? '🔥' : ''}</div><div className="text-[10px] text-zinc-500 font-semibold">WK STREAK</div></div>
              </div>
              <div className="mt-3 flex items-center justify-between gap-2">
                <WeekSquares weeks={s.weeks8} color={solidOf(s.account)} />
                <span className="text-[11px] text-zinc-500 whitespace-nowrap">{s.weeks8.filter(Boolean).length}/8 wks</span>
              </div>
            </div>
          </button>
        ))}
      </div>

      {/* On a computer: Pipeline and This week sit side by side */}
      <div className="lg:grid lg:grid-cols-2 lg:gap-5 lg:items-start">
      <div>
      {/* Pipeline */}
      <SectionTitle>Pipeline</SectionTitle>
      <div className={`${CARD} p-3 space-y-1`}>
        {statusCounts.map(s => (
          <button key={s.id} onClick={() => onFilterList({ status: s.id })} className="w-full flex items-center gap-3 min-h-[40px] rounded-lg px-1 hover:bg-zinc-50 dark:hover:bg-zinc-800/50">
            <span className="w-28 shrink-0 text-left text-sm font-semibold">{s.emoji} {s.label}</span>
            <div className="flex-1 h-2.5 rounded-full bg-zinc-100 dark:bg-zinc-800 overflow-hidden">
              <div className="h-full rounded-full" style={{ width: (s.count / maxCount) * 100 + '%', background: s.bar }} />
            </div>
            <span className="w-8 text-right text-sm font-bold tabular-nums">{s.count}</span>
          </button>
        ))}
        {/* per account breakdown */}
        <div className="pt-3 mt-2 border-t border-zinc-100 dark:border-zinc-800 overflow-x-auto no-scrollbar">
          <table className="w-full text-xs">
            <thead>
              <tr className="text-zinc-500">
                <th className="text-left font-semibold py-1 pr-2">Account</th>
                {STATUSES.map(s => <th key={s.id} className="font-normal px-1" title={s.label}>{s.emoji}</th>)}
              </tr>
            </thead>
            <tbody>
              {accounts.map(a => (
                <tr key={a.id} className="border-t border-zinc-100 dark:border-zinc-800">
                  <td className="py-1.5 pr-2 font-semibold whitespace-nowrap"><span className="inline-block w-2 h-2 rounded-full mr-1.5" style={{ background: solidOf(a) }} />{accLabel(a)}</td>
                  {STATUSES.map(s => {
                    const n = ideas.filter(i => i.status === s.id && i.accountIds.includes(a.id)).length;
                    return <td key={s.id} className={`text-center tabular-nums px-1 ${n ? 'font-bold' : 'text-zinc-300 dark:text-zinc-700'}`}>{n}</td>;
                  })}

              ))}

          </table>

      </div>

      </div>
      <div>
      {/* This week */}
      <SectionTitle>This week's plan</SectionTitle>
      <div className={`${CARD} divide-y divide-zinc-100 dark:divide-zinc-800`}>
        {weekDays.map((iso, k) => {
          const items = ideas.filter(i => i.date === iso).sort((a, b) => (a.time || '99').localeCompare(b.time || '99'));
          const isToday = iso === today;
          return (
            <div key={iso} className={`flex gap-3 p-3 ${isToday ? 'bg-pink-50/60 dark:bg-pink-500/5' : ''}`}>
              <div className="w-11 shrink-0 text-center">
                <div className={`text-[11px] font-bold ${isToday ? 'text-pink-600 dark:text-pink-400' : 'text-zinc-500'}`}>{WEEKDAYS[k].toUpperCase()}</div>
                <div className={`text-lg font-extrabold leading-tight ${iso < today ? 'text-zinc-400' : ''}`}>{fromISO(iso).getDate()}</div>
              </div>
              <div className="flex-1 min-w-0 space-y-1.5 self-center">
                {items.length === 0 && <div className="text-sm text-zinc-400">—</div>}
                {items.map(i => {
                  const accs = i.accountIds.map(id => accountsById[id]).filter(Boolean);
                  return (
                    <button key={i.id} onClick={() => openIdea(i.id)} className="w-full flex items-center gap-2 text-left min-h-[36px] rounded-lg hover:bg-zinc-50 dark:hover:bg-zinc-800/60 px-1">
                      <span className="flex -space-x-1 shrink-0">
                        {(accs.length ? accs : [null]).map((a, n) => <span key={n} className="w-3 h-3 rounded-full ring-2 ring-white dark:ring-zinc-900" style={{ background: a ? gradientOf(a) : '#a1a1aa' }} />)}
                      </span>
                      <span className={`flex-1 truncate text-sm font-medium ${i.status === 'posted' ? 'line-through text-zinc-400' : ''}`}>{i.title || 'Untitled'}</span>
                      <span className="text-xs text-zinc-500 shrink-0">{i.time ? fmtTime(i.time) : ''} {STATUS_BY_ID[i.status].emoji}</span>
                    </button>
                  );
                })}
              </div>
            </div>
          );
        })}
      </div>
      </div>
      </div>

      {ideas.length === 0 && (
        <div className="mt-6">
          <EmptyState emoji="🚀" title="No ideas yet" text="Tap the big + button to dump your first idea. Or load some sample ideas from Settings to explore." />
        </div>
      )}
    </div>
  );
}

function CalendarView() {
  const { data, accountsById, openQuick } = useStore();
  const [mode, setMode] = useState('month'); // 'month' | 'week'
  const [cursor, setCursor] = useState(() => new Date());
  const [selected, setSelected] = useState(todayISO());
  const [accFilter, setAccFilter] = useState([]);
  const today = todayISO();

  // Group dated ideas by day
  const byDate = {};
  data.ideas
    .filter(i => i.date && (accFilter.length === 0 || i.accountIds.some(id => accFilter.includes(id))))
    .forEach(i => { (byDate[i.date] ||= []).push(i); });
  Object.values(byDate).forEach(list => list.sort((a, b) => (a.time || '99').localeCompare(b.time || '99')));

  // Which accounts' colours to show for an idea (respecting the filter)
  const accsFor = i => {
    const list = i.accountIds.filter(id => accFilter.length === 0 || accFilter.includes(id)).map(id => accountsById[id]).filter(Boolean);
    return list.length ? list : [null];
  };

  const y = cursor.getFullYear(), m = cursor.getMonth();
  let days, title;
  if (mode === 'month') {
    const gridStart = startOfWeek(new Date(y, m, 1));
    const last = new Date(y, m + 1, 0);
    const weeks = Math.ceil((Math.round((last - gridStart) / 86400000) + 1) / 7);
    days = [...Array(weeks * 7)].map((_, k) => addDays(gridStart, k));
    title = cursor.toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });
  } else {
    const ws = startOfWeek(cursor);
    days = [...Array(7)].map((_, k) => addDays(ws, k));
    title = `${fmtDate(toISO(days[0]))} – ${fmtDate(toISO(days[6]))}`;
  }
  const move = dir => setCursor(mode === 'month' ? new Date(y, m + dir, 1) : addDays(cursor, 7 * dir));
  const goToday = () => { setCursor(new Date()); setSelected(today); };

  const selectedItems = byDate[selected] || [];

  return (
    <div>
      <div className="flex items-center gap-2">
        <div className="inline-flex rounded-xl bg-zinc-200/70 dark:bg-zinc-800 p-1">
          {['month', 'week'].map(md => (
            <button key={md} onClick={() => setMode(md)} className={`px-4 min-h-[36px] rounded-lg text-sm font-semibold capitalize ${mode === md ? 'bg-white dark:bg-zinc-950 shadow-sm' : 'text-zinc-500'}`}>{md}</button>
          ))}
        </div>
        <div className="flex-1" />
        <button onClick={goToday} className="px-3 min-h-[40px] rounded-xl text-sm font-semibold bg-zinc-100 dark:bg-zinc-800">Today</button>
      </div>

      <div className="flex items-center justify-between mt-3">
        <button onClick={() => move(-1)} className={ICON_BTN} aria-label="Previous"><Icon name="left" /></button>
        <div className="font-extrabold text-lg">{title}</div>
        <button onClick={() => move(1)} className={ICON_BTN} aria-label="Next"><Icon name="right" /></button>
      </div>

      <div className="mt-1"><AccountFilter value={accFilter} onChange={setAccFilter} /></div>

      {mode === 'month' ? (
        <>
          <div className={`${CARD} p-1.5 mt-3`}>
            <div className="grid grid-cols-7 text-center text-[11px] font-bold text-zinc-400 py-1">
              {WEEKDAYS.map(d => <div key={d}>{d[0]}<span className="hidden sm:inline">{d.slice(1)}</span></div>)}
            </div>
            <div className="grid grid-cols-7 gap-0.5">
              {days.map(d => {
                const iso = toISO(d);
                const items = byDate[iso] || [];
                const inMonth = d.getMonth() === m;
                const isSel = iso === selected;
                const dots = items.flatMap(i => accsFor(i));
                return (
                  <button key={iso} onClick={() => setSelected(iso)}
                    className={`min-h-[58px] sm:min-h-[96px] rounded-xl p-1 flex flex-col items-center sm:items-stretch text-left transition ${inMonth ? '' : 'opacity-35'} ${isSel ? 'bg-pink-50 ring-2 ring-pink-500 dark:bg-pink-500/10' : 'hover:bg-zinc-100 dark:hover:bg-zinc-800'}`}>
                    <span className={`text-xs font-bold w-6 h-6 grid place-items-center rounded-full ${iso === today ? 'bg-red-500 text-white' : ''}`}>{d.getDate()}</span>
                    {/* phone: coloured dots */}
                    <div className="flex flex-wrap justify-center gap-0.5 mt-1 sm:hidden">
                      {dots.slice(0, 4).map((a, n) => <span key={n} className="w-2 h-2 rounded-full" style={{ background: a ? solidOf(a) : '#a1a1aa' }} />)}

                    <div className="hidden sm:flex flex-col gap-0.5 mt-1">

                          {i.time ? fmtTime(i.time).replace(' ', '') + ' ' : ''}{i.title || 'Untitled'}
                        </span>
                      ))}
                      {items.length > 3 && <span className="text-[10px] text-zinc-500 px-1">+{items.length - 3} more</span>}
                    </div>
                  </button>
                );
              })}
            </div>
          </div>

          <div className="flex items-center justify-between mt-5 mb-2">
            <h3 className="font-extrabold">{fmtDate(selected, { weekday: 'long', day: 'numeric', month: 'short' })}</h3>

          </div>
          <div className="space-y-2">
            {selectedItems.length === 0 && <div className="text-sm text-zinc-400 py-3 text-center">Nothing planned for this day.</div>}
            {selectedItems.map(i => <IdeaCard key={i.id} idea={i} />)}
          </div>
        </>
      ) : (
        <div className="mt-3 space-y-3">
          {days.map(d => {
            const iso = toISO(d);
            const items = byDate[iso] || [];
            return (
              <div key={iso} className={`${CARD} p-3 ${iso === today ? 'ring-2 ring-pink-500/60' : ''}`}>
                <div className="flex items-center justify-between">
                  <div className="font-bold">
                    {d.toLocaleDateString('en-IN', { weekday: 'long' })} <span className="text-zinc-500 font-semibold">{fmtDate(iso)}</span>
                    {iso === today && <span className="ml-2 text-[11px] font-bold rounded-full bg-red-500 text-white px-2 py-0.5">TODAY</span>}
                  </div>
                  <button onClick={() => openQuick({ date: iso })} className={ICON_BTN} aria-label="Add idea on this day"><Icon name="plus" /></button>
                </div>
                <div className="space-y-2 mt-1">
                  {items.length === 0 ? <div className="text-sm text-zinc-400">—</div> : items.map(i => <IdeaCard key={i.id} idea={i} />)}
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

/* =====================================================================
   7. KANBAN BOARD
   Drag works with mouse AND touch (using "pointer events"):
   - Mouse: drag the whole card.
   - Phone: drag using the ⠿ handle (so normal scrolling still works).
   ===================================================================== */
function BoardView() {
  const { data, accountsById, updateIdea, openIdea } = useStore();
  const [accFilter, setAccFilter] = useState([]);
  const [drag, setDrag] = useState(null); // { id, title, x, y, over }
  const scrollRef = useRef(null);
  const justDragged = useRef(false);

  const ideas = data.ideas.filter(i => accFilter.length === 0 || i.accountIds.some(id => accFilter.includes(id)));

  const columnUnder = (x, y) => {
    const el = document.elementFromPoint(x, y);
    const col = el && el.closest('[data-status]');
    return col ? col.dataset.status : null;
  };

  function startDrag(e, idea) {
    const onHandle = !!e.target.closest('[data-grip]');
    if (e.pointerType !== 'mouse' && !onHandle) return; // touch on card body = normal scroll/tap
    if (e.button !== 0) return;
    const startX = e.clientX, startY = e.clientY;
    let last = { x: startX, y: startY };
    let active = false;

    // While dragging near an edge, auto-scroll the board / page
    const timer = setInterval(() => {
      if (!active || !scrollRef.current) return;
      const r = scrollRef.current.getBoundingClientRect();
      if (last.x < r.left + 48) scrollRef.current.scrollLeft -= 14;
      else if (last.x > r.right - 48) scrollRef.current.scrollLeft += 14;
      if (last.y < 80) window.scrollBy(0, -12);
      else if (last.y > window.innerHeight - 100) window.scrollBy(0, 12);
    }, 16);

    const onMove = ev => {
      last = { x: ev.clientX, y: ev.clientY };
      if (!active) {
        if (Math.hypot(ev.clientX - startX, ev.clientY - startY) < 6) return; // tiny move = still a tap
        active = true;
      }
      ev.preventDefault();
      setDrag({ id: idea.id, title: idea.title, x: ev.clientX, y: ev.clientY, over: columnUnder(ev.clientX, ev.clientY) });
    };
    const onUp = ev => {
      clearInterval(timer);
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      window.removeEventListener('pointercancel', onUp);
      if (active) {
        const target = columnUnder(ev.clientX, ev.clientY);
        if (target && target !== idea.status) updateIdea(idea.id, { status: target });
        justDragged.current = true;
        setTimeout(() => { justDragged.current = false; }, 50);
      }
      setDrag(null);
    };
    window.addEventListener('pointermove', onMove, { passive: false });
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
  }

  return (
    <div>
      <AccountFilter value={accFilter} onChange={setAccFilter} />
      <p className="text-xs text-zinc-500 mt-2">Drag cards between stages (on phone use the <b>⠿</b> handle). Tap a card to open it.</p>

      <div ref={scrollRef} className={`flex gap-3 overflow-x-auto no-scrollbar -mx-4 px-4 pb-6 pt-3 ${drag ? '' : 'snap-x snap-mandatory'}`}>
        {STATUSES.map(s => {
          const items = ideas.filter(i => i.status === s.id).sort((a, b) => PRIORITY_ORDER[a.priority] - PRIORITY_ORDER[b.priority] || (a.date || '9').localeCompare(b.date || '9'));
          const isOver = drag && drag.over === s.id;
          return (
            <div key={s.id} data-status={s.id}
              className={`snap-start shrink-0 w-[80vw] max-w-[300px] rounded-2xl p-2 transition ${isOver ? 'bg-pink-100 ring-2 ring-pink-500 dark:bg-pink-500/15' : 'bg-zinc-100 dark:bg-zinc-900/60'}`}>
              <div className="flex items-center justify-between px-1.5 py-1.5">
                <span className="font-bold text-sm">{s.emoji} {s.long || s.label}</span>
                <span className="text-xs font-bold rounded-full px-2 py-0.5 bg-white dark:bg-zinc-800 tabular-nums">{items.length}</span>
              </div>
              <div className="h-1 rounded-full mx-1.5 mb-2" style={{ background: s.bar }} />
              <div className="space-y-2 min-h-[120px]">
                {items.map(i => {
                  const accs = i.accountIds.map(id => accountsById[id]).filter(Boolean);
                  const pct = progressOf(i);
                  return (
                    <div key={i.id} onPointerDown={e => startDrag(e, i)}
                      onClick={() => { if (!justDragged.current) openIdea(i.id); }}
                      className={`${CARD} p-3 flex gap-2.5 select-none cursor-pointer ${drag?.id === i.id ? 'opacity-40' : ''}`}>
                      <AccountStripe accounts={accs} />
                      <div className="flex-1 min-w-0">
                        <div className="font-semibold text-sm leading-snug line-clamp-3">{i.title || <span className="text-zinc-400">Untitled</span>}</div>
                        <div className="flex flex-wrap gap-1 mt-1.5 items-center">
                          <FormatBadges formats={i.formats} />
                          {i.date && <span className="text-[11px] font-semibold text-zinc-500">🗓 {fmtDate(i.date)}</span>}
                          {i.priority === 'high' && <span className="text-[11px] font-bold text-red-500">● High</span>}
                        </div>
                        <div className="flex items-center gap-2 mt-2">
                          <ProgressBar pct={pct} className="h-1 flex-1" />
                          <span className="text-[10px] font-bold text-zinc-500 tabular-nums">{pct}%</span>
                        </div>
                      </div>
                      <span data-grip className="-mr-1.5 -my-1 w-8 shrink-0 grid place-items-center text-zinc-400 cursor-grab active:cursor-grabbing" style={{ touchAction: 'none' }} aria-label="Drag handle">
                        <Icon name="grip" className="w-5 h-5" />
                      </span>
                    </div>
                  );
                })}
                {items.length === 0 && <div className="text-xs text-zinc-400 text-center py-8 border-2 border-dashed border-zinc-300 dark:border-zinc-700 rounded-xl">Drop here</div>}
              </div>
            </div>
          );
        })}
      </div>

      {/* The floating card that follows your finger / mouse */}
      {drag && (
        <div className="fixed z-[60] pointer-events-none w-60 rounded-2xl bg-white dark:bg-zinc-800 shadow-2xl p-3 font-semibold text-sm ring-2 ring-pink-500"
          style={{ left: drag.x, top: drag.y, transform: 'translate(-50%,-60%) rotate(3deg)' }}>
          {drag.title || 'Untitled'}
          <div className="text-[11px] font-bold text-pink-600 dark:text-pink-400 mt-1">{drag.over ? `→ ${STATUS_BY_ID[drag.over].emoji} ${STATUS_BY_ID[drag.over].label}` : 'Move to a column'}</div>
        </div>
      )}
    </div>
  );
}

const DEFAULT_FILTERS = { q: '', account: 'all', format: 'all', status: 'all', priority: 'all', when: 'all', series: 'all', sort: 'date' };

function ListView({ filters, setFilters }) {
  const { data } = useStore();
  const [showFilters, setShowFilters] = useState(false);
  const f = filters;
  const up = patch => setFilters({ ...f, ...patch });

  const today = todayISO();
  const in6 = toISO(addDays(new Date(), 6));
  const monthPrefix = today.slice(0, 7);
  const q = f.q.trim().toLowerCase();
  const seriesNames = [...new Set(data.ideas.map(i => i.seriesName).filter(Boolean))].sort();

  const list = data.ideas.filter(i => {
    if (f.account !== 'all' && !i.accountIds.includes(f.account)) return false;
    if (f.format !== 'all' && !i.formats.includes(f.format)) return false;
    if (f.status !== 'all' && i.status !== f.status) return false;
    if (f.priority !== 'all' && i.priority !== f.priority) return false;
    if (f.series !== 'all' && i.seriesName !== f.series) return false;
    if (f.when === 'overdue' && !(i.date && i.date < today && i.status !== 'posted')) return false;
    if (f.when === 'today' && i.date !== today) return false;
    if (f.when === 'next7' && !(i.date >= today && i.date <= in6)) return false;
    if (f.when === 'month' && !(i.date || '').startsWith(monthPrefix)) return false;
    if (f.when === 'nodate' && i.date) return false;
    if (q) {
      const haystack = [i.title, i.description, i.notes, i.caption, i.hashtags, i.tags.join(' '), i.seriesName].join(' ').toLowerCase();
      if (!haystack.includes(q)) return false;
    }
    return true;
  });

  const byDate = (a, b) => (a.date || '9999').localeCompare(b.date || '9999') || (a.time || '99').localeCompare(b.time || '99');
  const sorters = {
    date: byDate,
    priority: (a, b) => PRIORITY_ORDER[a.priority] - PRIORITY_ORDER[b.priority] || byDate(a, b),
    status: (a, b) => STATUS_INDEX[a.status] - STATUS_INDEX[b.status] || byDate(a, b),
    updated: (a, b) => b.updatedAt - a.updatedAt,
    series: (a, b) => (a.seriesName || '~').localeCompare(b.seriesName || '~') || (a.seriesPart || 0) - (b.seriesPart || 0),
  };
  list.sort(sorters[f.sort] || byDate);

  const activeCount = ['account', 'format', 'status', 'priority', 'when', 'series'].filter(k => f[k] !== 'all').length;

  return (
    <div>
      <div className="flex gap-2">
        <div className="relative flex-1">
          <Icon name="search" className="w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 text-zinc-400" />
          <input value={f.q} onChange={e => up({ q: e.target.value })} placeholder="Search ideas, captions, tags…" className={INPUT + ' pl-10'} />
        </div>
        <button onClick={() => setShowFilters(v => !v)} className={`${BTN_GHOST} relative px-3`} aria-label="Filters">
          <Icon name="filter" />
          {activeCount > 0 && <span className="absolute -top-1 -right-1 w-5 h-5 rounded-full bg-pink-600 text-white text-[11px] grid place-items-center">{activeCount}</span>}
        </button>
      </div>

      {/* Status quick chips */}
      <div className="flex gap-2 overflow-x-auto no-scrollbar -mx-4 px-4 py-3">
        <ToggleChip active={f.status === 'all'} onClick={() => up({ status: 'all' })}>All</ToggleChip>
        {STATUSES.map(s => (
          <ToggleChip key={s.id} active={f.status === s.id} onClick={() => up({ status: f.status === s.id ? 'all' : s.id })}>
            {s.emoji} {s.label}
          </ToggleChip>
        ))}
      </div>

      {showFilters && (
        <div className={`${CARD} p-3 mb-3 grid grid-cols-2 gap-3`}>
          <SelectBox label="Account" value={f.account} onChange={v => up({ account: v })} options={[['all', 'All accounts'], ...data.accounts.map(a => [a.id, `${a.icon} ${accLabel(a)}`])]} />
          <SelectBox label="Format" value={f.format} onChange={v => up({ format: v })} options={[['all', 'All formats'], ...FORMATS.map(x => [x.id, `${x.emoji} ${x.label}`])]} />
          <SelectBox label="Date" value={f.when} onChange={v => up({ when: v })} options={[['all', 'Any date'], ['overdue', '⏰ Overdue'], ['today', 'Today'], ['next7', 'Next 7 days'], ['month', 'This month'], ['nodate', 'No date yet']]} />
          <SelectBox label="Priority" value={f.priority} onChange={v => up({ priority: v })} options={[['all', 'Any priority'], ...PRIORITIES.map(p => [p.id, p.label])]} />
          <SelectBox label="Series" value={f.series} onChange={v => up({ series: v })} options={[['all', 'All series'], ...seriesNames.map(n => [n, n])]} />
          <SelectBox label="Sort by" value={f.sort} onChange={v => up({ sort: v })} options={[['date', 'Post date'], ['priority', 'Priority'], ['status', 'Stage'], ['updated', 'Last edited'], ['series', 'Series / part']]} />
          <button onClick={() => setFilters({ ...DEFAULT_FILTERS, q: f.q })} className={`${BTN_GHOST} col-span-2`}>Clear filters</button>
        </div>
      )}

      <div className="text-xs font-semibold text-zinc-500 mb-2">{list.length} idea{list.length === 1 ? '' : 's'}</div>
      <div className="space-y-2">
        {list.map(i => <IdeaCard key={i.id} idea={i} />)}
      </div>
      {list.length === 0 && <EmptyState emoji="🔍" title="No ideas match" text="Try clearing filters or search." />}
    </div>
  );
}

          <button onClick={() => setEditOpen(true)} className="inline-flex items-center gap-1.5 rounded-xl bg-white/20 hover:bg-white/30 px-3 min-h-[40px] text-sm font-semibold"><Icon name="edit" className="w-4 h-4" /> Edit</button>

          <div className="min-w-0">

            <div className="text-sm opacity-90">{PLATFORMS[account.platform].label}</div>
          </div>
        </div>
        <div className="grid grid-cols-4 gap-2 mt-4 text-center">

        </div>
        <WeekSquares weeks={stats.weeks8} color={solidOf(account)} />

      <SectionTitle right={<button onClick={() => openQuick({ accountIds: [account.id] })} className="inline-flex items-center gap-1 text-sm font-semibold text-pink-600 dark:text-pink-400 min-h-[40px] px-2"><Icon name="plus" className="w-4 h-4" /> New idea</button>}>

/* Set how much to post on this account: e.g. "1 Reel per day at 7 PM", "2 Carousels per week on Tue & Fri" */
function TargetsEditor({ account }) {
  const { data, updateAccount } = useStore();
  const targets = account.targets || [];
  const save = list => updateAccount(account.id, { targets: list });
  const upd = (id, patch) => save(targets.map(t => (t.id === id ? { ...t, ...patch } : t)));
  // This platform's formats first
  const formats = [...FORMATS].sort((x, y) => (y.platform === account.platform) - (x.platform === account.platform));
  const addTarget = () => {
    const f = formats[0];
    save([...targets, { id: uid(), format: f.id, count: 1, per: 'day', days: ALL_DAYS, time: '' }]);
  };

  return (
    <div className="space-y-2">
      {targets.map(t => {
        const s = targetStatus(data.ideas, account.id, t);
        return (
          <div key={t.id} className={`${CARD} p-3 space-y-3`}>
            <div className="flex items-center gap-2">
              <select value={t.format} onChange={e => upd(t.id, { format: e.target.value })} className={INPUT + ' flex-1 font-semibold'} aria-label="Format">
                {formats.map(f => <option key={f.id} value={f.id}>{f.emoji} {f.label}</option>)}
              </select>
              <button onClick={() => save(targets.filter(x => x.id !== t.id))} className={ICON_BTN} aria-label="Delete target"><Icon name="trash" /></button>
            </div>

            <div className="flex items-center gap-2">
              {/* how many */}
              <div className="flex items-center rounded-xl border border-zinc-200 dark:border-zinc-700">
                <button onClick={() => upd(t.id, { count: Math.max(1, t.count - 1) })} className="w-11 h-11 text-xl font-bold" aria-label="Less">−</button>
                <span className="w-8 text-center font-extrabold tabular-nums">{t.count}</span>
                <button onClick={() => upd(t.id, { count: Math.min(20, t.count + 1) })} className="w-11 h-11 text-xl font-bold" aria-label="More">+</button>
              </div>
              {/* per day / week */}
              <div className="flex-1 grid grid-cols-2 rounded-xl bg-zinc-100 dark:bg-zinc-800 p-1">
                {[['day', 'per day'], ['week', 'per week']].map(([id, l]) => (
                  <button key={id} onClick={() => upd(t.id, { per: id })} className={`min-h-[36px] rounded-lg text-sm font-semibold ${t.per === id ? 'bg-white dark:bg-zinc-950 shadow-sm' : 'text-zinc-500'}`}>{l}</button>
                ))}
              </div>
            </div>

            {/* which days */}
            <div>
              <div className="text-xs font-semibold text-zinc-500 mb-1.5">{t.per === 'day' ? 'On these days' : 'Preferred days'} · {daysLabel(t.days)}</div>
              <div className="grid grid-cols-7 gap-1">
                {WEEKDAYS.map((d, k) => {
                  const on = t.days.includes(k);
                  return (
                    <button key={d} onClick={() => { const next = toggleIn(t.days, k); if (next.length) upd(t.id, { days: next.sort() }); }}
                      className={`min-h-[40px] rounded-lg text-xs font-bold ${on ? 'text-white' : 'bg-zinc-100 text-zinc-500 dark:bg-zinc-800'}`}
                      style={on ? { background: gradientOf(account) } : undefined}>{d.slice(0, 2)}</button>
                  );
                })}
              </div>
            </div>

            {/* time */}
            <div className="flex items-center gap-2">
              <span className="text-xs font-semibold text-zinc-500 w-20">Post time</span>
              <input type="time" value={t.time} onChange={e => upd(t.id, { time: e.target.value })} className={INPUT + ' flex-1'} />
              {t.time && <button onClick={() => upd(t.id, { time: '' })} className="text-xs font-semibold text-zinc-500 underline px-1 min-h-[36px]">Any</button>}
            </div>

            <div className="text-xs text-zinc-500">
              {t.per === 'day' ? 'Today' : 'This week'}: <b className={s.met ? 'text-emerald-600' : ''}>{s.done}/{s.need} posted</b>{s.planned ? ` · ${s.planned} planned` : ''}
            </div>
          </div>
        );
      })}
      <button onClick={addTarget} className={`${BTN_GHOST} w-full`}><Icon name="plus" /> Add target</button>
    </div>
  );
}

// Reusable hashtag groups for one account
function HashtagSets({ account }) {
  const { updateAccount, toast } = useStore();
  const sets = account.hashtagSets || [];
  const [name, setName] = useState('');
  const [tags, setTags] = useState('');
  const save = list => updateAccount(account.id, { hashtagSets: list });
  const add = () => {
    if (!tags.trim()) return;
    save([...sets, { id: uid(), name: name.trim() || `Set ${sets.length + 1}`, tags: mergeHashtags('', tags) }]);
    setName(''); setTags(''); toast('Hashtag set saved');
  };
  return (
    <div className="space-y-2">
      {sets.map(s => (
        <div key={s.id} className={`${CARD} p-3`}>
          <div className="flex items-center gap-2">
            <input value={s.name} onChange={e => save(sets.map(x => (x.id === s.id ? { ...x, name: e.target.value } : x)))} className="flex-1 min-w-0 bg-transparent font-bold outline-none min-h-[36px]" aria-label="Set name" />
            <span className="text-xs text-zinc-500">{parseHashtags(s.tags).length} tags</span>
            <button onClick={async () => toast((await copyText(s.tags)) ? 'Hashtags copied ✓' : 'Copy failed')} className={ICON_BTN} aria-label="Copy"><Icon name="copy" /></button>
            <button onClick={() => { if (confirm(`Delete hashtag set "${s.name}"?`)) save(sets.filter(x => x.id !== s.id)); }} className={ICON_BTN} aria-label="Delete"><Icon name="trash" /></button>
          </div>
          <AutoTextarea minRows={2} value={s.tags} onChange={v => save(sets.map(x => (x.id === s.id ? { ...x, tags: v } : x)))} className="text-sm mt-1" />
        </div>
      ))}
      <div className={`${CARD} p-3 space-y-2 border-dashed`}>
        <input value={name} onChange={e => setName(e.target.value)} placeholder="Set name (e.g. Travel core)" className={INPUT} />
        <AutoTextarea minRows={2} value={tags} onChange={setTags} placeholder="#travel #budgettravel #india" />
        <button onClick={add} disabled={!tags.trim()} className={`${BTN_PRIMARY} w-full`}><Icon name="plus" /> Save hashtag set</button>
      </div>
    </div>
  );
}

/* =====================================================================

    ['details', 'Details'],
    ['script', 'Script'],
    ['links', `Links${idea.links.length ? ` · ${idea.links.length}` : ''}`],

  const headerRight = (
    <>
      <button onClick={() => setDupOpen(true)} className={ICON_BTN} aria-label="Duplicate / repurpose" title="Duplicate / repurpose"><Icon name="layers" /></button>

  return (

        className="!border-transparent !bg-transparent !px-0 !text-2xl font-extrabold tracking-tight focus:!ring-0" />
      <div className="flex items-center gap-2 mt-1">
        <ProgressBar pct={pct} className="h-2 flex-1" />
        <span className="text-xs font-bold text-zinc-500 tabular-nums">{pct}% ready</span>
      </div>

      {/* Tabs (sticky while scrolling) */}
      <div className="sticky -top-4 z-10 -mx-4 px-4 pt-3 pb-2 bg-zinc-50/95 dark:bg-zinc-950/95 backdrop-blur">
        <div className="flex gap-1.5 overflow-x-auto no-scrollbar">
          {tabs.map(([id, label]) => (
            <button key={id} onClick={() => setTab(id)} className={`shrink-0 px-3.5 min-h-[40px] rounded-xl text-sm font-semibold ${tab === id ? 'bg-zinc-900 text-white dark:bg-white dark:text-zinc-900' : 'bg-zinc-200/60 text-zinc-600 dark:bg-zinc-800 dark:text-zinc-300'}`}>{label}</button>

        {tab === 'caption' && <CaptionTab idea={idea} set={set} />}
        {tab === 'checklist' && <ChecklistTab idea={idea} set={set} />}

    <div className="space-y-6">
      <Field label="Stage">

              {s.emoji} {s.long || s.label}

        <button onClick={() => set({ date: '', time: '' })} className="-mt-4 text-xs font-semibold text-zinc-500 underline min-h-[32px]">Clear date</button>

          <input type="number" min="1" inputMode="numeric" value={idea.seriesPart ?? ''} onChange={e => set({ seriesPart: e.target.value ? Number(e.target.value) : null })} placeholder="Part" className={INPUT + ' !w-24'} />

// Shows the other parts of the same series
function SeriesSiblings({ idea }) {
  const { data, openIdea } = useStore();
  if (!idea.seriesName) return null;
  const parts = data.ideas.filter(i => i.seriesName === idea.seriesName).sort((a, b) => (a.seriesPart || 0) - (b.seriesPart || 0));
  if (parts.length < 2) return null;
  return (
    <div className="mt-2 flex flex-wrap gap-1.5">
      {parts.map(p => (
        <button key={p.id} onClick={() => p.id !== idea.id && openIdea(p.id)}
          className={`rounded-lg px-2.5 min-h-[34px] text-xs font-semibold ${p.id === idea.id ? 'bg-pink-600 text-white' : 'bg-zinc-100 dark:bg-zinc-800'}`}>
          #{p.seriesPart || '?'} {STATUS_BY_ID[p.status].emoji}
        </button>
      ))}
    </div>
  );
}

function TagInput({ value, onChange }) {
  const [text, setText] = useState('');
  const add = raw => {
    const parts = raw.split(',').map(s => s.trim().replace(/^#/, '')).filter(Boolean);
    if (parts.length) onChange([...new Set([...value, ...parts])]);
    setText('');
  };
  return (
    <div className={`${INPUT} flex flex-wrap items-center gap-1.5 py-1.5 h-auto`}>
      {value.map(t => (
        <span key={t} className="inline-flex items-center gap-1 rounded-lg bg-zinc-100 dark:bg-zinc-800 pl-2.5 pr-1 py-1 text-sm font-medium">
          {t}
          <button onClick={() => onChange(value.filter(x => x !== t))} className="w-6 h-6 grid place-items-center rounded-md hover:bg-zinc-200 dark:hover:bg-zinc-700" aria-label={`Remove ${t}`}><Icon name="x" className="w-3.5 h-3.5" /></button>
        </span>
      ))}
      <input value={text} placeholder={value.length ? '' : 'travel, tips…'}
        onChange={e => (e.target.value.endsWith(',') ? add(e.target.value) : setText(e.target.value))}
        onKeyDown={e => {
          if (e.key === 'Enter') { e.preventDefault(); add(text); }
          if (e.key === 'Backspace' && !text && value.length) onChange(value.slice(0, -1));
        }}
        onBlur={() => text && add(text)}
        className="flex-1 min-w-[90px] bg-transparent outline-none min-h-[32px]" />
    </div>
  );
}

function ScriptTab({ idea, set }) {
  const words = wordCount(idea.notes);
  return (
    <Field label="Script / notes" hint={`${words} words · ~${voiceoverTime(words)} voiceover`}>
      <AutoTextarea minRows={14} value={idea.notes} onChange={v => set({ notes: v })}

function LinkGroup({ type, idea, set }) {
  const t = LINK_TYPES[type];
  const links = idea.links.filter(l => l.type === type);
  const [label, setLabel] = useState('');
  const [url, setUrl] = useState('');
  const [editingId, setEditingId] = useState(null);

  const add = () => {
    if (!url.trim()) return;
    set({ links: [...idea.links, { id: uid(), type, label: label.trim() || hostOf(url), url: normalizeUrl(url) }] });
    setLabel(''); setUrl('');
  };
  const update = (id, patch) => set({ links: idea.links.map(l => (l.id === id ? { ...l, ...patch } : l)) });
  const remove = id => set({ links: idea.links.filter(l => l.id !== id) });

  return (
    <div>
      <div className="flex items-baseline justify-between mb-2">
        <h3 className="font-bold">{t.emoji} {t.label}</h3>
        <span className="text-xs text-zinc-400">{t.hint}</span>
      </div>
      <div className="space-y-2">
        {links.map(l => editingId === l.id ? (
          <div key={l.id} className={`${CARD} p-2 space-y-2`}>
            <input value={l.label} onChange={e => update(l.id, { label: e.target.value })} className={INPUT} placeholder="Label" />
            <input value={l.url} onChange={e => update(l.id, { url: e.target.value })} onBlur={e => update(l.id, { url: normalizeUrl(e.target.value) })} className={INPUT} placeholder="https://" inputMode="url" />
            <button onClick={() => setEditingId(null)} className={`${BTN_PRIMARY} w-full`}>Done</button>
          </div>
        ) : (
          <div key={l.id} className={`${CARD} flex items-center gap-1 pl-3 pr-1`}>
            <a href={normalizeUrl(l.url)} target="_blank" rel="noopener noreferrer" className="flex-1 min-w-0 py-2.5 group">
              <div className="font-semibold truncate group-hover:underline flex items-center gap-1.5">{l.label || hostOf(l.url)} <Icon name="external" className="w-3.5 h-3.5 shrink-0 text-zinc-400" /></div>
              <div className="text-xs text-zinc-500 truncate">{hostOf(l.url)}</div>
            </a>
            <button onClick={() => setEditingId(l.id)} className={ICON_BTN} aria-label="Edit link"><Icon name="edit" className="w-4 h-4" /></button>
            <button onClick={() => remove(l.id)} className={ICON_BTN} aria-label="Delete link"><Icon name="trash" className="w-4 h-4" /></button>
          </div>
        ))}
        <div className="grid grid-cols-[1fr_auto] gap-2">
          <input value={label} onChange={e => setLabel(e.target.value)} placeholder="Label (optional)" className={INPUT + ' col-span-2'} />
          <input value={url} onChange={e => setUrl(e.target.value)} onKeyDown={e => e.key === 'Enter' && add()} placeholder="Paste link…" inputMode="url" className={INPUT} />
          <button onClick={add} disabled={!url.trim()} className={`${BTN_PRIMARY} px-4`}><Icon name="plus" /></button>
        </div>
      </div>
    </div>
  );
}

// A text field with a label, character counter and Copy button
function CopyField({ label, value, onChange, placeholder, multiline = true, minRows = 3, max, info, extra }) {
  const { toast } = useStore();
  const count = (value || '').length;
  const copy = async () => {
    if (!value) return toast('Nothing to copy yet');
    toast((await copyText(value)) ? `${label} copied ✓` : 'Copy failed');
  };
  return (
    <div>
      <div className="flex items-center justify-between gap-2 mb-1.5">
        <span className="text-sm font-semibold text-zinc-600 dark:text-zinc-400">{label}</span>
        <div className="flex items-center gap-2">
          {info && <span className="text-xs text-zinc-400">{info}</span>}
          {max && <span className={`text-xs tabular-nums ${count > max ? 'text-red-500 font-bold' : 'text-zinc-400'}`}>{count}/{max}</span>}
          <button type="button" onClick={copy} className="inline-flex items-center gap-1 rounded-lg px-3 min-h-[36px] text-sm font-semibold bg-zinc-900 text-white dark:bg-white dark:text-zinc-900 active:scale-95">
            <Icon name="copy" className="w-4 h-4" /> Copy
          </button>
        </div>
      </div>
      {multiline
        ? <AutoTextarea minRows={minRows} value={value} onChange={onChange} placeholder={placeholder} />
        : <input value={value} onChange={e => onChange(e.target.value)} placeholder={placeholder} className={INPUT} />}
      {extra}
    </div>
  );
}

function CaptionTab({ idea, set }) {
  const { data, updateAccount, toast } = useStore();
  const [showYT, setShowYT] = useState(false);
  const [saveOpen, setSaveOpen] = useState(false);
  const [setName, setSetName] = useState('');

  const chosen = data.accounts.filter(a => idea.accountIds.includes(a.id));
  const relevant = chosen.length ? chosen : data.accounts;
  const [saveTo, setSaveTo] = useState(relevant[0]?.id || '');
  const sets = relevant.flatMap(a => (a.hashtagSets || []).map(s => ({ ...s, account: a })));
  const tagCount = parseHashtags(idea.hashtags).length;

  const hasYT = chosen.some(a => a.platform === 'youtube') || idea.formats.some(f => f.startsWith('yt')) || idea.ytTitle || idea.ytDescription || idea.ytTags;

  const saveSet = () => {
    const acc = data.accounts.find(a => a.id === saveTo);
    if (!acc || !idea.hashtags.trim()) return;
    updateAccount(acc.id, { hashtagSets: [...(acc.hashtagSets || []), { id: uid(), name: setName.trim() || `Set ${(acc.hashtagSets || []).length + 1}`, tags: mergeHashtags('', idea.hashtags) }] });
    setSaveOpen(false); setSetName(''); toast(`Saved to ${accLabel(acc)}`);
  };

  const copyBoth = async () => {
    const text = [idea.caption, idea.hashtags].filter(Boolean).join('\n\n');
    if (!text) return toast('Nothing to copy yet');
    toast((await copyText(text)) ? 'Caption + hashtags copied ✓' : 'Copy failed');
  };

  return (
    <div className="space-y-6">
      <CopyField label="Caption" value={idea.caption} onChange={v => set({ caption: v })} max={2200} minRows={5} placeholder="Write your caption…" />

      <CopyField label="Hashtags" value={idea.hashtags} onChange={v => set({ hashtags: v })} minRows={2}
        info={<span className={tagCount > 30 ? 'text-red-500 font-bold' : ''}>{tagCount} tags</span>}
        placeholder="#reels #creator"
        extra={
          <div className="mt-2 space-y-2">
            {sets.length > 0 && (
              <div className="flex flex-wrap gap-1.5">

/* Type the same password on phone and computer once → both use the same cloud data forever */
function PasswordConnect({ onDone }) {
  const { connectSync } = useStore();
  const [pw, setPw] = useState('');
  const [show, setShow] = useState(false);
  const [working, setWorking] = useState(false);
  const ok = pw.trim().length >= 6;
  const go = async () => {
    setWorking(true);

    setWorking(false);

  return (
    <form onSubmit={e => { e.preventDefault(); if (ok && !working) go(); }} className="space-y-2">
      <p className="text-xs text-zinc-500">Use the <b>same password</b> on your phone and your computer. Type it once per device – after that everything syncs by itself.</p>

}

function SettingsSheet({ onClose }) {

  return (
