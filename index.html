<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#6366f1" />
<title>App Ideas Tracker</title>
<link rel="icon" href="icons/icon-192.png" />
<!-- PWA: lets you "install" the site as an app on your phone, and open it offline -->
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<script>
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
</script>

<!--
  =====================================================================
  APP IDEAS TRACKER
  ---------------------------------------------------------------------
  A single-file web app (HTML + CSS + plain JavaScript, no build step).
  - All data lives in your browser's localStorage (no login, no server).
  - Open this file in any modern browser and it just works.

  File layout:
    1. <style>   -> all the design (colours, cards, dark mode, etc.)
    2. <body>    -> a few empty containers that JavaScript fills in
    3. <script>  -> all the logic, split into numbered sections
  =====================================================================
-->

<style>
  /* ---------- 1. Design tokens (colours) ---------- */
  /* Light theme is the default. */
  :root {
    --bg: #f5f6fb;
    --surface: #ffffff;
    --surface-2: #eef0f6;
    --text: #0f172a;
    --muted: #64748b;
    --border: #e2e6ef;
    --primary: #6366f1;
    --primary-ink: #ffffff;
    --danger: #e11d48;
    --success: #16a34a;
    --warning: #d97706;
    --shadow: 0 1px 2px rgba(15, 23, 42, .05), 0 6px 18px rgba(15, 23, 42, .06);
    --radius: 18px;
    color-scheme: light;
  }

  /* Dark theme: used when the phone/PC is in dark mode (unless user forced light) ... */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b0f1a;
      --surface: #141a29;
      --surface-2: #1d2537;
      --text: #e6eaf3;
      --muted: #94a0b8;
      --border: #263049;
      --primary: #8b8ff8;
      --primary-ink: #0b0f1a;
      --danger: #fb7185;
      --success: #4ade80;
      --warning: #fbbf24;
      --shadow: none;
      color-scheme: dark;
    }
  }
  /* ... or when the user picks dark mode with the toggle button. */
  :root[data-theme="dark"] {
    --bg: #0b0f1a;
    --surface: #141a29;
    --surface-2: #1d2537;
    --text: #e6eaf3;
    --muted: #94a0b8;
    --border: #263049;
    --primary: #8b8ff8;
    --primary-ink: #0b0f1a;
    --danger: #fb7185;
    --success: #4ade80;
    --warning: #fbbf24;
    --shadow: none;
    color-scheme: dark;
  }

  /* ---------- 2. Base ---------- */
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
    padding-bottom: calc(96px + env(safe-area-inset-bottom));
    transition: background-color .2s;
  }
  a { color: var(--primary); }
  h1, h2, h3, h4 { line-height: 1.25; }
  .muted { color: var(--muted); }
  .small { font-size: .85rem; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row-between { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .stack { display: grid; gap: 12px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  /* ---------- 3. Top bar ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 4px;
    padding: 8px 8px 8px 16px;
    padding-top: calc(8px + env(safe-area-inset-top));
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }
  .topbar.has-back { padding-left: 4px; }
  .topbar-title {
    flex: 1; margin: 0; font-size: 1.1rem; font-weight: 700;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .page { max-width: 720px; margin: 0 auto; padding: 16px; }

  /* ---------- 4. Buttons ---------- */
  .icon-btn {
    min-width: 44px; height: 44px; padding: 0 6px;
    border: 0; border-radius: 12px; background: transparent;
    color: var(--text); font-size: 1.2rem; cursor: pointer;
    display: inline-grid; place-items: center; text-decoration: none;
  }
  .icon-btn:hover { background: var(--surface-2); }
  .btn {
    min-height: 46px; padding: 0 16px;
    border: 1px solid var(--border); border-radius: 12px;
    background: var(--surface); color: var(--text);
    font: inherit; font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none; transition: transform .1s, background-color .15s;
  }
  .btn:active, .icon-btn:active { transform: scale(.96); }
  .btn.primary { background: var(--primary); color: var(--primary-ink); border-color: transparent; }
  .btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, transparent); background: transparent; }
  .btn.ghost { background: transparent; }
  .btn.block { width: 100%; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn-row > .btn { flex: 1 1 140px; }

  /* ---------- 5. Cards ---------- */
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow);
  }
  .list { display: grid; gap: 12px; }
  .idea-card { display: block; color: inherit; text-decoration: none; transition: transform .15s, border-color .15s; }
  .idea-card:hover { border-color: color-mix(in srgb, var(--primary) 45%, var(--border)); }
  .idea-card:active { transform: scale(.985); }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .card-top h3 { margin: 0; font-size: 1.05rem; word-break: break-word; }
  .card-desc {
    margin: 4px 0 12px; color: var(--muted); font-size: .92rem;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card-meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 10px; font-size: .8rem; color: var(--muted); flex-wrap: wrap; }
  .tag-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .tag { font-size: .75rem; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }

  /* ---------- 6. Badges (status / priority) ---------- */
  /* Each badge gets its colour from the --c variable set inline in HTML. */
  .badge {
    --c: #888;
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 10px; border-radius: 999px;
    font-size: .78rem; font-weight: 700; white-space: nowrap;
    background: color-mix(in srgb, var(--c) 16%, transparent);
    color: color-mix(in srgb, var(--c) 75%, var(--text));
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); display: inline-block; }

  /* ---------- 7. Progress bars ---------- */
  .progress { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
  .progress.lg { height: 12px; }
  .bar {
    height: 100%; width: 0; border-radius: inherit;
    background: var(--c, var(--primary));
    transition: width .9s cubic-bezier(.22, 1, .36, 1);
  }
  .progress-label { display: flex; justify-content: space-between; font-size: .85rem; margin-bottom: 6px; }
  .progress-label b { font-variant-numeric: tabular-nums; }

  /* ---------- 8. Form controls ---------- */
  input, select, textarea {
    font: inherit; color: var(--text); background: var(--surface);
    border: 1px solid var(--border); border-radius: 12px;
    padding: 10px 12px; min-height: 46px; width: 100%;
  }
  textarea { resize: vertical; min-height: 80px; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--primary); outline-offset: 0; border-color: transparent; }
  input[type="range"] { padding: 0; accent-color: var(--primary); border: 0; background: transparent; }
  input[type="checkbox"] { width: 20px; min-height: 20px; height: 20px; accent-color: var(--primary); }
  .field { display: grid; gap: 6px; margin-bottom: 16px; }
  .field > .label { font-weight: 600; font-size: .9rem; }
  .hint { font-size: .8rem; color: var(--muted); }
  .form-section { margin-bottom: 16px; }
  .form-section h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 12px; }
  .check { display: flex; align-items: center; gap: 10px; min-height: 44px; cursor: pointer; font-weight: 500; }

  /* ---------- 9. Chips (filters, multi-select options) ---------- */
  .chips-row {
    display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
    margin: 12px -16px 4px; padding: 0 16px 4px;
  }
  .chips-row::-webkit-scrollbar { display: none; }
  .chip-group { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    flex: none; position: relative; user-select: none;
    min-height: 40px; padding: 0 14px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    font: inherit; font-size: .9rem; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: background-color .15s, color .15s;
  }
  .chip input { position: absolute; opacity: 0; pointer-events: none; width: 1px; height: 1px; }
  .chip.active, .chip:has(input:checked) { background: var(--primary); color: var(--primary-ink); border-color: transparent; }
  .chip:has(input:focus-visible) { outline: 2px solid var(--primary); outline-offset: 2px; }
  .chip .count { font-size: .75rem; opacity: .75; }

  /* Folder tabs on Home (Apps / VR) */
  .folder-tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 4px; margin: 0 0 12px;
    border: 1px solid var(--border); border-radius: 14px; background: var(--surface); }
  .folder-tab { min-height: 44px; border: 0; border-radius: 10px; background: transparent; color: var(--text);
    font: inherit; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
  @media (max-width: 560px) { .folder-tabs { grid-template-columns: 1fr 1fr; } }
  .folder-tab.active { background: var(--primary); color: var(--primary-ink); }
  .misc-folder { border-style: dashed; background: color-mix(in srgb, var(--primary) 6%, var(--surface)); }
  .misc-folder-ico { font-size: 1.5rem; line-height: 1; }
  .misc-peek { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: .9rem; }
  .misc-peek li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .person-switch { display: flex; gap: 4px; padding: 4px; margin: 10px 0; border-radius: 14px;
    background: var(--surface-2); border: 1px solid var(--border); }
  .person-switch button { flex: 1; min-height: 44px; border: 0; border-radius: 10px; background: transparent; color: var(--muted);
    font: inherit; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .person-switch button.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,.18); }
  .folder-tab .count { font-size: .75rem; opacity: .75; font-weight: 500; }
  .drawer h3 { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 14px 8px 6px; }

  /* Misc to-do list */
  .todo-add { display: flex; gap: 8px; margin-bottom: 12px; }
  .todo-add input { flex: 1; min-width: 0; }
  .todo-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .todo { display: flex; align-items: center; gap: 10px; padding: 6px 6px 6px 10px; min-height: 52px;
    border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
  .todo-check { flex: none; width: 28px; height: 28px; border-radius: 7px; border: 2px solid var(--muted);
    background: transparent; color: #fff; font-weight: 800; cursor: pointer; display: grid; place-items: center; padding: 0; }
  .todo-check:hover { border-color: var(--success); }
  .todo.done .todo-check { background: var(--success); border-color: var(--success); }
  .todo-text { flex: 1; min-width: 0; word-break: break-word; }
  .todo.done .todo-text { text-decoration: line-through; color: var(--muted); }
  .todo-del { font-size: .9rem; color: var(--muted); }
  .todo-item { display: grid; gap: 6px; }
  .todo-children { margin-left: 22px; padding-left: 10px; border-left: 2px solid var(--border); }
  .todo-children .todo { min-height: 46px; }
  .todo-arrow, .todo-arrow-space { flex: none; width: 22px; margin-right: -6px; }
  .todo-arrow { height: 32px; border: 0; background: transparent; color: var(--muted); font-size: 1.3rem; cursor: pointer;
    padding: 0; transition: transform .15s; }
  .todo-arrow.open { transform: rotate(90deg); }
  .todo-count { flex: none; font-size: .75rem; color: var(--muted); white-space: nowrap; }
  .todo-sub { font-size: 1.1rem; color: var(--primary); }
  @media (max-width: 420px) { .todo-children { margin-left: 10px; padding-left: 8px; } }

  /* 🔥 Priority */
  .prio-btn { font-size: 1rem; filter: grayscale(1); opacity: .35; }
  .prio-btn.on { filter: none; opacity: 1; }
  .todo.prio { border-color: color-mix(in srgb, var(--danger) 55%, var(--border)); background: color-mix(in srgb, var(--danger) 6%, var(--surface)); }
  .prio-where { font-size: .72rem; color: var(--muted); }
  .hero-prio { min-height: 30px; }
  @media (max-width: 480px) {
    .todo { gap: 6px; padding-right: 2px; }
    .todo .icon-btn { min-width: 32px; width: 32px; padding: 0; }
  }
  .hero-prio.on { background: color-mix(in srgb, var(--danger) 14%, transparent); color: var(--danger); border-color: transparent; }

  /* Quick note + Inbox */
  .quick-page textarea { min-height: 180px; font-size: 1.05rem; }
  .inbox-banner { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; text-decoration: none; color: inherit;
    border-color: color-mix(in srgb, var(--warning) 45%, var(--border)); background: color-mix(in srgb, var(--warning) 8%, var(--surface)); }
  .inbox-banner .big { font-size: 1.6rem; }
  .inbox-text { white-space: pre-wrap; word-break: break-word; }
  .inbox-quote { margin: -6px 0 6px; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); white-space: pre-wrap; }
  .sheet-sub { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 14px 0 8px; }
  .move-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .move-grid .btn { min-height: 44px; font-size: .9rem; padding: 0 10px; justify-content: flex-start; text-align: left; }
  dialog.sheet { overflow-y: auto; }
  .move-list { display: grid; gap: 6px; }
  .move-list .btn { min-height: 44px; font-size: .9rem; justify-content: flex-start; text-align: left; padding: 0 10px 0 var(--d, 10px); }
  .move-list .btn[hidden], .move-list .path-label { display: none; }
  .move-list.searching .tree-label { display: none; }
  .move-list.searching .path-label { display: inline; }
  .move-list.searching .btn { padding-left: 10px; }

  /* 💰 Earning: Notion-style pages */
  .notion { max-width: 780px; }
  .crumbs { display: flex; flex-wrap: wrap; gap: 4px 6px; font-size: .82rem; color: var(--muted); }
  .crumbs a { color: var(--muted); text-decoration: none; }
  .crumbs a:hover { color: var(--text); }
  .pg-icon { font-size: 2.8rem; line-height: 1; border: 0; background: transparent; padding: 6px; margin: 10px 0 0 -6px;
    border-radius: 12px; cursor: pointer; }
  .pg-icon:hover { background: var(--surface-2); }
  .pg-title { font-size: 2rem; font-weight: 800; line-height: 1.2; margin: 4px 0; outline: none; word-break: break-word; white-space: pre-wrap; }
  [data-ph]:empty::before { content: attr(data-ph); color: var(--muted); opacity: .55; pointer-events: none; }
  .blk-p .blk-text:empty:not(:focus)::before { content: none; }
  .blocks { display: grid; gap: 1px; margin-top: 14px; }
  .blk { display: flex; align-items: flex-start; gap: 4px; border-radius: 8px; }
  .blk-handle { flex: none; width: 22px; height: 32px; padding: 0; border: 0; border-radius: 6px; background: transparent;
    color: var(--muted); opacity: .3; font-size: .8rem; letter-spacing: -2px; cursor: pointer; }
  .blk:hover .blk-handle, .blk:focus-within .blk-handle { opacity: .9; }
  .blk-handle:hover { background: var(--surface-2); }
  .blk-text { flex: 1; min-width: 0; min-height: 1.6em; padding: 4px 2px; outline: none; white-space: pre-wrap; word-break: break-word; }
  .blk-h1 .blk-text { font-size: 1.6rem; font-weight: 800; line-height: 1.25; }
  .blk-h2 .blk-text { font-size: 1.3rem; font-weight: 750; line-height: 1.3; }
  .blk-h3 .blk-text { font-size: 1.1rem; font-weight: 700; }
  .blk-h1 { margin-top: 16px; } .blk-h2 { margin-top: 12px; } .blk-h3 { margin-top: 8px; }
  .blk-h1 .blk-handle, .blk-h2 .blk-handle { height: 40px; }
  .blk-handle { display: none; } /* hidden — right-click a line for its menu */
  .blk-mark { flex: none; min-width: 20px; padding-top: 4px; text-align: center; color: var(--muted); font-weight: 700; }
  .blk-bullet .blk-mark { font-size: 1.2rem; line-height: 1.2; }
  .blk-check { flex: none; width: 20px; height: 20px; margin: 6px 4px 0 0; padding: 0; border: 2px solid var(--muted); border-radius: 5px;
    background: transparent; color: #fff; font-size: .75rem; font-weight: 800; cursor: pointer; display: grid; place-items: center; }
  .blk.checked .blk-check { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
  .blk.checked .blk-text { text-decoration: line-through; color: var(--muted); }
  .blk-quote .blk-text { border-left: 3px solid var(--text); padding-left: 12px; }
  .blk-callout { background: var(--surface-2); padding: 6px 8px 6px 0; margin: 4px 0; border-radius: 10px; }
  .blk-code.blk-text { min-height: 0; width: auto; resize: none; overflow: hidden; border: 0; border-radius: 10px; padding: 10px 12px;
    background: var(--surface-2); font: .88rem/1.5 ui-monospace, Consolas, monospace; }
  .blk-divider hr { flex: 1; border: 0; border-top: 1px solid var(--border); margin: 15px 2px; }
  .add-block { display: block; width: 100%; text-align: left; margin-top: 4px; min-height: 44px; padding: 0 26px; border: 0; border-radius: 10px;
    background: transparent; color: var(--muted); font: inherit; cursor: pointer; }
  .add-block:hover { background: var(--surface-2); }
  .subpages { margin-top: 26px; padding-top: 14px; border-top: 1px solid var(--border); }
  .subpages h3 { margin: 0; font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .subpage { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 6px 10px; margin-top: 6px; border-radius: 12px;
    border: 1px solid var(--border); background: var(--surface); color: inherit; text-decoration: none; }
  .subpage .name { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .subpage:hover { border-color: color-mix(in srgb, var(--primary) 45%, var(--border)); }
  .earn-card-ico { font-size: 1.5rem; line-height: 1; }
  .icon-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .icon-grid button { min-height: 50px; font-size: 1.6rem; border: 0; border-radius: 12px; background: var(--surface-2); cursor: pointer; }
  .slash { position: absolute; z-index: 70; width: min(290px, calc(100vw - 24px)); max-height: 300px; overflow-y: auto; padding: 6px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 12px 34px rgba(0, 0, 0, .25); }
  .slash-head { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 4px 10px 6px; }
  .slash button { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 42px; padding: 0 10px; border: 0; border-radius: 10px;
    background: transparent; color: var(--text); font: inherit; text-align: left; cursor: pointer; }
  .slash button.sel, .slash button:hover { background: var(--surface-2); }
  .slash .ico { width: 28px; text-align: center; font-weight: 800; color: var(--muted); }
  @media (max-width: 899px) { .pc-only { display: none !important; } }
  @media (min-width: 900px) { .phone-only { display: none !important; } }
  .nav-search { order: -2; display: flex; align-items: center; gap: 8px; min-height: 42px; margin: 0 0 10px; padding: 0 12px;
    border: 1px solid var(--border); border-radius: 12px; background: var(--surface-2); color: var(--muted); font: inherit; font-size: .9rem; cursor: pointer; text-align: left; }
  .nav-search span { flex: 1; }
  .g-wrap { display: grid; justify-items: center; }
  .g-btn { min-height: 44px; }
  .or-line { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: .85rem; }
  .or-line::before, .or-line::after { content: ""; flex: 1; border-top: 1px solid var(--border); }
  .nav-search kbd { font-size: .7rem; padding: 2px 6px; border: 1px solid var(--border); border-radius: 6px; }
  .nav-search:hover { color: var(--text); }

  /* ---------- 10. Home: search + sort ---------- */
  .search { position: relative; }
  .search input { padding-left: 42px; border-radius: 14px; }
  .search::before { content: "🔍"; position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: .95rem; opacity: .6; }
  .sort-select { width: auto; min-height: 40px; padding: 6px 10px; font-size: .9rem; }
  .empty { text-align: center; padding: 40px 16px; }
  .empty .big { font-size: 3rem; }

  /* ---------- 11. Bottom navigation ---------- */
  .bottom-nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    display: flex; justify-content: space-around; align-items: center;
    background: var(--surface); border-top: 1px solid var(--border);
    padding: 4px 16px calc(4px + env(safe-area-inset-bottom));
  }
  .nav-item {
    flex: 1; min-height: 56px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2px;
    color: var(--muted); text-decoration: none; font-size: .75rem; font-weight: 600;
  }
  .nav-item .ico { font-size: 1.3rem; line-height: 1; }
  .nav-item.active { color: var(--primary); }
  .nav-count:empty { display: none; }
  .nav-count { font-size: .7rem; opacity: .8; }
  .fab {
    width: 60px; height: 60px; margin-top: -30px; border-radius: 50%;
    display: grid; place-items: center; text-decoration: none;
    background: var(--primary); color: var(--primary-ink); font-size: 2rem; line-height: 1;
    box-shadow: 0 8px 22px color-mix(in srgb, var(--primary) 45%, transparent);
    transition: transform .15s;
  }
  .fab:active { transform: scale(.92); }

  /* ---------- 12. Idea detail ---------- */
  .hero h1 { margin: 10px 0 4px; font-size: 1.5rem; word-break: break-word; }
  .hero p { margin: 0 0 14px; color: var(--muted); }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; }
  .progress-grid { display: grid; gap: 14px; margin-top: 14px; }
  .tabs { display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: var(--surface-2); margin: 18px 0 12px; }
  .tab {
    flex: 1; min-height: 42px; border: 0; border-radius: 10px; background: transparent;
    color: var(--muted); font: inherit; font-weight: 700; font-size: .9rem; cursor: pointer;
  }
  .tab.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
  .detail-block { margin-bottom: 16px; }
  .detail-block h3 { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 6px; }
  .detail-block p { margin: 0; white-space: pre-wrap; word-break: break-word; }
  .link-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); text-decoration: none; color: inherit; min-height: 44px; }
  .link-item:last-child { border-bottom: 0; }
  .link-item .url { color: var(--primary); font-size: .85rem; word-break: break-all; }

  /* ---------- 13. Feature list ---------- */
  .add-form { display: grid; gap: 10px; margin-bottom: 14px; }
  .feature-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .feature {
    display: flex; align-items: flex-start; gap: 4px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 6px 6px 6px 2px;
    transition: box-shadow .15s, border-color .15s;
  }
  .feature.dragging { border-color: var(--primary); box-shadow: 0 12px 30px rgba(0, 0, 0, .18); position: relative; z-index: 2; }
  .drag-handle {
    touch-action: none; cursor: grab; flex: none;
    width: 32px; min-height: 48px; border: 0; background: transparent;
    color: var(--muted); font-size: 1.1rem; letter-spacing: -3px;
  }
  .dragging .drag-handle { cursor: grabbing; }
  .f-status {
    flex: none; width: 36px; height: 36px; margin: 6px 4px 0 0;
    border-radius: 50%; border: 2px solid var(--border); background: transparent;
    color: var(--muted); font-weight: 800; cursor: pointer; transition: all .2s;
  }
  .feature[data-status="doing"] .f-status { border-color: var(--warning); color: var(--warning); }
  .feature[data-status="done"] .f-status { border-color: var(--success); background: var(--success); color: #fff; }
  .feature[data-status="done"] .f-title { text-decoration: line-through; color: var(--muted); }
  .f-body { flex: 1; min-width: 0; padding: 6px 0; }
  .f-title { font-weight: 600; word-break: break-word; }
  .f-desc { font-size: .85rem; color: var(--muted); white-space: pre-wrap; word-break: break-word; }
  .f-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .mini {
    min-height: 30px; padding: 0 10px; border-radius: 999px;
    border: 1px solid var(--border); background: transparent; color: var(--muted);
    font: inherit; font-size: .75rem; font-weight: 700; cursor: pointer;
  }
  .mini.mvp { background: color-mix(in srgb, var(--danger) 14%, transparent); color: var(--danger); border-color: transparent; }
  .mini.state-doing { color: var(--warning); }
  .mini.state-done { color: var(--success); }

  /* ---------- 13b. Steps (roadmap) ---------- */
  .step { padding-left: 8px; }
  .step-tools { display: flex; flex: none; align-items: center; }
  .step-tools .icon-btn { width: 34px; min-width: 34px; font-size: .95rem; }
  .step-tools .icon-btn:disabled { opacity: .25; cursor: default; }
  .feature.step[data-status="doing"] { border-color: var(--warning); }
  .mini.now-tag { cursor: default; display: inline-flex; align-items: center; color: var(--warning);
    background: color-mix(in srgb, var(--warning) 14%, transparent); border-color: transparent; }
  .where-now { margin: 0 0 14px; padding: 12px; border-radius: 12px; border: 1px solid var(--border);
    background: color-mix(in srgb, var(--warning) 7%, transparent); }
  .where-step { margin-top: 4px; font-size: 1.05rem; font-weight: 700; word-break: break-word; }
  .step-dots { display: flex; gap: 4px; margin-top: 10px; }
  .step-dots span { flex: 1; height: 6px; border-radius: 999px; background: var(--border); }
  .step-dots span.done { background: var(--success); }
  .step-dots span.now { background: var(--warning); }
  .step-line { font-size: .85rem; font-weight: 600; margin: 0 0 8px; color: var(--text); word-break: break-word; }
  .small-btn { min-height: 34px; padding: 0 12px; font-size: .85rem; }

  /* ---------- 14. Journal timeline ---------- */
  .timeline { list-style: none; margin: 0; padding: 0; }
  .log-day h4 { margin: 14px 0 6px; font-size: .85rem; color: var(--muted); }
  .log-item { position: relative; margin-left: 6px; padding: 4px 0 14px 20px; border-left: 2px solid var(--border); }
  .log-item::before {
    content: ""; position: absolute; left: -7px; top: 9px;
    width: 12px; height: 12px; border-radius: 50%; background: var(--primary);
    box-shadow: 0 0 0 3px var(--bg);
  }
  .log-item .text { white-space: pre-wrap; word-break: break-word; }
  .log-item .row-between { flex-wrap: nowrap; align-items: flex-start; }

  /* ---------- 15. Dashboard ---------- */
  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .stat .num { font-size: 1.9rem; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stat .lbl { color: var(--muted); font-size: .82rem; }
  .avatar {
    --h: 240; flex: none; width: 22px; height: 22px; border-radius: 50%;
    display: inline-grid; place-items: center; font-size: .7rem; font-weight: 800; color: #fff;
    background: hsl(var(--h) 65% 48%);
  }
  .status-row { display: grid; grid-template-columns: 120px 1fr 28px; align-items: center; gap: 10px; padding: 6px 0; font-size: .9rem; }
  .status-row .n { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
  .section-title { font-size: 1rem; margin: 22px 0 10px; }
  .active-idea { display: block; text-decoration: none; color: inherit; }

  /* ---------- 16. Bottom sheet dialog + toast ---------- */
  dialog.sheet {
    border: 0; padding: 0; width: 100%; max-width: 560px;
    margin: auto auto 0; border-radius: 22px 22px 0 0;
    background: var(--surface); color: var(--text);
    max-height: 90vh;
  }
  dialog.sheet::backdrop { background: rgba(0, 0, 0, .45); }
  .sheet-inner { padding: 20px 16px calc(16px + env(safe-area-inset-bottom)); }
  .sheet-inner h2 { margin: 0 0 14px; font-size: 1.15rem; }
  @media (min-width: 600px) { dialog.sheet { margin: auto; border-radius: 22px; } }

  #toast {
    position: fixed; left: 50%; bottom: calc(100px + env(safe-area-inset-bottom)); z-index: 100;
    transform: translate(-50%, 16px); opacity: 0; pointer-events: none;
    background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 12px;
    font-size: .9rem; font-weight: 600; max-width: 90vw; transition: opacity .25s, transform .25s;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #toast.has-undo { pointer-events: auto; display: flex; align-items: center; gap: 10px; }
  .toast-undo { border: 0; border-radius: 8px; padding: 6px 12px; min-height: 34px; cursor: pointer;
    background: var(--primary); color: var(--primary-ink); font: inherit; font-weight: 700; white-space: nowrap; }

  /* ---------- 16b. Side list (swipe from the left edge, or tap ☰) ---------- */
  .drawer {
    position: fixed; top: 0; bottom: 0; left: 0; z-index: 60;
    width: min(85vw, 330px); overflow-y: auto;
    background: var(--surface); border-right: 1px solid var(--border);
    padding: calc(16px + env(safe-area-inset-top)) 12px calc(16px + env(safe-area-inset-bottom));
    transform: translateX(-102%); transition: transform .25s cubic-bezier(.22, 1, .36, 1);
    box-shadow: 8px 0 30px rgba(0, 0, 0, .25);
  }
  .drawer.open { transform: none; }
  .drawer-backdrop {
    position: fixed; inset: 0; z-index: 59; background: rgba(0, 0, 0, .45);
    opacity: 0; pointer-events: none; transition: opacity .25s;
  }
  .drawer-backdrop.open { opacity: 1; pointer-events: auto; }
  .drawer h2 { font-size: 1.1rem; margin: 4px 8px 12px; }
  .drawer-item {
    display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 6px 8px;
    border-radius: 12px; color: inherit; text-decoration: none;
  }
  .drawer-item:hover, .drawer-item.active { background: var(--surface-2); }
  .drawer-item .name { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .drawer-item .meta { font-size: .78rem; color: var(--muted); white-space: nowrap; }
  .drawer-search { margin: 0 4px 10px; }
  .dup-hint { margin-top: 8px; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border); }
  .dup-hint b { display: block; font-size: .85rem; margin-bottom: 6px; }
  .dup-hint a { display: flex; align-items: center; gap: 8px; padding: 6px 4px; color: inherit; text-decoration: none; border-radius: 8px; }
  .dup-hint a:hover { background: var(--surface); }
  .dup-hint .meta { margin-left: auto; font-size: .78rem; color: var(--muted); white-space: nowrap; }
  mark.hl { background: rgba(255, 196, 0, .35); color: inherit; border-radius: 3px; padding: 0 1px; }
  .drawer-links { display: grid; gap: 8px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }

  /* ---------- 17. Big screens (PC): bottom bar becomes a sidebar ---------- */
  @media (min-width: 900px) {
    body { padding-bottom: 32px; padding-left: 240px; }
    .bottom-nav, .bottom-nav.mobile-hidden {
      display: flex; top: 0; bottom: 0; right: auto; width: 240px;
      flex-direction: column; justify-content: flex-start; align-items: stretch; gap: 6px;
      padding: 20px 14px; border-top: 0; border-right: 1px solid var(--border);
    }
    .bottom-nav::before { content: "💡 App Ideas"; font-weight: 800; font-size: 1.2rem; padding: 4px 10px 18px; }
    .nav-item { flex: none; flex-direction: row; justify-content: flex-start; gap: 12px; min-height: 48px; padding: 0 14px; border-radius: 12px; font-size: .95rem; }
    .nav-item:hover { background: var(--surface-2); }
    .nav-item.active { background: color-mix(in srgb, var(--primary) 14%, transparent); }
    /* Sub-folders under "Ideas" (PC only) */
    .nav-subs { display: grid; gap: 2px; margin: -2px 0 6px 18px; padding-left: 10px; border-left: 2px solid var(--border); }
    .nav-sub { display: flex; align-items: center; gap: 10px; min-height: 38px; padding: 0 10px; border-radius: 10px;
      color: var(--muted); text-decoration: none; font-size: .9rem; font-weight: 600; }
    .nav-sub .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .nav-sub .count { font-size: .75rem; opacity: .8; }
    .nav-sub:hover { background: var(--surface-2); color: var(--text); }
    .nav-sub.active { background: color-mix(in srgb, var(--primary) 14%, transparent); color: var(--text); }
    .fab { display: flex; align-items: center; justify-content: center; order: -1; width: auto; height: 48px; margin: 0 0 12px; border-radius: 12px; font-size: 1rem; font-weight: 700; box-shadow: none; }
    .fab::after { content: "New idea"; margin-left: 6px; }
    .page { max-width: 1080px; padding: 24px 32px; }
    #idea-list { grid-template-columns: repeat(2, 1fr); }
    .stats { grid-template-columns: repeat(4, 1fr); }
    #toast { bottom: 28px; }
  }
  @media (max-width: 899px) { .bottom-nav.mobile-hidden { display: none; } .nav-subs { display: none; } }

  /* Respect users who prefer less motion. */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
  /* Earning: drag a page onto another page to put it inside */
  .pg-drag { flex: none; display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 10px;
    color: var(--muted); cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; font-size: 1.1rem; }
  .pg-drag:hover { background: rgba(127, 127, 127, .15); color: var(--text); }
  .pg-dragging { opacity: .35; }
  .todo-drag { width: 26px; height: 32px; margin-right: -4px; font-size: 1rem; }
  body.todo-drag-on [data-drop-list] { outline: 1px dashed var(--border); outline-offset: -2px; }
  .drop-hover { outline: 2px dashed var(--primary); outline-offset: 2px; }
  .drag-ghost { position: fixed; z-index: 1000; pointer-events: none; padding: 8px 14px; border-radius: 12px; background: var(--primary); color: var(--primary-ink, #fff);
    font-weight: 600; box-shadow: 0 12px 30px rgba(0, 0, 0, .35); transform: translate(-50%, -140%); white-space: nowrap; max-width: 70vw; overflow: hidden; text-overflow: ellipsis; }
  .drop-root { display: none; margin: 0 0 12px; padding: 14px; border: 2px dashed var(--border); border-radius: 14px; text-align: center; color: var(--muted); }
  body.pg-drag-on .drop-root { display: block; }
  /* 📱 SM planner inside Earning */
  .sm-frame { display: block; width: 100%; height: calc(100dvh - 64px); border: 0; background: var(--bg); }
  @media (max-width: 899px) { .sm-frame { height: calc(100dvh - 64px - 64px); } }
  .sm-card { display: flex; align-items: center; gap: 12px; width: 100%; margin: 0 0 12px; font: inherit; text-align: left; text-decoration: none; color: inherit; }

  /* ---------- 18. Task side panel (tap a task's text) ---------- */
  .todo-text { cursor: pointer; }
  .todo-extra { margin-left: 6px; font-size: .75rem; opacity: .7; white-space: nowrap; }
  .todo.selected { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary) inset; }
  .todo-check.on { background: var(--success); border-color: var(--success); }
  .todo-panel {
    position: fixed; inset: 0; z-index: 40; overflow-y: auto;
    background: var(--surface); color: var(--text);
    padding: calc(10px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
    animation: tp-in .18s ease-out;
  }
  @keyframes tp-in { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
  .tp-head { display: flex; align-items: center; gap: 6px; padding-bottom: 8px; margin-bottom: 6px; border-bottom: 1px solid var(--border); }
  .tp-place { flex: 1; min-width: 0; font-size: .85rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tp-place a { color: var(--primary); text-decoration: none; }
  .todo-panel textarea { width: 100%; border: 0; background: transparent; color: inherit; resize: none; padding: 6px 2px; box-shadow: none; outline: none; }
  .todo-panel textarea:focus { background: var(--surface-2); border-radius: 8px; }
  .tp-title { font-size: 1.3rem; font-weight: 700; line-height: 1.35; min-height: 0; }
  .tp-desc { min-height: 120px; font-size: .98rem; line-height: 1.55; }
  .tp-images { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
  .tp-img { position: relative; }
  .tp-img img { width: 92px; height: 92px; object-fit: cover; border-radius: 10px; cursor: zoom-in; display: block; border: 1px solid var(--border); }
  .tp-img-del { position: absolute; top: -6px; right: -6px; width: 24px; height: 24px; border-radius: 50%; border: 0; padding: 0;
    background: var(--text); color: var(--bg); font-size: .7rem; cursor: pointer; }
  .tp-img-add { width: 92px; height: 92px; border: 2px dashed var(--border); border-radius: 10px; display: grid; place-items: center;
    align-content: center; gap: 2px; cursor: pointer; color: var(--muted); font-size: 1.4rem; }
  .tp-img-add span { font-size: .75rem; font-weight: 600; }
  .tp-img-add:hover { border-color: var(--primary); color: var(--primary); }
  .tp-subs { list-style: none; margin: 0 0 8px; padding: 0; display: grid; gap: 2px; }
  .tp-subs li { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 2px 4px; border-radius: 8px; }
  .tp-subs li:hover { background: var(--surface-2); }
  .tp-subs .todo-check { width: 22px; height: 22px; border-radius: 5px; font-size: .8rem; }
  .tp-subs a { flex: 1; color: inherit; text-decoration: none; word-break: break-word; }
  .tp-subs li.done a { text-decoration: line-through; color: var(--muted); }
  .tp-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
  .tp-actions .btn { min-height: 40px; font-size: .88rem; }
  .qa-lists { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 10px; }
  .qa-lists .chip { min-height: 34px; padding: 0 12px; font-size: .85rem; }
  @media (min-width: 900px) {
    .todo-panel { left: auto; width: 420px; border-left: 1px solid var(--border); box-shadow: -10px 0 30px rgba(15, 23, 42, .08); padding-top: 16px; }
  }
  @media (min-width: 1300px) { body.panel-open { padding-right: 420px; } }
  @media (min-width: 900px) { .bottom-nav, .bottom-nav.mobile-hidden { overflow-y: auto; } }

  /* ---------- 19. ✔️ TickTick look (theme button cycles to it) ---------- */
  :root[data-theme="tick"] {
    --bg: #ffffff; --surface: #ffffff; --surface-2: #f3f4f6; --text: #191919; --muted: #8b8f97;
    --border: #ececec; --primary: #4772fa; --primary-ink: #ffffff; --danger: #e5484d; --success: #4772fa; --warning: #f5a623;
    --shadow: none; --radius: 10px; color-scheme: light;
  }
  [data-theme="tick"] body { font-size: 15px; }
  [data-theme="tick"] .topbar { background: #fff; }
  [data-theme="tick"] .todo-list { gap: 0; }
  [data-theme="tick"] .todo-item { gap: 0; }
  [data-theme="tick"] .todo { border: 0; border-bottom: 1px solid var(--border); border-radius: 6px; background: transparent; min-height: 44px; }
  [data-theme="tick"] .todo:hover { background: #f7f8fa; }
  [data-theme="tick"] .todo.selected { background: #edf1ff; box-shadow: none; }
  [data-theme="tick"] .todo.prio { background: transparent; }
  [data-theme="tick"] .todo.prio .todo-check { border-color: var(--danger); }
  [data-theme="tick"] .todo-check { width: 18px; height: 18px; border-radius: 4px; border-width: 1.5px; border-color: #b8bcc4; font-size: .7rem; }
  [data-theme="tick"] .todo.done .todo-check, [data-theme="tick"] .todo-check.on { background: #c3c7ce; border-color: #c3c7ce; }
  [data-theme="tick"] .todo-children { border-left: 0; margin-left: 26px; padding-left: 0; }
  [data-theme="tick"] .todo .icon-btn { opacity: 0; transition: opacity .12s; }
  [data-theme="tick"] .todo:hover .icon-btn, [data-theme="tick"] .todo .prio-btn.on, [data-theme="tick"] .todo .today-btn.on { opacity: 1; }
  @media (hover: none) { [data-theme="tick"] .todo .icon-btn { opacity: .8; } }
  [data-theme="tick"] .todo-add input { border-radius: 8px; background: #f5f6f8; border-color: transparent; }
  [data-theme="tick"] .card { border-radius: 10px; box-shadow: none; }
  [data-theme="tick"] .btn { border-radius: 8px; }
  @media (min-width: 900px) {
    [data-theme="tick"] .bottom-nav, [data-theme="tick"] .bottom-nav.mobile-hidden { background: #f7f7f7; border-right-color: #ececec; }
    [data-theme="tick"] .nav-item { min-height: 40px; border-radius: 8px; color: #4d4d4d; }
    [data-theme="tick"] .nav-item.active { background: #e7ecfe; color: #191919; }
    [data-theme="tick"] .nav-sub { min-height: 34px; }
    [data-theme="tick"] .todo-panel { box-shadow: none; }
  }

  /* ---------- 20. Cleaner task rows, description, progress, focus rank, photos, Alt+I popup ---------- */
  body { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  .todo { transition: background .12s, border-color .12s, box-shadow .12s; }
  .todo:hover { border-color: color-mix(in srgb, var(--primary) 35%, var(--border)); }
  .todo-text { display: flex; flex-direction: column; gap: 3px; padding: 4px 0; }
  .todo-text .tt { font-weight: 550; line-height: 1.35; }
  .tt-row { display: block; }
  .todo-desc { font-size: .8rem; line-height: 1.4; color: var(--muted); font-weight: 400; white-space: pre-line;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .todo.done .todo-desc { text-decoration: none; }
  .todo-prog { display: inline-flex; align-items: center; gap: 8px; font-size: .72rem; color: var(--muted); font-weight: 500; }
  .todo-prog b { color: var(--text); font-weight: 700; }
  .todo-prog-bar { width: 84px; height: 5px; border-radius: 99px; background: var(--surface-2); overflow: hidden; flex: none; }

<script>
/* =====================================================================
   SECTION 1: CONSTANTS
   Lists of options used throughout the app. Change them here and the
   whole app updates.
   ===================================================================== */
const STORAGE_KEY = 'appIdeasTracker.v1';

const STATUSES = [
  { key: 'idea',     emoji: '💡', label: 'Idea',     color: '#a855f7' },
  { key: 'planning', emoji: '📝', label: 'Planning', color: '#3b82f6' },
  { key: 'building', emoji: '🛠️', label: 'Building', color: '#f59e0b' },
  { key: 'testing',  emoji: '🧪', label: 'Testing',  color: '#06b6d4' },
  { key: 'launched', emoji: '🚀', label: 'Launched', color: '#22c55e' },
  { key: 'onhold',   emoji: '⏸️', label: 'On Hold',  color: '#94a3b8' },
];
const PLATFORMS  = ['Android', 'iOS', 'Web', 'Meta Quest/VR', 'Desktop'];
const PRIORITIES = ['High', 'Medium', 'Low'];
const PRIORITY_COLORS = { High: '#ef4444', Medium: '#f59e0b', Low: '#22c55e' };
const PRIORITY_RANK   = { High: 3, Medium: 2, Low: 1 };
const MONETIZATION = ['Free', 'Paid', 'Ads', 'Subscription'];

// Feature statuses, in the order a tap cycles through them.
const FEATURE_STATUSES = ['todo', 'doing', 'done'];
const FEATURE_LABEL = { todo: 'To Do', doing: 'In Progress', done: 'Done' };
const FEATURE_ICON  = { todo: '', doing: '◐', done: '✓' };

// Ready-made roadmap from idea -> live on the store (max 5 steps, since Claude does the building).
// phase = the app status while you're on that step. Every idea gets it automatically.
const PLAYSTORE_STEPS = [
  ['idea',     '💡 Idea + features Claude ko batao'],
  ['building', '🤖 Claude se app banwao'],
  ['testing',  '🧪 Phone pe test karo, bugs Claude se fix karwao'],
  ['testing',  '📦 Release build + store listing taiyaar (Claude se)'],
  ['testing',  '🚀 Play Store pe upload — LIVE!'],
];
const VR_STEPS = [
  ['idea',     '💡 Idea + features Claude ko batao'],
  ['building', '🤖 Claude se VR app banwao'],
  ['testing',  '🥽 Headset pe test karo, bugs Claude se fix karwao'],
  ['testing',  '📦 Release build + store listing taiyaar (Claude se)'],
  ['testing',  '🚀 Meta Quest store pe upload — LIVE!'],
];
// A new feature for an app/site that already exists.
const FEATURE_STEPS = [
  ['idea',     '💡 Feature kya karega — Claude ko batao'],
  ['building', '🤖 Claude se feature banwao'],
  ['testing',  '🧪 Test karo, bugs Claude se fix karwao'],
  ['testing',  '🚀 Update push / release — feature LIVE!'],
];
// Misc: any other thing to make or develop (tool, site, script, setup…).
const MISC_STEPS = [
  ['idea',     '💡 Kya banana hai — Claude ko batao'],
  ['building', '🤖 Claude se banwao / develop karo'],
  ['testing',  '🧪 Use karke dekho, bugs fix karwao'],
  ['testing',  '✅ Ready — kaam ho gaya!'],
];
// PC / laptop software (Windows app).
const PC_STEPS = [
  ['idea',     '💡 Idea + features Claude ko batao'],
  ['building', '🤖 Claude se PC app banwao'],
  ['testing',  '💻 Laptop pe test karo, bugs Claude se fix karwao'],
  ['testing',  '📦 Installer (.exe) + listing taiyaar (Claude se)'],
  ['testing',  '🚀 Microsoft Store / website pe upload — LIVE!'],
];
// REA: understand an existing app with reverse engineering (REA), then make our own and ship it everywhere.
const REA_STEPS = [
  ['idea',     '💡 Kya reverse engineer karna hai + kya banana hai — Claude ko batao'],
  ['planning', '🔍 REA se app / feature samjho (reverse engineering)'],
  ['building', '🤖 Claude se apna version banwao'],
  ['testing',  '🧪 Phone, PC aur Quest pe test karo, bugs fix karwao'],
  ['testing',  '🚀 Upload — Play Store 📱 + PC 🖥️ + Meta Quest 🥽 — LIVE!'],
];
const STEP_TEMPLATES = { apps: PLAYSTORE_STEPS, vr: VR_STEPS, pc: PC_STEPS, rea: REA_STEPS, feature: FEATURE_STEPS, misc: MISC_STEPS };
const stepTemplate = folder => STEP_TEMPLATES[folder] || PLAYSTORE_STEPS;
// Where the roadmap ends, for labels like "Play Store tak progress".
const FINISH_LINE = { apps: 'Play Store', vr: 'Store', pc: 'Release', rea: 'Upload', feature: 'Release', misc: 'Ready' };
const finishOf = folder => FINISH_LINE[folder] || 'Play Store';

// Older ready-made lists. Ideas that still have them get moved to the 5-step list;
// each old step points to the new step (1-5) it belongs to (0 = dropped).
const OLD_DEFAULT_TITLES = ['💡 Idea final karo', '🔍 Research (competitors, users)', '🎨 Design / UI screens', '🛠️ Build MVP', '🧪 Testing', '🚀 Launch / Publish', '📣 Marketing & feedback'].join('|');
const OLD_LONG_STEPS = {
  '💡 Idea clear likho (kya problem, kis ke liye)': 1, '🔍 Play Store pe similar apps check karo': 1,
  '📝 Features list + MVP decide karo': 1, '🎨 Screens ka design / sketch banao': 1, '🧰 Tech choose karo + project setup': 1,
  '🛠️ Main screens banao': 2, '⚙️ Core (MVP) features banao': 2, '💾 Data save / login / backend': 2, '🖼️ App icon, naam, splash screen': 2,
  '🧪 Khud test karo + bugs fix': 3, '📱 Dosto ke phone pe test karwao': 3,
  '💳 Google Play Developer account ($25)': 0, '🔐 Privacy policy page banao': 4, '📦 Signed release build (AAB) banao': 4,
  '🖼️ Store listing: screenshots, description, graphic': 4, '📋 Content rating + Data safety form bharo': 4,
  '👥 Closed testing (12 testers, 14 din)': 5, '🚀 Production release submit karo': 5, '✅ Review pass — Play Store pe LIVE!': 5,
  '💡 Idea clear likho (kya experience, kis ke liye)': 1, '🔍 Meta Quest store pe similar apps check karo': 1,
  '🎨 Scene / interaction design sketch': 1, '🧰 Unity/engine + Quest project setup': 1,
  '🛠️ Main scene + controls banao': 2, '⚙️ Core (MVP) gameplay / features banao': 2, '🎧 Sound, UI menus, comfort settings': 2, '🖼️ App icon, naam, logo': 2,
  '🥽 Headset pe khud test + bugs fix': 3, '⚡ Performance (72+ FPS) theek karo': 3, '👥 Dosto se headset pe test karwao': 3,
  '💳 Meta developer account + org banao': 0, '📦 Release build (APK) banao': 4, '🖼️ Store listing: screenshots, trailer, description': 4,
  '🚀 Meta Horizon Store pe submit karo': 5, '✅ Review pass — Store pe LIVE!': 5,
};

// Fixed ids (t1…t5) so every device creates the very same list -> no duplicates when syncing.
function templateSteps(folder) {
  return stepTemplate(folder).map(([phase, title], i) => ({ id: 't' + (i + 1), title, phase, done: false, doneAt: null, doneBy: null, by: null }));
}

// Move an old long list to the 5-step list. A new step counts as done when all its old steps were done.
// Steps you added yourself are kept after the 5.
function migrateLongSteps(list, folder) {
  const fresh = templateSteps(folder);
  const groups = fresh.map(() => []);
  const custom = [];
  list.forEach(st => {
    const to = OLD_LONG_STEPS[st.title];
    if (to === undefined) custom.push(st);
    else if (to > 0) groups[to - 1].push(st);
  });
  fresh.forEach((st, i) => {
    const g = groups[i];
    if (g.length && g.every(x => x.done)) {
      const last = g.reduce((a, b) => ((Number(b.doneAt) || 0) > (Number(a.doneAt) || 0) ? b : a));
      Object.assign(st, { done: true, doneAt: Number(last.doneAt) || null, doneBy: last.doneBy || null });
    }
  });
  return [...fresh, ...custom];
}

const DAY = 24 * 60 * 60 * 1000;


/* =====================================================================
   SECTION 2: SMALL HELPERS
   ===================================================================== */

// Unique id for ideas, features, log entries, links.
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

// Escape text before putting it into HTML (prevents broken layout / XSS).
function esc(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// Today's date as "YYYY-MM-DD" in the user's local timezone.
function todayStr(ts = Date.now()) {
  const d = new Date(ts);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

// "21 Oct 2026"
function fmtDate(input) {
  // A "YYYY-MM-DD" string is parsed as local time (not UTC) by adding T00:00.
  const d = typeof input === 'string' && input.length === 10 ? new Date(input + 'T00:00') : new Date(input);
  return d.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
}

// "just now", "5m ago", "3h ago", "2d ago", or a date.
function timeAgo(ts) {
  const diff = Date.now() - ts;
  if (diff < 60e3) return 'just now';
  if (diff < 3600e3) return Math.floor(diff / 60e3) + 'm ago';
  if (diff < DAY) return Math.floor(diff / 3600e3) + 'h ago';
  if (diff < 7 * DAY) return Math.floor(diff / DAY) + 'd ago';
  return fmtDate(ts);
}

const clamp = (n, min, max) => Math.min(max, Math.max(min, n));
const statusOf = key => STATUSES.find(s => s.key === key) || STATUSES[0];
const findIdea = id => state.ideas.find(i => i.id === id);

// Make a link safe to click: add https:// if missing, block "javascript:" etc.
function safeUrl(url) {
  let u = String(url || '').trim();
  if (!u) return '#';
  if (!/^[a-z][a-z0-9+.-]*:/i.test(u)) u = 'https://' + u;
  return /^https?:\/\//i.test(u) ? u : '#';
}

// Turn "pharma, Productivity ,education" into ["pharma","productivity","education"].
function parseTags(text) {
  const tags = String(text || '').split(',').map(t => t.trim().toLowerCase()).filter(Boolean);
  return [...new Set(tags)];
}

// Show a short message at the bottom of the screen.
let toastTimer;
// toast('text') shows a short message. toast('text', undoFn) also shows an Undo button for 6 seconds.
function toast(msg, undoFn = null) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.toggle('has-undo', !!undoFn);
  if (undoFn) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'toast-undo';
    btn.textContent = '↩️ Undo';
    btn.onclick = () => { el.classList.remove('show', 'has-undo'); undoFn(); };
    el.append(' ', btn);
  }
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show', 'has-undo'), undoFn ? 6000 : 2200);
}

// Copy text to clipboard (with a fallback for older browsers / file:// pages).
async function copyText(text) {
  // Inside the Android app: use the phone's clipboard directly.
  if (window.AndroidBridge) {
    AndroidBridge.copy(text);
    toast('📋 Copied to clipboard');
    return;
  }
  try {
    await navigator.clipboard.writeText(text);
    toast('📋 Copied to clipboard');
  } catch {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); toast('📋 Copied to clipboard'); }
    catch { toast('Copy failed'); }
    ta.remove();
  }
}


/* =====================================================================
   SECTION 3: DATA (load / save / normalise)
   Everything is stored as one JSON object in localStorage:
   { ideas: [...], theme: 'system' | 'light' | 'dark', sort: '...' }
   ===================================================================== */

// Fill in any missing fields so old or imported data never breaks the app.
function normalizeIdea(raw = {}) {
  const now = Date.now();
  const arr = v => (Array.isArray(v) ? v : []);
  return {
    id: raw.id || uid(),
    name: String(raw.name || 'Untitled idea'),
    // which Home folder: apps / vr / pc. The old Features + Misc idea folders were removed, so those ideas go to apps.
    folder: ['apps', 'vr', 'pc', 'rea'].includes(raw.folder) ? raw.folder : 'apps',
    desc: String(raw.desc || ''),
    problem: String(raw.problem || ''),
    target: String(raw.target || ''),
    notes: String(raw.notes || ''),
    platforms: arr(raw.platforms).filter(p => PLATFORMS.includes(p)),
    status: STATUSES.some(s => s.key === raw.status) ? raw.status : 'idea',
    priority: PRIORITIES.includes(raw.priority) ? raw.priority : 'Medium',
    monetization: arr(raw.monetization).filter(m => MONETIZATION.includes(m)),
    price: String(raw.price || ''),
    tags: arr(raw.tags).map(String),
    links: arr(raw.links).map(l => ({ id: l.id || uid(), label: String(l.label || ''), url: String(l.url || '') })),
    features: arr(raw.features).map(f => ({
      id: f.id || uid(),
      title: String(f.title || 'Untitled feature'),
      desc: String(f.desc || ''),
      status: FEATURE_STATUSES.includes(f.status) ? f.status : 'todo',
      mvp: f.mvp !== false, // default: Must have
      by: normPerson(f.by),  // who added it
    })),
    // Steps = the roadmap to the store. The first step that isn't done is "where you are now".
    steps: normalizeSteps(raw),
    log: arr(raw.log).map(l => ({
      id: l.id || uid(),
      date: /^\d{4}-\d{2}-\d{2}$/.test(l.date) ? l.date : todayStr(),
      text: String(l.text || ''),
      createdAt: Number(l.createdAt) || now,
      by: normPerson(l.by),
    })),
    // null = automatic progress; a number 0-100 = manual override
    manualProgress: typeof raw.manualProgress === 'number' ? clamp(Math.round(raw.manualProgress), 0, 100) : null,
    // timestamps of every change, used for "most active idea this week"
    activity: arr(raw.activity).filter(n => typeof n === 'number'),
    owner: normPerson(raw.owner),       // who created the idea: { id, name }
    editedBy: normPerson(raw.editedBy), // who changed it last
    createdAt: Number(raw.createdAt) || now,
    updatedAt: Number(raw.updatedAt) || now,
  };
}

function normalizeSteps(raw) {
  const list = Array.isArray(raw.steps) ? raw.steps : [];
  const isOldDefault = list.length && list.every(st => !st.done) && list.map(st => st.title).join('|') === OLD_DEFAULT_TITLES;
  if (!list.length || isOldDefault) return templateSteps(raw.folder);
  const source = list.some(st => OLD_LONG_STEPS[st.title] !== undefined && /^s\d+$/.test(st.id)) ? migrateLongSteps(list, raw.folder) : list;
  return source.map(st => ({
    id: st.id || uid(),
    title: String(st.title || 'Untitled step'),
    phase: STATUSES.some(x => x.key === st.phase) ? st.phase : '',
    done: !!st.done,
    doneAt: Number(st.doneAt) || null,
    doneBy: normPerson(st.doneBy),
    by: normPerson(st.by),
  }));
}

// A person is { id, name } (or null if unknown).
function normPerson(p) {
  if (!p || !p.name) return null;
  const name = p.name === 'Me' ? 'K' : String(p.name).slice(0, 12); // older versions used "Me" for you
  return { id: name, name };
}

// Misc folder = a simple one-line to-do list (not idea cards). Synced like ideas.
function normalizeTodo(raw = {}) {
  const now = Date.now();
  return {
    id: raw.id || uid(),
    text: String(raw.text || ''),
    desc: String(raw.desc || ''), // longer notes, written in the task's side panel
    images: (Array.isArray(raw.images) ? raw.images : []).filter(s => typeof s === 'string' && s.startsWith('data:image/')).slice(0, 12),
    parentId: raw.parentId || null, // set = this task lives inside another task
    folder: raw.folder || null, // which Misc list: null = main Misc page, 'apps' / 'vr' / 'pc' / 'rea' = that folder's Misc
    prevFolder: raw.prevFolder === undefined ? undefined : raw.prevFolder, // where a 🎯 task came from (so un-🎯 sends it back)
    done: !!raw.done,
    priority: !!raw.priority, // 🔥 = shows on the Priority page
    today: !!raw.today, // ☀️ = also shows on the 📅 Today page
    doneAt: Number(raw.doneAt) || null,
    doneBy: normPerson(raw.doneBy),
    by: normPerson(raw.by),
    createdAt: Number(raw.createdAt) || now,
    updatedAt: Number(raw.updatedAt) || now,
  };
}
const IDEA_FOLDERS = () => FOLDERS; // folders that hold idea cards
const newFolder = () => ui.folder;
const openTodos = (folder = null) => state.todos.filter(t => !t.done && t.folder === folder).length;
const folderCount = key => state.ideas.filter(i => i.folder === key && (ui.person === 'all' || (i.owner && i.owner.id === ui.person))).length;

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      return {
        ideas: Array.isArray(data.ideas) ? data.ideas.map(normalizeIdea) : [],
        todos: Array.isArray(data.todos) ? data.todos.map(normalizeTodo) : [],
        // ids of deleted ideas -> when they were deleted (so deletes also sync)
        deleted: data.deleted && typeof data.deleted === 'object' ? data.deleted : {},
        theme: data.theme || 'system',
        sort: data.sort || 'updated',
      };
    }
  } catch (err) {
    console.error('Could not load saved data', err);
  }
  return { ideas: [], todos: [], deleted: {}, theme: 'system', sort: 'updated' };
}

// fromSync = true when the sync code itself is saving (so it doesn't trigger another sync).
function saveState(fromSync = false) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {
    console.error(err);
    toast('⚠️ Could not save (storage full or blocked)');
  }
  if (!fromSync) scheduleSync();
}

// Call this whenever an idea changes: updates the date + activity history.
function touch(idea) {
  const now = Date.now();
  idea.updatedAt = now;
  if (me.name) idea.editedBy = myRef();
  idea.activity.push(now);
  // keep only the last 30 days (and at most 300 entries) so storage stays small
  idea.activity = idea.activity.filter(t => now - t < 30 * DAY).slice(-300);
}

// The app's whole saved state lives here.
let state = loadState();
// One time only: start on the ✔️ TickTick look (the theme button still changes it).
try { if (!localStorage.getItem('app-ideas-tick-theme')) { localStorage.setItem('app-ideas-tick-theme', '1'); state.theme = 'tick'; saveState(true); } } catch { /* ignore */ }

// Folders on Home. Every idea lives in exactly one.
const FOLDERS = [
  { key: 'apps', emoji: '💡', label: 'App ideas', title: '💡 App Ideas' },
  { key: 'vr',   emoji: '🥽', label: 'VR ideas',  title: '🥽 VR Ideas' },
  { key: 'pc',   emoji: '🖥️', label: 'PC app ideas', title: '🖥️ PC App Ideas' },
  { key: 'rea',  emoji: '🔍', label: 'REA', title: '🔍 REA — reverse engineering se banao' },
];

/* =====================================================================
   SECTION 4: PROGRESS CALCULATIONS
   ===================================================================== */

// Overall progress: manual value if set, otherwise steps done ÷ total steps (idea -> store).
function progressOf(idea) {
  if (idea.manualProgress !== null) return idea.manualProgress;
  return idea.steps.length ? stepInfo(idea).pct : autoProgress(idea.features);
}

// App status follows the roadmap: the phase of the current step, or Launched when all done.
// (On Hold is never changed automatically.)
function statusFromSteps(idea) {
  if (idea.status === 'onhold' || !idea.steps.length) return;
  const info = stepInfo(idea);
  if (!info.current) { idea.status = 'launched'; return; }
  for (let i = info.number - 1; i >= 0; i--) {
    if (idea.steps[i].phase) { idea.status = idea.steps[i].phase; return; }
  }
  idea.status = 'idea';
}

function autoProgress(features) {
  if (!features.length) return 0;
  const done = features.filter(f => f.status === 'done').length;
  return Math.round((done / features.length) * 100);
}

// MVP progress: only "Must have" features. Returns null if there are none.
function mvpProgressOf(idea) {
  const mvp = idea.features.filter(f => f.mvp);
  return mvp.length ? autoProgress(mvp) : null;
}

// Where you are on the roadmap: current step = first step not done yet.
function stepInfo(idea) {
  const total = idea.steps.length;
  const done = idea.steps.filter(st => st.done).length;
  const current = idea.steps.find(st => !st.done) || null;
  const number = current ? idea.steps.indexOf(current) + 1 : total;
  return { total, done, current, number, pct: total ? Math.round((done / total) * 100) : 0 };
}

// Short line like "📍 Step 3/7 · Build MVP" (used on cards).
function stepLine(idea) {
  const info = stepInfo(idea);
  if (!info.total) return '';
  if (!info.current) return `✅ Saare ${info.total} steps done`;
  return `📍 Step ${info.number}/${info.total} · ${esc(info.current.title)}`;
}

// How many changes happened to this idea in the last 7 days.
function weeklyActivity(idea) {
  const weekAgo = Date.now() - 7 * DAY;
  return idea.activity.filter(t => t >= weekAgo).length;
}

/* ----- Search: finds ideas in every folder, best matches first ----- */
// Score: name starts with query > name has it > word match > other fields. 0 = no match.
function ideaMatchScore(idea, q) {
  q = q.trim().toLowerCase();
  if (!q) return 0;
  const name = (idea.name || '').toLowerCase();
  if (name === q) return 100;
  if (name.startsWith(q)) return 80;
  if (name.includes(q)) return 60;
  const words = q.split(/\s+/).filter(Boolean);
  if (words.length > 1 && words.every(w => name.includes(w))) return 50;
  const other = [idea.owner ? idea.owner.name : '', idea.desc, idea.notes, idea.problem, idea.target,
    idea.tags.join(' '), idea.features.map(f => f.title).join(' ')].join(' ').toLowerCase();
  if (other.includes(q)) return 30;
  if (words.every(w => name.includes(w) || other.includes(w))) return 20;
  // a new name like "Pharma Notes" still finds "PharmaFlash"
  const nameWords = name.split(/[^a-z0-9ऀ-ॿ]+/).filter(w => w.length > 2);
  if (words.some(w => w.length > 2 && nameWords.some(n => n.startsWith(w) || w.startsWith(n)))) return 10;
  return 0;
}
function searchIdeas(q, list = state.ideas) {
  return list.map(i => [i, ideaMatchScore(i, q)]).filter(([, sc]) => sc > 0)
    .sort((a, b) => b[1] - a[1] || b[0].updatedAt - a[0].updatedAt).map(([i]) => i);
}
// Escapes text and highlights the searched part.
function hl(text, q) {
  const t = esc(text || '');
  q = (q || '').trim();
  if (!q) return t;
  const safe = esc(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return t.replace(new RegExp(safe, 'gi'), m => `<mark class="hl">${m}</mark>`);
}

          : canEarn() ? `<button class="icon-btn" data-action="todo-to-earn" data-id="${t.id}" aria-label="Earning me bhejo" title="💰 Earning me bhejo">📂</button>` : ''}
        <button class="icon-btn todo-sub" data-action="add-subtodo" data-id="${t.id}" aria-label="Iske andar task add karo" title="Andar task add karo">＋</button>
        <button class="icon-btn todo-del" data-action="delete-todo" data-id="${t.id}" aria-label="Delete">✕</button>
      </div>
      ${(kids.length && isOpen) || adding ? `<ul class="todo-list todo-children">
        ${isOpen ? [...kids].reverse().map(todoRow).join('') : ''}
        ${adding ? `<li><form id="subtodo-form" class="todo-add" data-parent="${t.id}" autocomplete="off">
          <input name="text" required maxlength="200" placeholder="Andar ka task… Enter dabao" aria-label="New sub-task">
          <button type="submit" class="btn primary">Add</button>
          <button type="button" class="btn" data-action="cancel-subtodo">✕</button>
        </form></li>` : ''}
      </ul>` : ''}
    </li>`;
}
function renderTodos(folder = null) {
  const ids = new Set(state.todos.map(t => t.id));
  const top = state.todos.filter(t => isTopTodo(t, ids) && t.folder === folder);
  const open = top.filter(t => !t.done).sort((a, b) => (b.priority - a.priority) || (b.createdAt - a.createdAt));
  const done = top.filter(t => t.done).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
  return `
    <form id="todo-form" class="todo-add" data-folder="${folder || ''}" autocomplete="off">
      <input name="text" required maxlength="${folder === INBOX ? 5000 : 200}" placeholder="${LISTS[folder] ? LISTS[folder].add : folder === INBOX ? 'Jaldi kuch likho… Enter dabao' : 'Kya karna hai? Likho aur Enter dabao…'}" aria-label="New to-do">
      <button type="submit" class="btn primary">+ Add</button>
    </form>
    <p class="muted small" style="margin:-4px 2px 10px">Kisi task ke andar aur task chahiye? Uske <b>＋</b> pe tap karo.</p>
    ${open.length ? `<ul class="todo-list">${open.map(todoRow).join('')}</ul>`
      : `<div class="card empty"><div class="big">${LISTS[folder] ? LISTS[folder].emoji : '🧰'}</div><p class="muted">${LISTS[folder]
        ? (done.length ? LISTS[folder].allDone : LISTS[folder].empty)
        : (done.length ? 'Sab ho gaya! 🎉 Naya kaam upar likho.' : 'Jo bhi karna hai, upar ek line me likho. Ho jaye to tick karo.')}</p></div>`}
    ${done.length ? `
      <div class="row-between" style="margin:18px 2px 8px">
        <b class="muted small">✓ Ho gaye (${done.length})</b>
        <button class="btn" data-action="clear-done-todos" data-folder="${folder || ''}" style="min-height:34px;padding:0 12px;font-size:.85rem">Clear done</button>
      </div>
      ${folder === CURRENT ? '' : `<ul class="todo-list">${done.map(todoRow).join('')}</ul>`}` : ''}`;
}

// Only re-draw the list (so typing in the search box doesn't lose focus).
function updateIdeaList() {
  const listEl = document.getElementById('idea-list');
  if (!listEl) return;

  const q = ui.search.trim().toLowerCase();
  const inFolder = state.ideas.filter(i => i.folder === ui.folder);

  // Typing in search → look in EVERY folder (any status / person), best matches first.
  if (q) {
    const found = searchIdeas(q);
    document.getElementById('result-count').textContent = `${found.length} mile · saare folders mein`;
    listEl.innerHTML = found.length ? found.map(i => ideaCard(i, q)).join('')
      : `<div class="card empty"><div class="big">🔎</div><p class="muted">"${esc(ui.search.trim())}" kahin nahi mila.</p>
         <div class="btn-row" style="margin-top:12px"><a class="btn primary" href="#/new" data-action="new-from-search" data-value="${esc(ui.search.trim())}">+ Isi naam se naya idea</a></div></div>`;
    animateBars();
    return;
  }

  let ideas = inFolder.filter(i => {
    if (ui.filter !== 'all' && i.status !== ui.filter) return false;
    if (ui.person !== 'all' && (!i.owner || i.owner.id !== ui.person)) return false;
    return true;
  });

  // Sorting
  ideas.sort((a, b) => {
    if (state.sort === 'progress') return progressOf(b) - progressOf(a) || b.updatedAt - a.updatedAt;
    if (state.sort === 'priority') return PRIORITY_RANK[b.priority] - PRIORITY_RANK[a.priority] || b.updatedAt - a.updatedAt;
    return b.updatedAt - a.updatedAt;
  });

  document.getElementById('result-count').textContent = `${ideas.length} idea${ideas.length === 1 ? '' : 's'}`;

  if (!state.ideas.length) {
    listEl.innerHTML = miscFolderCard() + `
      <div class="card empty">
        <div class="big">💡</div>
        <h2>No ideas yet</h2>
        <p class="muted">Apna pehla app idea add karo — ya ek sample idea load karke dekho app kaise kaam karta hai.</p>
        <div class="btn-row" style="margin-top:16px">
          <a class="btn primary" href="#/new">+ Add your first idea</a>
          <button class="btn" data-action="load-sample">Load sample idea</button>
        </div>
      </div>`;
    return;
  }
  if (!inFolder.length) {
    const f = folderOf(ui.folder);
    listEl.innerHTML = miscFolderCard() + `
      <div class="card empty">
        <div class="big">${f.emoji}</div>
        <h2>${f.label} folder khaali hai</h2>
        <p class="muted">Is folder ka pehla idea likho.</p>
        <div class="btn-row" style="margin-top:16px"><a class="btn primary" href="#/new">+ New idea in ${f.emoji} ${f.label}</a></div>
      </div>`;
    return;
  }
  if (!ideas.length) {
    listEl.innerHTML = miscFolderCard() + `<div class="card empty"><div class="big">🔎</div><p class="muted">No ideas match your search / filter.</p></div>`;
    return;
  }

  listEl.innerHTML = miscFolderCard() + ideas.map(ideaCard).join('');
  animateBars();
}

// The folder's own Misc list, shown as a folder card first in the grid.
function miscFolderCard() {
  const f = folderOf(ui.folder);
  const open = state.todos.filter(t => t.folder === f.key && !t.done && !t.parentId).sort((a, b) => b.createdAt - a.createdAt);
  const left = openTodos(f.key);
  return `
    <a class="card idea-card misc-folder" href="#/misc/${f.key}">
      <div class="card-top">
        <h3 class="row" style="gap:10px"><span class="misc-folder-ico">📁</span><span>🧰 Misc</span></h3>
        <span class="muted small">${left ? left + ' baaki' : ''} ›</span>
      </div>
      <p class="card-desc">${f.label} ke liye kuch bhi likho</p>
      ${open.length ? `<ul class="misc-peek">${open.slice(0, 3).map(t => `<li>○ ${esc(t.text)}</li>`).join('')}${open.length > 3 ? `<li class="muted">+${open.length - 3} aur…</li>` : ''}</ul>`
        : '<p class="muted small" style="margin:0">Abhi khaali — tap karke likhna shuru karo</p>'}
    </a>`;
}

function ideaCard(idea, q = '') {
  const pct = progressOf(idea);
  const s = statusOf(idea.status);
  const doneCount = idea.features.filter(f => f.status === 'done').length;
  return `
    <a class="card idea-card" href="#/idea/${idea.id}">
      <div class="card-top">
        <h3 class="row" style="gap:8px;align-items:flex-start">${avatar(idea.owner)}<span>${hl(idea.name, q)}${q ? ` <span class="muted small" title="${esc(folderOf(idea.folder).label)}">${folderOf(idea.folder).emoji}</span>` : ''}</span></h3>
        ${statusBadge(idea.status)}
      </div>
      <p class="card-desc">${hl(idea.desc, q) || '<i>No description</i>'}</p>
      ${idea.steps.length ? `<div class="step-line">${stepLine(idea)}</div>` : ''}
      ${progressBar('card-' + idea.id, pct, s.color)}
      <div class="card-meta">
        <span><b style="color:var(--text)">${pct}%</b> · ${doneCount}/${idea.features.length} features</span>
        <span class="row" style="gap:10px">
          <span title="Priority"><span class="dot" style="--c:${PRIORITY_COLORS[idea.priority]}"></span> ${idea.priority}</span>
          <span>${timeAgo(idea.updatedAt)}</span>
        </span>
      </div>
      ${idea.tags.length ? `<div class="tag-list">${idea.tags.slice(0, 4).map(t => `<span class="tag">#${esc(t)}</span>`).join('')}</div>` : ''}
    </a>`;
}
