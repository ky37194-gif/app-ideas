      <button type="button" class="btn block" data-action="close-sheet" style="margin-top:12px">Band karo</button></div>`;
    sheet.showModal();
  },
  'todo-move-into'(el) { openMoveInto(el.dataset.id); },
  'todo-move-pick'(el) { moveTodoInto(document.getElementById('sheet').dataset.moveId, el.dataset.value); },
};

document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'move-pick-search') { filterMovePick(el.value); return; }
  if (el.id !== 'tp-title' && el.id !== 'tp-desc') return;
  const t = state.todos.find(x => x.id === el.dataset.id);
  if (!t) return;
  autoGrow(el);
  if (el.id === 'tp-title') {
    const v = el.value.replace(/\n/g, ' ');
    if (!v.trim()) return; // never save an empty name
    t.text = v;
    const row = document.querySelector(`.todo-text[data-id="${t.id}"] .tt`);
    if (row) row.textContent = v;
  } else t.desc = el.value;
  t.updatedAt = Date.now();
  clearTimeout(tpSaveTimer);
  tpSaveTimer = setTimeout(() => saveState(), 500);
});
document.addEventListener('keydown', e => {
  if (e.target.id === 'tp-title' && e.key === 'Enter' && !e.isComposing) { e.preventDefault(); e.target.blur(); }
  if (e.target.id === 'move-pick-search' && e.key === 'Enter') {
    e.preventDefault();
    if (e.target.value.trim()) [...document.querySelectorAll('#move-pick button')].find(b => !b.hidden)?.click();
  }
  if (e.key === 'Escape' && ui.openTodo && !document.getElementById('sheet').open && !document.getElementById('drawer').classList.contains('open')) { ui.openTodo = null; render(); }
});
// Leaving a field: save now; if the name was emptied, show the saved one again.
document.addEventListener('focusout', e => {
  if (e.target.id !== 'tp-title' && e.target.id !== 'tp-desc') return;
  clearTimeout(tpSaveTimer);
  saveState();
  const t = state.todos.find(x => x.id === e.target.dataset.id);
  if (t && e.target.id === 'tp-title' && !e.target.value.trim()) e.target.value = t.text;
});
document.addEventListener('change', e => {
  if (e.target.id === 'tp-img-input' && e.target.files.length) { addTodoImages(ui.openTodo, e.target.files); e.target.value = ''; }
});
document.addEventListener('paste', e => {
  if (e.target.id !== 'tp-desc' && e.target.id !== 'tp-title') return;
  const files = [...(e.clipboardData?.files || [])].filter(f => f.type.startsWith('image/'));
  if (!files.length) return;
  e.preventDefault();
  addTodoImages(ui.openTodo, files);
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'tp-sub-form') return;
  e.preventDefault();
  const form = e.target;
  const text = form.elements.text.value.trim();
  const parent = state.todos.find(t => t.id === form.dataset.parent);
  if (!text || !parent) return;
  state.todos.push(normalizeTodo({ text, parentId: parent.id, folder: parent.folder, by: myRef() }));
  for (let p = parent; p && p.done; p = state.todos.find(t => t.id === p.parentId)) {
    p.done = false; p.doneAt = null; p.doneBy = null; p.updatedAt = Date.now();
  }
  collapsed.delete(parent.id); saveCollapsed();
  saveState(); render();
  document.querySelector('#tp-sub-form input')?.focus();
});
Object.assign(actions, panelActions);

/* ----- ⚡ Quick add (like TickTick): press N / Q anywhere, or the ⚡ button in the top bar ----- */
const QA_LISTS = () => [[INBOX, '📥 Inbox'], [TODAY, '📅 Today'], [CURRENT, '🎯 Current'], [APPWORK, '🛠️ Is App'], [DOUBTS, '❓ Doubt'], ['', '🧰 Misc']];
function openQuickAdd() {
  const { page } = parseRoute();
  const here = page === 'misc' ? '' : LISTS[page] || page === INBOX ? page : null;
  ui.qaList = here ?? ui.qaList ?? INBOX;
  const sheet = document.getElementById('sheet');
  sheet.innerHTML = `
    <form id="qa-form" class="sheet-inner" autocomplete="off">
      <h2>⚡ Jaldi task add karo</h2>
      <input name="text" required maxlength="200" placeholder="Kya karna hai? Enter = add  (end me ! = 🔥 priority)" aria-label="New task">
      <div class="qa-lists" role="radiogroup" aria-label="Kis list me">
        ${QA_LISTS().map(([k, l]) => `<button type="button" class="chip ${ui.qaList === k ? 'active' : ''}" data-action="qa-list" data-value="${k}" role="radio" aria-checked="${ui.qaList === k}">${l}</button>`).join('')}
      </div>
      <label class="check"><input type="checkbox" name="today"${ui.qaList === TODAY ? ' disabled' : ''}> ☀️ Aaj bhi dikhao</label>
      <p id="qa-added" class="muted small" style="margin:8px 0 0"></p>
      <div class="btn-row" style="margin-top:12px">
        <button type="button" class="btn" data-action="close-sheet">Band karo</button>
        <button type="submit" class="btn primary">+ Add</button>
      </div>
      <p class="muted small" style="margin:10px 0 0">PC: kahin bhi <b>N</b> ya <b>Q</b> dabao → ye khulega.</p>
    </form>`;
  if (!sheet.open) sheet.showModal();
  sheet.querySelector('input[name="text"]').focus();
}
actions['quick-add'] = () => openQuickAdd();
actions['qa-list'] = el => {
  ui.qaList = el.dataset.value;
  document.querySelectorAll('.qa-lists .chip').forEach(c => { c.classList.toggle('active', c === el); c.setAttribute('aria-checked', c === el); });
  const today = document.querySelector('#qa-form input[name="today"]');
  if (today) today.disabled = ui.qaList === TODAY;
  document.querySelector('#qa-form input[name="text"]')?.focus();
};
document.addEventListener('submit', e => {
  if (e.target.id !== 'qa-form') return;
  e.preventDefault();
  const form = e.target;
  let text = form.elements.text.value.trim();
  if (!text) return;
  const priority = /!\s*$/.test(text);
  if (priority) text = text.replace(/!+\s*$/, '').trim() || text;
  const folder = ui.qaList || null;
  state.todos.push(normalizeTodo({ text, folder, priority, today: form.elements.today.checked && folder !== TODAY, by: myRef() }));
  saveState();
  render(); // list behind updates; the sheet stays open for the next task
  form.elements.text.value = '';
  form.elements.text.focus();
  document.getElementById('qa-added').textContent = `✅ "${text.slice(0, 40)}" → ${listName(folder)}${priority ? ' 🔥' : ''}`;
});
document.addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(e.target.tagName) || e.target.isContentEditable;
  if (typing || e.ctrlKey || e.metaKey || e.altKey || !cloud.code) return;
  if ((e.key === 'n' || e.key === 'q' || e.key === 'N' || e.key === 'Q') && !document.getElementById('sheet').open) {
    e.preventDefault();
    openQuickAdd();
  }
});



// Clicks
document.addEventListener('click', e => {
  if (slash && !e.target.closest('#slash')) hideSlash();
  const el = e.target.closest('[data-action]');
  if (!el) return;
  e.preventDefault();
  actions[el.dataset.action]?.(el, e);
});

// Form submissions
document.addEventListener('submit', e => {
  e.preventDefault();
  const form = e.target;

  if (form.id === 'idea-form') saveIdeaForm(form);
  if (form.id === 'quick-form') saveQuick(form, e.submitter);
  if (form.id === 'earn-lock-form') unlockEarning(form);
  if (form.id === 'login-form') loginWithId(form);
  if (form.id === 'account-form') createAccount(form);
  if (form.id === 'login-pw-form') changeLoginPw(form);
  if (form.id === 'earn-cred-form') saveEarnCreds(form);

  if (form.id === 'password-form') {
    const button = form.querySelector('button[type="submit"]');
    button.disabled = true;
    button.textContent = '…';
    connectWithPassword(form.elements.password.value).then(ok => {
      if (ok && parseRoute().page === 'join') location.hash = '#/'; else render();
    });
  }

  if (form.id === 'feature-form') {
    const idea = findIdea(currentIdeaId());
    const title = form.elements.title.value.trim();
    if (!title) return;
    idea.features.push({ id: uid(), title, desc: form.elements.desc.value.trim(), status: 'todo', mvp: form.elements.mvp.checked, by: myRef() });
    touch(idea); saveState(); render();
    document.querySelector('#feature-form [name="title"]')?.focus(); // ready for the next one
    toast('➕ Feature added');
  }

  if (form.id === 'step-form') {
    const idea = findIdea(currentIdeaId());
    const title = form.elements.title.value.trim();
    if (!title) return;
    idea.steps.push({ id: uid(), title, phase: '', done: false, doneAt: null, doneBy: null, by: myRef() });
    touch(idea); saveState(); render();
    document.querySelector('#step-form [name="title"]')?.focus();
    toast('➕ Step added');
  }

  if (form.id === 'step-edit-form') {
    const idea = findIdea(form.dataset.idea);
    const st = idea.steps.find(x => x.id === form.dataset.id);
    const title = form.elements.title.value.trim();
    if (!title) { toast('Step cannot be empty'); return; }
    const undo = stepUndo(idea);
    st.title = title;
    setStepDone(idea, st, form.elements.done.checked);
    statusFromSteps(idea);
    touch(idea); saveState(); closeSheet(); render();
    toast('✅ Saved', undo);
  }

  if (form.id === 'feature-edit-form') {
    const idea = findIdea(form.dataset.idea);
    const f = idea.features.find(x => x.id === form.dataset.id);
    const title = form.elements.title.value.trim();
    if (!title) { toast('Title cannot be empty'); return; }
    f.title = title;
    f.desc = form.elements.desc.value.trim();
    f.status = form.elements.status.value;
    f.mvp = form.elements.mvp.value === '1';
    touch(idea); saveState(); closeSheet(); render();
  }

  if (form.id === 'todo-form') {
    const text = form.elements.text.value.trim();
    if (!text) return;
    state.todos.push(normalizeTodo({ text, folder: form.dataset.folder || null, by: myRef() }));
    saveState(); render();
    document.querySelector('#todo-form input')?.focus(); // keep typing the next one
  }

  if (form.id === 'subtodo-form') {
    const text = form.elements.text.value.trim();
    const parent = state.todos.find(t => t.id === form.dataset.parent);
    if (!text || !parent) return;
    state.todos.push(normalizeTodo({ text, parentId: parent.id, folder: parent.folder, by: myRef() }));
    // Adding open work inside a done task re-opens that task (and the ones above it).
    for (let p = parent; p && p.done; p = state.todos.find(t => t.id === p.parentId)) {
      p.done = false; p.doneAt = null; p.doneBy = null; p.updatedAt = Date.now();
    }
    saveState(); render(); // form stays open for the next one
  }

  if (form.id === 'log-form') {
    const idea = findIdea(currentIdeaId());
    const text = form.elements.text.value.trim();
    if (!text) return;
    // entries always get today's date (no calendar to pick from)
    idea.log.push({ id: uid(), date: todayStr(), text, createdAt: Date.now(), by: myRef() });
    touch(idea); saveState(); render();
    toast('📓 Entry added');
  }
});

// New idea: while typing the name, show ideas that already look the same.
function updateDupHint(name) {
  const box = document.getElementById('dup-hint');
  if (!box) return;
  const q = name.trim();
  const found = q.length >= 2 ? searchIdeas(q).slice(0, 4) : [];
  box.className = found.length ? 'dup-hint' : '';
  box.innerHTML = found.length ? '<b>👀 Ye pehle se hai? (tap karke kholo)</b>' + found.map(i => `
    <a href="#/idea/${i.id}">${avatar(i.owner)}<span>${hl(i.name, q)}</span>
      <span class="meta">${folderOf(i.folder).emoji} ${esc(folderOf(i.folder).label)} · ${progressOf(i)}%</span></a>`).join('') : '';
}

// Typing (search box, manual progress slider)
document.addEventListener('input', e => {
  if (e.target.id === 'search') {
    ui.search = e.target.value;
    updateIdeaList();
  }
  if (e.target.id === 'drawer-search') {
    ui.drawerSearch = e.target.value;
    document.getElementById('drawer-list').innerHTML = drawerList();
  }
  if (e.target.id === 'earn-pick-search') filterEarnPick(e.target.value);
  if (e.target.dataset?.dupcheck) updateDupHint(e.target.value);
  if (e.target.classList?.contains('blk-text')) onBlockInput(e.target);
  if (e.target.id === 'pg-title') onTitleInput(e.target);
  if (e.target.name === 'manualVal') {
    document.getElementById('manual-out').textContent = e.target.value + '%';
  }
});

// Dropdowns, checkboxes, file picker
document.addEventListener('change', e => {
  const t = e.target;

  if (t.id === 'sort') {
    state.sort = t.value;
    saveState();
    updateIdeaList();
  }

  if (t.dataset.change === 'status') {
    const idea = findIdea(currentIdeaId());
    idea.status = t.value;
    touch(idea); saveState(); render();
    toast(`Status → ${statusOf(t.value).emoji} ${statusOf(t.value).label}`);
  }

  if (t.name === 'manualOn') {
    document.getElementById('manual-wrap').style.display = t.checked ? '' : 'none';
  }

  if (t.name === 'monetization') {
    const form = t.form;
    const needsPrice = [...form.querySelectorAll('[name="monetization"]:checked')].some(c => c.value === 'Paid' || c.value === 'Subscription');
    document.getElementById('price-field').style.display = needsPrice ? '' : 'none';
  }

  if (t.id === 'import-file' && t.files[0]) {
    const reader = new FileReader();
    reader.onload = () => importJSON(reader.result, ui.importMode);
    reader.readAsText(t.files[0]);
    t.value = ''; // allow importing the same file again
  }
});

// Close the bottom sheet when tapping the dark backdrop.
document.getElementById('sheet').addEventListener('click', e => {
  if (e.target.id === 'sheet') closeSheet();
});


/* =====================================================================
   SECTION 14B: AUTO-UPDATE
   The phone app / an open tab can stay on an old version for days.
   When the app comes back on screen (and every 10 min), check the live page;
   if a newer version is out, reload — but never while you're typing.
   ===================================================================== */
const APP_VERSION = '2026-11-11a';
async function checkForUpdate() {
  if (location.protocol !== 'https:' || !navigator.onLine) return;
  try {
    const res = await fetch('./?v=' + Date.now(), { cache: 'no-store' });
    const live = (/const APP_VERSION = '([^']+)'/.exec(await res.text()) || [])[1];
    if (!live || live === APP_VERSION) return;
    const a = document.activeElement;
    const typing = a && (/INPUT|TEXTAREA|SELECT/.test(a.tagName) || a.isContentEditable);
    if (typing || document.getElementById('sheet').open || slash) return; // try again next time
    flushEarn();
    saveState(true);
    location.reload();
  } catch { /* offline — fine */ }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkForUpdate(); });
setInterval(() => { if (!document.hidden) checkForUpdate(); }, 10 * 60 * 1000);

/* =====================================================================
   SECTION 15: START THE APP
   ===================================================================== */
applyTheme();
ui.tabFor = parseRoute().id;

render();
syncNow(); // get the latest ideas from the cloud (if sync is on)
earnSyncNow(); // and the private Earning pages (if unlocked on this device)
checkForUpdate();
</script>
</body>
</html>
