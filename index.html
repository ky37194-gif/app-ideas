function linkRow(link = { label: '', url: '' }) {
  return `
    <div class="link-row row" style="align-items:stretch">
      <input name="linkLabel" placeholder="Label (e.g. GitHub)" value="${esc(link.label)}" style="flex:1 1 35%">
      <input name="linkUrl" placeholder="https://…" value="${esc(link.url)}" inputmode="url" style="flex:1 1 55%">
      <button type="button" class="icon-btn" data-action="remove-link-row" aria-label="Remove link">✕</button>
    </div>`;
}

function saveIdeaForm(form) {
  const fd = new FormData(form);
  const name = String(fd.get('name') || '').trim();
  if (!name) {
    toast('Please enter an app name');
    form.elements.name.focus();
    return;
  }

  let idea = form.dataset.id ? findIdea(form.dataset.id) : null;
  const isNew = !idea;
  if (isNew) {
    idea = normalizeIdea({ owner: myRef() });
    state.ideas.unshift(idea);
  }

  // Links come in as two parallel lists: labels and urls.
  const labels = fd.getAll('linkLabel');
  const urls = fd.getAll('linkUrl');
  const links = urls
    .map((url, i) => ({ id: uid(), label: String(labels[i] || '').trim(), url: String(url).trim() }))
    .filter(l => l.url);

  Object.assign(idea, {
    name,
    folder: folderOf(fd.get('folder')).key,
    desc: String(fd.get('desc') || '').trim(),
    problem: String(fd.get('problem') || '').trim(),
    target: String(fd.get('target') || '').trim(),
    notes: String(fd.get('notes') || '').trim(),
    status: fd.get('status') || 'idea',
    priority: fd.get('priority') || 'Medium',
    platforms: fd.getAll('platforms'),
    monetization: fd.getAll('monetization'),
    price: String(fd.get('price') || '').trim(),
    tags: parseTags(fd.get('tags')),
    links,
    manualProgress: fd.get('manualOn') ? Number(fd.get('manualVal')) : null,
  });
  // Folder changed (App <-> VR) and the ready-made roadmap is still untouched -> use that folder's roadmap.
  if (!idea.steps.some(st => st.done) && idea.steps.every(st => /^t\d+$/.test(st.id))) idea.steps = templateSteps(idea.folder);

  touch(idea);
  saveState();
  toast(isNew ? '✨ Idea created' : '✅ Saved');
  location.hash = `#/idea/${idea.id}`;
}


/* =====================================================================
   SECTION 9: SCREEN — IDEA DETAIL (features, journal, info)
   ===================================================================== */

function renderDetail(idea) {
  const pct = progressOf(idea);
  const mvp = mvpProgressOf(idea);
  const s = statusOf(idea.status);
  const total = idea.features.length;
  const done = idea.features.filter(f => f.status === 'done').length;
  const mvpFeatures = idea.features.filter(f => f.mvp);

  const actions = `
    <button class="icon-btn" data-action="copy-idea" aria-label="Copy as text" title="Copy as text">📋</button>
    <a class="icon-btn" href="#/edit/${idea.id}" aria-label="Edit idea" title="Edit">✏️</a>`;

  const steps = stepInfo(idea);
  const tabs = [
    ['steps', `Steps (${steps.done}/${steps.total})`],
    ['features', `Features (${total})`],
    ['journal', `Journal (${idea.log.length})`],
    ['info', 'Details'],
  ];

  let tabContent = '';
  if (ui.tab === 'journal') tabContent = renderJournalTab(idea);
  else if (ui.tab === 'info') tabContent = renderInfoTab(idea);
  else if (ui.tab === 'features') tabContent = renderFeaturesTab(idea);
  else tabContent = renderStepsTab(idea);

  return `
    ${topBar(esc(idea.name), { back: '#/', actions })}
    <main class="page">
      <section class="card hero">
        <div class="badges" style="align-items:center">${statusBadge(idea.status)} ${priorityBadge(idea.priority)}
          <button class="mini hero-prio ${idea.priority === 'High' ? 'on' : ''}" data-action="idea-prio">🔥 ${idea.priority === 'High' ? 'Priority hai' : 'Priority banao'}</button></div>
        <p class="row small muted" style="margin:10px 0 0;flex-wrap:wrap">Updated ${timeAgo(idea.updatedAt)}</p>
        <h1>${esc(idea.name)}</h1>
        ${idea.desc ? `<p>${esc(idea.desc)}</p>` : ''}

        <div class="where-now">
          ${steps.total ? `
            <div class="row-between" style="gap:8px">
              <b>${steps.current ? `📍 Abhi yahan ho: Step ${steps.number}/${steps.total}` : '🎉 Saare steps complete!'}</b>
              <span class="muted small">${steps.done}/${steps.total} done</span>
            </div>
            ${steps.current ? `<div class="where-step">${esc(steps.current.title)}</div>` : ''}
            <div class="step-dots" aria-hidden="true">${idea.steps.map(st => `<span class="${st.done ? 'done' : st === steps.current ? 'now' : ''}" title="${esc(st.title)}"></span>`).join('')}</div>`
          : `<div class="row-between" style="gap:8px"><span class="muted">📍 Kis step pe ho? Abhi koi steps nahi.</span>
              <button class="btn small-btn" data-action="tab" data-value="steps">+ Steps banao</button></div>`}
        </div>

        <label class="field" style="margin:0">
          <span class="label small muted">Quick status change</span>
          <select data-change="status" aria-label="Status">
            ${STATUSES.map(st => `<option value="${st.key}" ${st.key === idea.status ? 'selected' : ''}>${st.emoji} ${st.label}</option>`).join('')}
          </select>
        </label>

        <div class="progress-grid">
          <div>
            <div class="progress-label">
              <span>${finishOf(idea.folder)} tak progress ${idea.manualProgress !== null ? '<span class="tag">manual</span>' : `<span class="muted">· ${steps.done}/${steps.total} steps</span>`}</span>
              <b>${pct}%</b>
            </div>
            ${progressBar('overall-' + idea.id, pct, s.color, true)}
          </div>
          <div>
            <div class="progress-label">
              <span>MVP progress <span class="muted">· ${mvpFeatures.filter(f => f.status === 'done').length}/${mvpFeatures.length} must-haves</span></span>
              <b>${mvp === null ? '—' : mvp + '%'}</b>
            </div>
            ${progressBar('mvp-' + idea.id, mvp || 0, 'var(--danger)', true)}
          </div>
        </div>
      </section>

      <div class="tabs" role="tablist">
        ${tabs.map(([key, label]) => `<button class="tab ${ui.tab === key ? 'active' : ''}" role="tab" aria-selected="${ui.tab === key}" data-action="tab" data-value="${key}">${label}</button>`).join('')}
      </div>

      ${tabContent}

      <div class="btn-row" style="margin-top:28px">
        <button class="btn" data-action="copy-idea">📋 Copy as text</button>
        <button class="btn danger" data-action="delete-idea">🗑️ Delete idea</button>
      </div>
    </main>`;
}

/* ----- Features tab ----- */
function renderFeaturesTab(idea) {
  const later = idea.features.filter(f => !f.mvp);
  const items = idea.features.map(f => `
    <li class="feature" data-id="${f.id}" data-status="${f.status}">
      <button class="drag-handle" aria-label="Drag to reorder" title="Drag to reorder">⋮⋮</button>
      <button class="f-status" data-action="cycle-feature" data-id="${f.id}"
        aria-label="Status: ${FEATURE_LABEL[f.status]}. Tap to change" title="Tap to change status">${FEATURE_ICON[f.status]}</button>
      <div class="f-body">
        <div class="f-title">${esc(f.title)}</div>
        ${f.desc ? `<div class="f-desc">${esc(f.desc)}</div>` : ''}
        <div class="f-tags">
          <button class="mini ${f.mvp ? 'mvp' : ''}" data-action="toggle-mvp" data-id="${f.id}" title="Tap to switch MVP / Later">${f.mvp ? '⭐ MVP' : '🕒 Later'}</button>
          ${f.by ? avatar(f.by) : ''}
          <span class="mini state-${f.status}" style="cursor:default;display:inline-flex;align-items:center">${FEATURE_LABEL[f.status]}</span>
        </div>
      </div>
      <button class="icon-btn" data-action="edit-feature" data-id="${f.id}" aria-label="Edit feature" style="font-size:1rem">✎</button>
    </li>`).join('');

  return `
    <form id="feature-form" class="card add-form" autocomplete="off">
      <input name="title" placeholder="Add a feature… e.g. Login with Google" maxlength="120" required aria-label="Feature title">

    ${idea.features.length ? `

    : `<div class="card empty"><div class="big">🧩</div><p class="muted">No features yet. Add the first one above!</p></div>`}`;
}

/* ----- Steps tab (roadmap checklist) ----- */
function renderStepsTab(idea) {
  const info = stepInfo(idea);
  const last = idea.steps.length - 1;
  const items = idea.steps.map((st, i) => {
    const isNow = st === info.current;
    const state = st.done ? 'done' : isNow ? 'doing' : 'todo';
    return `
    <li class="feature step" data-id="${st.id}" data-status="${state}">
      <button class="f-status" data-action="toggle-step" data-id="${st.id}"

// Save the idea's steps/status/journal before a change, so a mistaken tap can be undone.
function stepUndo(idea) {
  const saved = JSON.stringify({ steps: idea.steps, status: idea.status, log: idea.log });
  return () => {
    const cur = findIdea(idea.id);
    if (!cur) return;
    Object.assign(cur, JSON.parse(saved));
    touch(cur); saveState(); render();
    toast('↩️ Wapas pehle jaisa');
  };
}

// Mark a step done/undone, and note it in the journal so "kya kya hogya" stays visible.
function setStepDone(idea, step, done) {
  if (step.done === done) return;
  step.done = done;
  step.doneAt = done ? Date.now() : null;
  step.doneBy = done ? myRef() : null;
  if (done) idea.log.push({ id: uid(), date: todayStr(), text: `✅ Step done: ${step.title}`, createdAt: Date.now(), by: myRef() });
  else {
    // un-ticked: remove its "Step done" line from the journal too
    const text = `✅ Step done: ${step.title}`;
    for (let i = idea.log.length - 1; i >= 0; i--) {
      if (idea.log[i].text === text) { idea.log.splice(i, 1); break; }
    }
  }
}

function exportJSON() {
  const data = { app: 'app-ideas-tracker', version: 1, exportedAt: new Date().toISOString(), ideas: state.ideas };
  const json = JSON.stringify(data, null, 2);
  const fileName = `app-ideas-backup-${todayStr()}.json`;

  // Inside the Android app: ask the app to save the file into Downloads.
  if (window.AndroidBridge) {
    toast(AndroidBridge.saveFile(fileName, json) ? `⬇️ Saved to Downloads: ${fileName}` : '❌ Could not save file');
    return;
  }

  // In a normal browser: trigger a file download.
  const blob = new Blob([json], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast(`⬇️ Exported ${state.ideas.length} ideas`);
}

function importJSON(text, mode) {
  let data;
  try { data = JSON.parse(text); }
  catch { toast('❌ That file is not valid JSON'); return; }

  // Accept either { ideas: [...] } or a plain array.
  const list = Array.isArray(data) ? data : data && Array.isArray(data.ideas) ? data.ideas : null;
  if (!list) { toast('❌ No ideas found in that file'); return; }
  const incoming = list.map(normalizeIdea);

  if (mode === 'replace') {
    if (!confirm(`Replace ALL ${state.ideas.length} current ideas with ${incoming.length} imported ideas? This cannot be undone.`)) return;
    const keep = new Set(incoming.map(i => i.id));
    state.ideas.forEach(i => { if (!keep.has(i.id)) state.deleted[i.id] = Date.now(); });
    incoming.forEach(i => delete state.deleted[i.id]);
    state.ideas = incoming;
  } else {
    // Merge: same id -> keep the newer version; new id -> add it.
    let added = 0, updated = 0;
    incoming.forEach(inc => {
      const idx = state.ideas.findIndex(i => i.id === inc.id);
      if (idx === -1) { state.ideas.push(inc); added++; }
      else if (inc.updatedAt > state.ideas[idx].updatedAt) { state.ideas[idx] = inc; updated++; }
    });
    toast(`⬆️ Imported: ${added} new, ${updated} updated`);
  }
  saveState();
  if (mode === 'replace') toast(`⬆️ Imported ${incoming.length} ideas`);
  render();
}

// Plain-text summary, handy for sharing or pasting into an AI tool.
function ideaToText(idea) {
  const s = statusOf(idea.status);
  const mvp = mvpProgressOf(idea);
  const lines = [];
  lines.push(`📱 ${idea.name}`);
  if (idea.desc) lines.push(idea.desc);
  lines.push('');
  lines.push(`Status: ${s.emoji} ${s.label} | Priority: ${idea.priority} | Progress: ${progressOf(idea)}%${mvp !== null ? ` (MVP ${mvp}%)` : ''}`);
  if (idea.platforms.length) lines.push(`Platforms: ${idea.platforms.join(', ')}`);
  if (idea.monetization.length) lines.push(`Monetization: ${idea.monetization.join(', ')}${idea.price ? ` (${idea.price})` : ''}`);
  if (idea.tags.length) lines.push(`Tags: ${idea.tags.map(t => '#' + t).join(' ')}`);
  if (idea.problem) lines.push('', 'Problem it solves:', idea.problem);
  if (idea.target) lines.push('', 'Target users:', idea.target);
  if (idea.notes) lines.push('', 'Notes:', idea.notes);
  if (idea.steps.length) {
    const info = stepInfo(idea);
    lines.push('', `Steps (${info.done}/${info.total} done${info.current ? `, now on step ${info.number}` : ''}):`);
    idea.steps.forEach((st, i) => lines.push(`${st.done ? '[x]' : st === info.current ? '[>]' : '[ ]'} ${i + 1}. ${st.title}`));
  }
  if (idea.features.length) {
    const mark = { todo: '[ ]', doing: '[~]', done: '[x]' };
    lines.push('', 'Features ([x] done, [~] in progress, [ ] to do):');
    idea.features.forEach(f => {
      lines.push(`${mark[f.status]} ${f.title} — ${f.mvp ? 'MVP' : 'Later'}${f.desc ? `: ${f.desc}` : ''}`);
    });
  }
  if (idea.links.length) {
    lines.push('', 'Links:');
    idea.links.forEach(l => lines.push(`- ${l.label ? l.label + ': ' : ''}${l.url}`));
  }
  if (idea.log.length) {
    lines.push('', 'Recent progress log:');
    [...idea.log].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 10)
      .forEach(l => lines.push(`- ${l.date}: ${l.text}`));
  }
  return lines.join('\n');
}

/* =====================================================================
   SECTION 11B: WHO WROTE IT (K / S) + CLOUD SYNC WITH A PASSWORD
   ---------------------------------------------------------------------
   Who: each device remembers who is using it — "K" or "S" (or any short
   name). Every idea, feature and journal entry stores that letter, so you
   can see who added it.

   Sync: type the same password once on every device (phone, PC, bhaiya's
   phone). The password is turned into a long code with PBKDF2 and only
   that code is kept. The password itself is never saved or sent.
   The server (api/sync.js) keeps the data in a private Vercel Blob file.

   How syncing works:
     1. Download the cloud copy (with its version tag "etag").
     2. Merge: for each idea the newer edit wins; deletes are remembered.
     3. Upload — only if nobody else saved in between (else retry).
   ===================================================================== */
const SYNC_API = '/api/sync';
const PROFILE_KEY = 'appIdeasTracker.profile';
const CLOUD_KEY = 'appIdeasTracker.cloud';
const PEOPLE = ['K', 'S']; // quick choices for "Aap kaun ho?" (saved as the letter)
const FULL_NAMES = { K: 'Kuldeep', S: 'Sandeep' }; // shown on screen
const fullName = name => FULL_NAMES[name] || name;
const PERSON_KEY = 'app-ideas-person'; // whose ideas Home shows on this device

const readJSON = key => { try { return JSON.parse(localStorage.getItem(key)) || {}; } catch { return {}; } };
const writeJSON = (key, value) => { try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* ignore */ } };

// Who is using this device: { name }
let me = readJSON(PROFILE_KEY);
me.name = 'K'; // only one user (Kuldeep) — no "who are you" choice
// Home shows only your own ideas by default; the switch on top shows the other person's or both.
ui.person = 'all'; // person switch removed — always show everyone's ideas
// Cloud sync settings for this device: { code, lastSync, off }
let cloud = readJSON(CLOUD_KEY);
const syncState = { status: cloud.code ? 'idle' : 'off', message: '', running: false, again: false, timer: null };

const myRef = () => (me.name ? { id: me.name, name: me.name } : null);
const isMe = person => !!person && !!me.name && person.name === me.name;

// Choose who I am. Ideas with no owner yet become mine.
function setMyName(name) {
  name = String(name || '').trim().slice(0, 12);
  if (!name) return false;
  me = { name };
  writeJSON(PROFILE_KEY, me);
  state.ideas.forEach(idea => { if (!idea.owner) { idea.owner = myRef(); touch(idea); } });
  saveState();
  return true;
}

// Coloured circle with the person's letter (K, S…).
function avatar(person) {
  return ''; // single user — no K/S letters anywhere
  if (!person || !person.name) return '';
  const fixed = { K: 230, S: 150 };
  let hue = fixed[person.name];
  if (hue === undefined) { hue = 0; for (const ch of person.name) hue = (hue * 31 + ch.codePointAt(0)) % 360; }
  return `<span class="avatar" style="--h:${hue}" title="Added by ${esc(fullName(person.name))}">${esc([...person.name][0].toUpperCase())}</span>`;
}
const personName = p => (p ? esc(fullName(p.name)) + (isMe(p) ? ' <span class="muted">(you)</span>' : '') : '');

// Everyone who owns at least one idea (plus me).
function people() {
  const names = new Set([...PEOPLE, ...state.ideas.map(i => i.owner && i.owner.name).filter(Boolean)]);
  if (me.name) names.add(me.name);
  return [...names].sort((a, b) => (isMe({ name: b }) - isMe({ name: a })) || a.localeCompare(b)).map(name => ({ id: name, name }));
}

// "Aap kaun ho?" buttons
function whoAmIButtons() {
  return PEOPLE.map(p => `<button class="btn ${me.name === p ? 'primary' : ''}" data-action="set-name" data-value="${p}">${avatar({ name: p })} ${fullName(p)}${p === 'S' ? ' (bhaiya)' : ''}</button>`).join('');
}

/* ----- Password → code ----- */
async function passwordToCode(password, salt = 'app-ideas-tracker-sync-v1') {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(password.trim()), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits(
    { name: 'PBKDF2', salt: enc.encode(salt), iterations: 300000, hash: 'SHA-256' }, base, 256);
  return [...new Uint8Array(bits)].map(b => b.toString(16).padStart(2, '0')).join('');
}

async function cloudRequest(method, body, code = cloud.code) {
  const res = await fetch(SYNC_API, {
    method,
    cache: 'no-store',
    headers: { 'x-sync-key': code, ...(body ? { 'content-type': 'application/json' } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  return { status: res.status, ok: res.ok, data };
}

/* ----- Merge helpers ----- */
// Newer idea wins; a delete wins if it is newer than the idea.
function mergeData(a, b) {
  const deleted = { ...a.deleted };
  Object.entries(b.deleted || {}).forEach(([id, t]) => { deleted[id] = Math.max(deleted[id] || 0, t); });
  Object.keys(deleted).forEach(id => { if (Date.now() - deleted[id] > 90 * DAY) delete deleted[id]; });

  const byId = new Map();
  [...a.ideas, ...b.ideas].forEach(idea => {
    const current = byId.get(idea.id);
    if (!current || idea.updatedAt > current.updatedAt) byId.set(idea.id, idea);
  });
  const ideas = [...byId.values()].filter(i => !(deleted[i.id] && deleted[i.id] >= i.updatedAt));

  const todoById = new Map();
  [...(a.todos || []), ...(b.todos || [])].forEach(t => {
    const current = todoById.get(t.id);
    if (!current || t.updatedAt > current.updatedAt) todoById.set(t.id, t);
  });
  const todos = [...todoById.values()].filter(t => !(deleted[t.id] && deleted[t.id] >= t.updatedAt));
  return { ideas, todos, deleted };
}

// A stable text version of the data, used to check "did anything change?"
function fingerprint(data) {
  const ideas = [...data.ideas].sort((x, y) => (x.id < y.id ? -1 : 1));
  const deleted = Object.keys(data.deleted).sort().map(k => [k, data.deleted[k]]);
  const todos = [...(data.todos || [])].sort((x, y) => (x.id < y.id ? -1 : 1));
  return JSON.stringify([ideas, deleted, todos]);
}

/* ----- Sync ----- */
// Sync shortly after the last change (so fast tapping = one upload).
function scheduleSync() {
  if (!cloud.code) return;
  clearTimeout(syncState.timer);
  syncState.timer = setTimeout(syncNow, 1200);
}

async function syncNow() {
  if (!cloud.code) return;
  if (syncState.running) { syncState.again = true; return; }
  if (!navigator.onLine) { setSyncStatus('error', 'Offline — will sync when back online'); return; }

  syncState.running = true;
  setSyncStatus('syncing');
  try {
    for (let attempt = 0; attempt < 4; attempt++) {
      const got = await cloudRequest('GET');
      if (!got.ok) throw new Error(got.data.error || 'Server error ' + got.status);

      if (!cloud.verified) {
        if (!isRealList(got.data.data)) {
          cloud = {}; writeJSON(CLOUD_KEY, cloud);
          toast('🔒 Code galat tha — sahi code daalo'); render(); return;
        }
        cloud.verified = true; writeJSON(CLOUD_KEY, cloud);
      }
      const remote = got.data.data
        ? { ideas: (got.data.data.ideas || []).map(normalizeIdea), todos: (got.data.data.todos || []).map(normalizeTodo), deleted: got.data.data.deleted || {} }
        : { ideas: [], todos: [], deleted: {} };
      const merged = mergeData({ ideas: state.ideas, todos: state.todos, deleted: state.deleted }, remote);

      if (!got.data.data || got.data.data.space !== 'K' || fingerprint(merged) !== fingerprint(remote)) {
        const saved = await cloudRequest('PUT', { data: { ...merged, space: 'K', savedAt: Date.now() }, etag: got.data.etag });
        if (saved.status === 409) continue; // someone else saved just now → download again
        if (!saved.ok) throw new Error(saved.data.error || 'Server error ' + saved.status);
      }

      // Apply to this device (merge again in case you edited while we waited).
      const current = { ideas: state.ideas, todos: state.todos, deleted: state.deleted };
      const latest = mergeData(current, merged);
      if (fingerprint(latest) !== fingerprint(current)) {
        state.ideas = latest.ideas;
        state.todos = latest.todos;
        state.deleted = latest.deleted;
        saveState(true);
        refreshAfterSync();
      }
      cloud.lastSync = Date.now();
      writeJSON(CLOUD_KEY, cloud);
      setSyncStatus('ok');
      return;
    }
    throw new Error('Busy, will retry');
  } catch (err) {
    console.error('Sync failed', err);
    setSyncStatus('error', err.message === 'Failed to fetch' ? 'No internet connection' : err.message);
  } finally {
    syncState.running = false;
    if (syncState.again) { syncState.again = false; scheduleSync(); }
  }
}

// The real shared list always has Kuldeep's ideas. A wrong code opens an empty (or someone-else) list.
const isRealList = data => !!data && (data.space === 'K' || (data.ideas || []).some(i => i.owner && i.owner.name === 'K'));

// Turn on sync with a password (same password on every device).
async function connectWithPassword(password) {
  if (String(password || '').trim().length < 6) { toast('Password kam se kam 6 letters ka rakho'); return false; }
  setSyncStatus('syncing');
  cloud = { code: await passwordToCode(password) };
  const check = await cloudRequest('GET').catch(() => null);
  if (!check || !check.ok) { cloud = {}; toast('❌ Internet nahi hai, phir try karo'); return false; }
  if (!isRealList(check.data.data)) { cloud = {}; toast('❌ Galat code — Kuldeep se sahi code pucho'); return false; }
  cloud.verified = true;
  writeJSON(CLOUD_KEY, cloud);
  ui.person = 'all'; // show everyone's ideas after joining
  try { localStorage.setItem(PERSON_KEY, 'all'); } catch { /* ignore */ }
  await syncNow();
  if (syncState.status === 'ok') { toast('✅ Code sahi! Sab ideas aa gaye'); return true; }
  toast('❌ ' + syncState.message);
  cloud = {};
  writeJSON(CLOUD_KEY, cloud);
  setSyncStatus('off');
  return false;
}

async function savePop(form) {

const PAGE_ICONS = '💰 💵 💸 🤑 🪙 💎 📈 📊 🏦 💳 🛒 📦 🎥 📱 💻 🧠 ✍️ 🎨 📸 🎮 🤝 🏠 🚀 🎯 ⭐ 🔥 ✅ 📄 📁 💡'.split(' ');
const BLOCK_PH = { p: "Likho, ya '/' dabao…", h1: 'Heading 1', h2: 'Heading 2', h3: 'Heading 3', bullet: 'List', num: 'List', todo: 'To-do', quote: 'Quote', callout: 'Kuch important…' };
const LIST_TYPES = ['bullet', 'num', 'todo'];
// Plain-text editing (no pasted fonts/colours). Older browsers fall back to normal editing.
const CE = (() => { try { const d = document.createElement('div'); d.contentEditable = 'plaintext-only'; return d.contentEditable === 'plaintext-only' ? 'plaintext-only' : 'true'; } catch { return 'true'; } })();

function normalizePage(raw = {}) {
  const now = Date.now();
  return {
    id: raw.id || uid(),
    parentId: raw.parentId || null,
    icon: String(raw.icon || '📄').slice(0, 8),
    title: String(raw.title || ''),
    order: Number.isFinite(raw.order) ? raw.order : null, // your own rank among sibling pages (0 = top focus)
    blocks: (Array.isArray(raw.blocks) ? raw.blocks : []).map(b => {
      const blk = {
        id: b.id || uid(),
        type: BLOCK_TYPES.includes(b.type) ? b.type : 'p',
        text: String(b.text || ''),
        checked: !!b.checked,
      };
      if (blk.type === 'image') blk.src = typeof b.src === 'string' && b.src.startsWith('data:image/') ? b.src : '';
      return blk;
    }).filter(b => b.type !== 'image' || b.src),
    by: normPerson(raw.by),
    createdAt: Number(raw.createdAt) || now,
    updatedAt: Number(raw.updatedAt) || now,
  };
}
const newBlock = (type = 'p', text = '') => ({ id: uid(), type, text, checked: false });

function loadEarn() {
  const d = readJSON(EARN_KEY);
  return {
    pages: (Array.isArray(d.pages) ? d.pages : []).map(normalizePage),
    deleted: d.deleted && typeof d.deleted === 'object' ? d.deleted : {},
  };
}

let earnCloud = readJSON(EARN_CLOUD_KEY); // { code, lastSync } — only on devices where you unlocked it

let earnSaveTimer = null;

function saveEarn(fromSync = false) {
  clearTimeout(earnSaveTimer);
  earnSaveTimer = null;
  if (!earnCloud.code) return; // locked → never keep private pages on this device
  writeJSON(EARN_KEY, earn);

// While typing: mark the page changed now, save a moment later.
function touchPage(page) {
  page.updatedAt = Date.now();
  clearTimeout(earnSaveTimer);
  earnSaveTimer = setTimeout(() => saveEarn(), 400);

function flushEarn() { if (earnSaveTimer) saveEarn(); }

const findPage = id => earn.pages.find(p => p.id === id);
// Your own order (set by dragging ⠿ above / below another page) comes first; unranked pages follow.
const byRank = fallback => (a, b) => {
  const ra = a.order ?? Infinity, rb = b.order ?? Infinity;
  return ra !== rb ? ra - rb : fallback(a, b);
};
const childPages = id => earn.pages.filter(p => p.parentId === id).sort(byRank((a, b) => a.createdAt - b.createdAt));
const isTopPage = p => !p.parentId || !findPage(p.parentId);
const topEarnPages = () => earn.pages.filter(isTopPage).sort(byRank((a, b) => b.updatedAt - a.updatedAt));
const siblingPages = parentId => (parentId && findPage(parentId) ? childPages(parentId) : topEarnPages());
// "#1" = most focus. Shown on cards, sub-page rows and the sidebar.
const rankOf = p => siblingPages(p.parentId && findPage(p.parentId) ? p.parentId : null).indexOf(p) + 1;
const rankBadge = p => `<span class="rank-badge" title="Focus rank (#1 = sabse zyada focus) — ⠿ pakad ke kisi page ke upar / neeche chhodo">#${rankOf(p)}</span>`;

// Put a page just before / after another one (same folder as that page), then number the whole folder.
function reorderPage(pageId, targetId, where) {
  const page = findPage(pageId), target = findPage(targetId);
  if (!page || !target || page === target) return false;
  const parentId = target.parentId && findPage(target.parentId) ? target.parentId : null;
  if (parentId && (parentId === pageId || pageDescendants(pageId).some(p => p.id === parentId))) {
    toast('❌ Page ko uske apne andar nahi daal sakte'); return false;
  }
  const before = earn.pages.map(p => ({ p, order: p.order, parentId: p.parentId, updatedAt: p.updatedAt }));
  const list = siblingPages(parentId).filter(p => p !== page);
  list.splice(list.indexOf(target) + (where === 'after' ? 1 : 0), 0, page);
  const now = Date.now();
  page.parentId = parentId;
  list.forEach((p, i) => { if (p.order !== i || p === page) { p.order = i; p.updatedAt = now; } });
  saveEarn(); render();
  toast(`🏆 "${page.title || 'Untitled'}" ab #${list.indexOf(page) + 1} pe hai`, () => {
    const t2 = Date.now();
    before.forEach(b => { if (b.p.order !== b.order || b.p.parentId !== b.parentId) Object.assign(b.p, { order: b.order, parentId: b.parentId, updatedAt: t2 }); });
    saveEarn(); render();
  });
  return true;
}
function pageDescendants(id) {
  const out = [];
  const walk = pid => childPages(pid).forEach(c => { if (!out.includes(c)) { out.push(c); walk(c.id); } });
  walk(id);
  return out;
}
function pageAncestors(page) {
  const out = [];
  for (let p = findPage(page.parentId); p && out.length < 20; p = findPage(p.parentId)) out.unshift(p);
  return out;
}

/* ----- Earning sync (same server, different password → different private file) ----- */
function mergeEarn(a, b) {
  const deleted = { ...a.deleted };
  Object.entries(b.deleted || {}).forEach(([id, t]) => { deleted[id] = Math.max(deleted[id] || 0, t); });
  Object.keys(deleted).forEach(id => { if (Date.now() - deleted[id] > 90 * DAY) delete deleted[id]; });
  const byId = new Map();
  [...a.pages, ...b.pages].forEach(p => {
    const cur = byId.get(p.id);
    if (!cur || p.updatedAt > cur.updatedAt) byId.set(p.id, p);
  });
  return { pages: [...byId.values()].filter(p => !(deleted[p.id] && deleted[p.id] >= p.updatedAt)), deleted };
}
const earnPrint = d => JSON.stringify([
  [...d.pages].sort((x, y) => (x.id < y.id ? -1 : 1)),
  Object.keys(d.deleted).sort().map(k => [k, d.deleted[k]]),
]);
const earnFromCloud = d => (d ? { pages: (d.pages || []).map(normalizePage), deleted: d.deleted || {} } : { pages: [], deleted: {} });

function scheduleEarnSync() {
  if (!earnCloud.code) return;
  clearTimeout(earnSync.timer);
  earnSync.timer = setTimeout(earnSyncNow, 1200);
}

async function earnSyncNow() {
  if (!earnCloud.code) return;
  if (earnSync.running) { earnSync.again = true; return; }
  if (!navigator.onLine) { earnSync.error = 'offline'; return; }
  earnSync.running = true;
  const code = earnCloud.code;
  try {
    for (let attempt = 0; attempt < 4; attempt++) {
      const got = await cloudRequest('GET', null, code);
      if (!got.ok) throw new Error(got.data.error || 'Server error ' + got.status);
      if (got.data.data && got.data.data.moved) { if (earnCloud.code === code) earnMovedAway(); return; }
      const remote = earnFromCloud(got.data.data);
      const merged = mergeEarn(earn, remote);
      if (!got.data.data || earnPrint(merged) !== earnPrint(remote)) {
        const saved = await cloudRequest('PUT', { data: { kind: 'earning', ideas: [], ...merged, savedAt: Date.now() }, etag: got.data.etag }, code);
        if (saved.status === 409) continue;
        if (!saved.ok) throw new Error(saved.data.error || 'Server error ' + saved.status);
      }
      if (earnCloud.code !== code) return; // locked while syncing
      const latest = mergeEarn(earn, merged);
      if (earnPrint(latest) !== earnPrint(earn)) {
        earn = latest;
        saveEarn(true);
        refreshAfterSync();
      }
      earnCloud.lastSync = Date.now();
      writeJSON(EARN_CLOUD_KEY, earnCloud);
      earnSync.error = '';
      return;
    }
    throw new Error('Busy, will retry');
  } catch (err) {
    console.error('Earning sync failed', err);
    earnSync.error = err.message || 'error';
  } finally {
    earnSync.running = false;
    if (earnSync.again) { earnSync.again = false; scheduleEarnSync(); }
  }
}

      const legacyCode = await legacyEarnKey(pw);
      const old = await cloudRequest('GET', null, legacyCode).catch(() => null);
      const od = old && old.ok && old.data.data;
      if (od && od.kind === 'earning' && !od.moved && (od.pages || []).length) {
        await moveEarnData(legacyCode, code, earnFromCloud(od));

    }
    if (data && again) { toast('❌ Is ID + password se Earning pehle se hai — "Kholo" se kholo, ya doosra ID chuno'); return ready('Set karo'); }
    if (data && data.kind !== 'earning') { toast('❌ Ye password nahi chalega — doosra rakho'); return ready('Unlock'); }
    if (!data) {
      // Nothing saved with this password yet → make sure it's not a typo before creating a new space.

        form.insertAdjacentHTML('beforeend', `
          <div class="stack" style="gap:8px">

        form.elements.password2.focus();

      }
      if (again.value.trim() !== pw) { toast('❌ Dono password alag hain'); return ready('Banao'); }
    }
    earnCloud = { code, id: eid };
    writeJSON(EARN_CLOUD_KEY, earnCloud);
    googleSetEarn();
    earn = mergeEarn({ pages: [], deleted: {} }, earnFromCloud(data));
    saveEarn(true);
    ui.earnNew = false;
    toast(data ? '🔓 Earning khul gaya' : '✅ Aapka private Earning ban gaya');
    await earnSyncNow();
    render();
  } catch (err) {
    console.error(err);
    toast('❌ ' + err.message);
    ready('Unlock');
  }
}

// 💡 Turn one idea into an Earning page (everything in it becomes blocks).
function ideaToPage(idea, parentId) {
  const B = newBlock;
  const blocks = [];
  const st = statusOf(idea.status);
  const info = [`${st.emoji || ''} ${st.label || idea.status}`.trim(), idea.priority ? `Priority: ${idea.priority}` : '',
    idea.platforms.length ? idea.platforms.join(', ') : '', `Progress ${progressOf(idea)}%`].filter(Boolean).join(' · ');
  blocks.push(B('callout', info));
  if (idea.desc) blocks.push(B('p', idea.desc));
  if (idea.problem) blocks.push(B('h3', '❓ Problem'), B('p', idea.problem));
  if (idea.target) blocks.push(B('h3', '🎯 Kiske liye'), B('p', idea.target));
  if (idea.steps.length) {
    blocks.push(B('h2', '📍 Steps'));
    idea.steps.forEach(x => blocks.push({ ...B('todo', x.title), checked: !!x.done }));
  }
  if (idea.features.length) {
    blocks.push(B('h2', '✨ Features'));
    idea.features.forEach(f => blocks.push({ ...B('todo', f.title + (f.desc ? ' — ' + f.desc : '') + (f.mvp ? '' : ' (nice to have)')), checked: f.status === 'done' }));
  }
  if (idea.monetization.length || idea.price) {
    blocks.push(B('h2', '💵 Paisa kaise'));
    if (idea.monetization.length) blocks.push(B('p', idea.monetization.join(', ')));
    if (idea.price) blocks.push(B('p', 'Price: ' + idea.price));
  }
  if (idea.notes) blocks.push(B('h2', '📝 Notes'), ...idea.notes.split('\n').filter(l => l.trim()).map(l => B('p', l)));
  if (idea.links.length) {
    blocks.push(B('h2', '🔗 Links'));
    idea.links.forEach(l => blocks.push(B('bullet', (l.label ? l.label + ': ' : '') + l.url)));
  }
  if (idea.tags.length) blocks.push(B('p', 'Tags: ' + idea.tags.map(t => '#' + t).join(' ')));
  if (idea.log.length) {
    blocks.push(B('h2', '📓 Journal'));
    [...idea.log].sort((a, b) => b.createdAt - a.createdAt).forEach(l => blocks.push(B('bullet', `${l.date}: ${l.text}`)));
  }
  return normalizePage({
    id: 'idea-' + idea.id, parentId, icon: folderOf(idea.folder).emoji, title: idea.name, blocks,
    by: myRef(), createdAt: idea.createdAt, updatedAt: Date.now(),
  });
}

// Move ALL ideas into Earning: one folder page per Ideas folder, each idea a page inside it.
async function moveIdeasToEarn(btn) {
  const ideas = [...state.ideas];
  if (!ideas.length) { toast('Koi idea nahi hai'); return; }
  if (!earnCloud.code) { toast('Pehle Earning unlock karo'); return; }
  if (!confirm(`Saare ${ideas.length} ideas 💰 Earning me shift karein?\n\nHar folder (💡 App, 🥽 VR…) Earning me ek folder ban jayega aur ideas uske andar.\nIdeas list khali ho jayegi. Pehle ek backup file download hogi.`)) return;
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Shift ho raha hai…'; }
  try {
    exportJSON(); // backup file first
    const now = Date.now();
    FOLDERS.forEach(f => {
      const inF = ideas.filter(i => i.folder === f.key);
      if (!inF.length) return;
      const fid = 'ideas-folder-' + f.key;
      if (!findPage(fid)) {
        delete earn.deleted[fid];
        earn.pages.push(normalizePage({ id: fid, icon: f.emoji, title: f.label, blocks: [newBlock('p', `${f.label} — Ideas section se shift kiye gaye.`)], by: myRef(), createdAt: now, updatedAt: now }));
      }
      inF.forEach(i => {
        const page = ideaToPage(i, fid);
        delete earn.deleted[page.id];
        earn.pages = earn.pages.filter(x => x.id !== page.id);
        earn.pages.push(page);
      });
    });
    saveEarn();
    flushEarn();
    for (let k = 0; k < 40 && earnSync.running; k++) await new Promise(res => setTimeout(res, 250));
    earnSync.error = '';
    await earnSyncNow();
    if (earnSync.error || earnSync.running) { toast('❌ Earning cloud me save nahi hua (internet?) — ideas abhi hataye nahi. Phir try karo.'); if (btn) { btn.disabled = false; btn.textContent = '💡 Phir try karo'; } return; }
    // Saved safely in Earning → now remove them from the Ideas list (on every device).
    const t = Date.now();
    ideas.forEach(i => { state.deleted[i.id] = t; });
    const ids = new Set(ideas.map(i => i.id));
    state.ideas = state.ideas.filter(i => !ids.has(i.id));
    saveState();
    toast(`✅ ${ideas.length} ideas Earning me shift ho gaye`);
    location.hash = '#/earn';
    render();
  } catch (err) {
    console.error(err); toast('❌ ' + err.message);
    if (btn) { btn.disabled = false; btn.textContent = '💡 Phir try karo'; }
  }
}

/* ----- Editor helpers ----- */
const curPage = () => { const r = parseRoute(); return r.page === 'earn' && r.id ? findPage(r.id) : null; };
const textOf = el => (el.tagName === 'TEXTAREA' ? el.value : el.textContent.replace(/ /g, ' '));
const selCollapsed = () => { const s = getSelection(); return !s.rangeCount || s.isCollapsed; };
function autoSize(t) { t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; }
function sizeCodes(root = document) { root.querySelectorAll('.blk-code').forEach(autoSize); }

function caretOffset(el) {
  if (el.tagName === 'TEXTAREA') return el.selectionStart;
  const sel = getSelection();
  if (!sel.rangeCount) return 0;
  const r = sel.getRangeAt(0);
  if (!el.contains(r.startContainer)) return 0;
  const pre = document.createRange();
  pre.selectNodeContents(el);
  pre.setEnd(r.startContainer, r.startOffset);
  return pre.toString().length;
}

// Put the cursor at a character position (-1 = end).
function placeCaret(el, offset = -1) {
  el.focus();
  if (el.tagName === 'TEXTAREA') { const o = offset < 0 ? el.value.length : offset; el.setSelectionRange(o, o); return; }
  const len = el.textContent.length;
  let o = offset < 0 || offset > len ? len : offset;
  const r = document.createRange();
  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
  let node, placed = false;
  while ((node = walker.nextNode())) {
    if (o <= node.length) { r.setStart(node, o); placed = true; break; }
    o -= node.length;
  }
  if (!placed) { r.selectNodeContents(el); r.collapse(false); } else r.collapse(true);
  const s = getSelection();
  s.removeAllRanges();
  s.addRange(r);
}

function redrawBlocks(focusId = null, offset = -1) {
  const page = curPage();
  const box = document.getElementById('blocks');
  if (!page || !box) return;
  box.innerHTML = blocksHTML(page);
  sizeCodes(box);
  if (focusId) focusBlock(focusId, offset);
}
function focusBlock(id, offset = -1) {
  const el = document.querySelector(`#blocks .blk-text[data-id="${id}"]`);
  if (el) placeCaret(el, offset);
}

// Markdown-style shortcuts (used while typing and when pasting / moving notes in).
const MD_RULES = [
  [/^###\s+/, 'h3'], [/^##\s+/, 'h2'], [/^#\s+/, 'h1'],
  [/^[-*•]\s+/, 'bullet'], [/^\d+[.)]\s+/, 'num'],
  [/^\[[xX]\]\s+/, 'done'], [/^\[\s?\]\s+/, 'todo'], [/^>\s+/, 'quote'],
];
function mdLine(line) {
  if (/^\s*(-{3,}|—)\s*$/.test(line)) return { type: 'divider', text: '' };
  for (const [rx, type] of MD_RULES) {
    if (rx.test(line)) return type === 'done' ? { type: 'todo', text: line.replace(rx, ''), checked: true } : { type, text: line.replace(rx, '') };
  }
  return { type: 'p', text: line };
}
const notesToBlocks = text => String(text || '').split(/\r?\n/).filter(l => l.trim()).map(l => ({ ...newBlock(), ...mdLine(l) }));

function blockOf(el) {
  const page = curPage();
  if (!page) return {};
  const i = page.blocks.findIndex(x => x.id === el.dataset.id);
  return { page, i, b: page.blocks[i] };
}

function onTitleInput(el) {
  const page = curPage();
  if (!page) return;
  page.title = textOf(el).replace(/\n/g, ' ');
  touchPage(page);
  const top = document.getElementById('earn-top-title');
  if (top) top.textContent = `${page.icon} ${page.title || 'Untitled'}`;
}

function onBlockInput(el) {
  const { page, b } = blockOf(el);
  if (!b) return;
  const text = textOf(el);
  if (b.type === 'code') { b.text = text; autoSize(el); touchPage(page); return; }
  if (b.type === 'p') {
    if (text === '---') {
      b.type = 'divider'; b.text = '';
      const nb = newBlock();
      page.blocks.splice(page.blocks.indexOf(b) + 1, 0, nb);
      touchPage(page); redrawBlocks(nb.id, 0); return;
    }
    if (text === '```') { b.type = 'code'; b.text = ''; touchPage(page); redrawBlocks(b.id, 0); return; }
    const off = caretOffset(el);
    for (const [rx, type] of MD_RULES) {
      const m = rx.exec(text);
      if (m && type !== 'done' && off === m[0].length) {
        b.type = type; b.text = text.slice(m[0].length);
        touchPage(page); redrawBlocks(b.id, 0); return;
      }
    }
  }
  b.text = text;
  touchPage(page);
  const m = /^\/([^\s/]*)$/.exec(text);
  if (m) showSlash(el, m[1]); else hideSlash();
}

// Enter: split the block at the cursor (lists continue; empty list item → plain text).
function blockEnter(el) {
  const { page, i, b } = blockOf(el);
  if (!b) return;
  hideSlash();
  if (!selCollapsed()) getSelection().deleteFromDocument();
  const text = textOf(el);
  const off = caretOffset(el);
  if (b.type !== 'p' && b.type !== 'code' && !text.trim()) {
    b.type = 'p'; b.checked = false; b.text = '';
    touchPage(page); redrawBlocks(b.id, 0); return;
  }
  const nextType = LIST_TYPES.includes(b.type) ? b.type : 'p';
  if (off === 0 && text) { // Enter at the very start → empty line above
    b.text = text;
    page.blocks.splice(i, 0, newBlock(nextType));
    touchPage(page); redrawBlocks(b.id, 0); return;
  }
  b.text = text.slice(0, off);
  const nb = newBlock(nextType, text.slice(off));
  page.blocks.splice(i + 1, 0, nb);
  touchPage(page); redrawBlocks(nb.id, 0);
}

// Backspace at the very start: un-format, or join with the block above. Returns true if handled.
function blockBackspace(el) {
  const { page, i, b } = blockOf(el);
  if (!b || !selCollapsed() || caretOffset(el) !== 0) return false;
  if (el.tagName === 'TEXTAREA' && el.selectionEnd !== 0) return false;
  const text = textOf(el);
  if (b.type === 'code' && text) return false;
  if (b.type !== 'p') { b.type = 'p'; b.checked = false; touchPage(page); redrawBlocks(b.id, 0); return true; }
  if (i === 0) {
    if (text || page.blocks.length < 2) return false;
    page.blocks.splice(0, 1);
    touchPage(page); redrawBlocks();
    placeCaret(document.getElementById('pg-title'), -1);
    return true;
  }
  const prev = page.blocks[i - 1];
  if (prev.type === 'divider') { page.blocks.splice(i - 1, 1); touchPage(page); redrawBlocks(b.id, 0); return true; }
  if (prev.type === 'image') { // never delete a photo by accident — just drop the empty line under it
    if (!text) { page.blocks.splice(i, 1); touchPage(page); redrawBlocks(); }
    return true;
  }
  if (prev.type === 'code') {
    if (!text) { page.blocks.splice(i, 1); touchPage(page); redrawBlocks(prev.id, -1); } else focusBlock(prev.id, -1);
    return true;
  }
  const len = prev.text.length;
  prev.text += text;
  page.blocks.splice(i, 1);
  touchPage(page); redrawBlocks(prev.id, len);
  return true;
}

// Move to the block above / below (skips divider lines).
function focusNeighbour(el, dir) {
  const { page, i } = blockOf(el);
  if (!page) return false;
  for (let j = i + dir; j >= 0 && j < page.blocks.length; j += dir) {
    if (page.blocks[j].type !== 'divider' && page.blocks[j].type !== 'image') { focusBlock(page.blocks[j].id, dir < 0 ? -1 : 0); return true; }
  }
  if (dir < 0) { placeCaret(document.getElementById('pg-title'), -1); return true; }
  return false;
}

function titleEnter() {
  const page = curPage();
  if (!page) return;
  const first = page.blocks[0];
  if (first && first.type === 'p' && !first.text) { focusBlock(first.id, 0); return; }
  const nb = newBlock();
  page.blocks.unshift(nb);
  touchPage(page); redrawBlocks(nb.id, 0);
}

function insertPlain(text) {
  if (document.execCommand('insertText', false, text)) return;
  const s = getSelection();
  if (!s.rangeCount) return;
  const r = s.getRangeAt(0);
  r.deleteContents();
  const node = document.createTextNode(text);
  r.insertNode(node);
  r.setStartAfter(node); r.collapse(true);
  s.removeAllRanges(); s.addRange(r);
  document.activeElement?.dispatchEvent(new Event('input', { bubbles: true }));
}

// Pasting several lines → one block per line (with # - [] > shortcuts understood).
/* ----- 🖼️ Photos inside Earning pages (shrunk JPEGs, like task photos) ----- */
const earnImageBytes = () => earn.pages.reduce((n, p) => n + p.blocks.reduce((m, b) => m + (b.src ? b.src.length : 0), 0), 0);
// Adds photos as blocks right after block `afterId` (an empty text line is replaced by the first photo).
async function addEarnImages(afterId, files) {
  const page = curPage();
  if (!page) return;
  const list = [...files].filter(f => f.type.startsWith('image/'));
  if (!list.length) return;
  let i = page.blocks.findIndex(x => x.id === afterId);
  const added = [];
  for (const f of list) {
    if (earnImageBytes() > 2.6 * 1024 * 1024) { toast('⚠️ Earning me photos ki jagah bhar gayi — kuch purani photos hatao'); break; }
    try { added.push({ ...newBlock('image'), src: await shrinkImage(f) }); } catch { toast('Ye photo nahi khuli'); }
  }
  if (!added.length) return;
  const cur = page.blocks[i];
  if (cur && cur.type === 'p' && !cur.text.trim()) page.blocks.splice(i, 1, ...added);
  else if (i < 0) page.blocks.push(...added);
  else page.blocks.splice(i + 1, 0, ...added);
  i = page.blocks.indexOf(added[added.length - 1]);
  const next = newBlock();
  page.blocks.splice(i + 1, 0, next); // a line under the photo to keep writing
  touchPage(page); saveEarn(); redrawBlocks(next.id, 0);
  toast(`🖼️ ${added.length} photo add ho gayi`);
}
function pickEarnImages(afterId) {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*'; input.multiple = true;
  input.onchange = () => { if (input.files.length) addEarnImages(afterId, input.files); };
  input.click();
}
// Drop photos anywhere on an Earning page.
document.addEventListener('dragover', e => { if (curPage() && [...(e.dataTransfer?.items || [])].some(i => i.kind === 'file')) e.preventDefault(); });
document.addEventListener('drop', e => {
  const page = curPage();
  const files = [...(e.dataTransfer?.files || [])].filter(f => f.type.startsWith('image/'));
  if (!page || !files.length || !e.target.closest?.('.notion')) return;
  e.preventDefault();
  const blk = e.target.closest('.blk[data-id]');
  addEarnImages(blk ? blk.dataset.id : (page.blocks[page.blocks.length - 1]?.id || ''), files);
});

function onBlockPaste(e, el) {
  const pics = [...(e.clipboardData?.files || [])].filter(f => f.type.startsWith('image/'));
  if (pics.length && el.id !== 'pg-title') { e.preventDefault(); addEarnImages(el.dataset.id, pics); return; }
  const text = e.clipboardData?.getData('text/plain');
  if (text == null) return;
  e.preventDefault();
  if (el.id === 'pg-title') { insertPlain(text.replace(/\s*\r?\n+\s*/g, ' ')); return; }
  const lines = text.replace(/\r/g, '').split('\n');
  if (lines.filter(l => l.trim()).length < 2) { insertPlain(text.replace(/\n+/g, ' ')); return; }
  const { page, i, b } = blockOf(el);
  if (!b) return;
  if (!selCollapsed()) getSelection().deleteFromDocument();
  const cur = textOf(el), off = caretOffset(el);
  const after = cur.slice(off);
  const parsed = notesToBlocks(text);
  let added = parsed.slice(1);
  if (!cur.trim()) Object.assign(b, parsed[0], { id: b.id }); // empty block → it becomes the first pasted line
  else if (parsed[0].type === 'p') b.text = cur.slice(0, off) + parsed[0].text; // plain first line joins this line
  else { b.text = cur.slice(0, off); added = parsed; } // heading / list → its own block
  page.blocks.splice(i + 1, 0, ...added);
  const last = added.length ? added[added.length - 1] : b;
  const caret = last.text.length;
  last.text += after;
  touchPage(page); redrawBlocks(last.id, caret);
}

/* ----- "/" menu ----- */
let slash = null; // { blockId, items, sel }
function showSlash(el, q) {
  const query = q.toLowerCase();
  const items = BLOCK_MENU.filter(([type, , label, words]) => !query || `${type} ${label} ${words}`.toLowerCase().includes(query));
  if (!items.length) { hideSlash(); return; }
  let box = document.getElementById('slash');
  if (!box) {
    box = document.createElement('div');
    box.id = 'slash';
    box.className = 'slash';
    box.addEventListener('mousedown', e => e.preventDefault()); // keep the cursor in the block
    document.body.appendChild(box);
  }
  slash = { blockId: el.dataset.id, items, sel: 0 };
  box.innerHTML = '<div class="slash-head">Block chuno</div>' + items.map(([type, ico, label], k) =>
    `<button type="button" class="${k === 0 ? 'sel' : ''}" data-action="earn-slash" data-value="${type}"><span class="ico">${ico}</span>${label}</button>`).join('');
  const r = el.getBoundingClientRect();
  const viewH = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  const h = box.offsetHeight;
  const top = r.bottom + 4 + h > viewH && r.top - 4 - h > 0 ? r.top - 4 - h : r.bottom + 4;
  box.style.top = top + window.scrollY + 'px';
  box.style.left = Math.max(8, Math.min(r.left, window.innerWidth - box.offsetWidth - 8)) + window.scrollX + 'px';
}
function hideSlash() { slash = null; document.getElementById('slash')?.remove(); }
function moveSlash(d) {
  const btns = document.querySelectorAll('#slash button');
  slash.sel = (slash.sel + d + btns.length) % btns.length;
  btns.forEach((b, k) => b.classList.toggle('sel', k === slash.sel));
  btns[slash.sel].scrollIntoView({ block: 'nearest' });
}

// Change a block's kind (from "/" or the ⋮⋮ menu).
function applyBlockType(id, type, fromSlash) {
  const page = curPage();
  if (!page) return;
  const i = page.blocks.findIndex(x => x.id === id);
  if (i < 0) return;
  const b = page.blocks[i];
  hideSlash();
  if (fromSlash) b.text = b.text.replace(/^\/[^\s/]*/, '');
  if (type === 'page') {
    if (!b.text.trim()) page.blocks.splice(i, 1);
    touchPage(page);
    newEarnPage(page.id);
    return;
  }
  if (type === 'image') {
    if (b.text.trim()) touchPage(page);
    pickEarnImages(b.id);
    return;
  }
  if (type === 'divider') {
    const nb = newBlock();
    if (b.text.trim()) page.blocks.splice(i + 1, 0, newBlock('divider'), nb);
    else { Object.assign(b, { type: 'divider', text: '', checked: false }); page.blocks.splice(i + 1, 0, nb); }
    touchPage(page); redrawBlocks(nb.id, 0); return;
  }
  b.type = type;
  if (type !== 'todo') b.checked = false;
  touchPage(page); redrawBlocks(b.id, -1);
}

/* ----- Keyboard, typing and paste inside the editor ----- */
document.addEventListener('keydown', e => {
  const el = e.target;
  if (el.id === 'pg-title') {
    if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); titleEnter(); }
    else if (e.key === 'ArrowDown') { const p = curPage(); if (p && p.blocks[0]) { e.preventDefault(); focusBlock(p.blocks[0].id, 0); } }
    return;
  }
  if (!el.classList || !el.classList.contains('blk-text')) return;
  if (slash && slash.blockId === el.dataset.id) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); moveSlash(e.key === 'ArrowDown' ? 1 : -1); return; }
    if (e.key === 'Enter') { e.preventDefault(); applyBlockType(slash.blockId, slash.items[slash.sel][0], true); return; }
    if (e.key === 'Escape') { hideSlash(); return; }
  }
  if (e.isComposing) return;
  const isCode = el.tagName === 'TEXTAREA';
  if (e.key === 'Enter' && !e.shiftKey && !isCode) { e.preventDefault(); blockEnter(el); return; }
  if (e.key === 'Enter' && isCode && (e.ctrlKey || e.metaKey)) { e.preventDefault(); blockEnter(el); return; }
  if (e.key === 'Enter' && e.shiftKey && !isCode) { e.preventDefault(); insertPlain('\n'); return; }
  if (e.key === 'Backspace' && blockBackspace(el)) { e.preventDefault(); return; }
  if (e.key === 'ArrowUp' && selCollapsed() && caretOffset(el) === 0 && focusNeighbour(el, -1)) { e.preventDefault(); return; }
  if (e.key === 'ArrowDown' && selCollapsed() && caretOffset(el) === textOf(el).length && focusNeighbour(el, 1)) e.preventDefault();
});

// Phone keyboards often send Enter / Backspace only as "beforeinput" — handle them here too.
document.addEventListener('beforeinput', e => {
  const el = e.target;
  if (el.id === 'pg-title' && (e.inputType === 'insertParagraph' || e.inputType === 'insertLineBreak')) { e.preventDefault(); titleEnter(); return; }
  if (!el.classList || !el.classList.contains('blk-text')) return;
  const isCode = el.tagName === 'TEXTAREA';
  if (e.inputType === 'insertParagraph' && !isCode) {
    e.preventDefault();
    if (slash && slash.blockId === el.dataset.id) applyBlockType(slash.blockId, slash.items[slash.sel][0], true);
    else blockEnter(el);
  } else if (e.inputType === 'deleteContentBackward' && blockBackspace(el)) {
    e.preventDefault();
  }
});

// Add lines to the end of a page as ☐ features (an empty last line gets filled first).
function addFeatureBlocks(page, blocks) {
  while (page.blocks.length && !page.blocks[page.blocks.length - 1].text.trim() && page.blocks[page.blocks.length - 1].type !== 'divider') page.blocks.pop();
  page.blocks.push(...blocks);

function moveTodoToEarn(id, pageId) {
  const t = state.todos.find(x => x.id === id);
  if (!t || !earnCloud.code) return;
  const depthOf = x => { let d = 0, p = x; while (p.parentId && p.id !== t.id) { p = state.todos.find(y => y.id === p.parentId); if (!p) break; d++; } return d; };
  const subs = descendantsOf(t.id);
  const subBlocks = subs.map(x => ({ ...newBlock('todo', '  '.repeat(Math.max(0, depthOf(x) - 1)) + '↳ ' + x.text), checked: !!x.done }));
  const target = pageId && findPage(pageId);
  let msg;
  if (target) {
    const lines = t.text.split(/\r?\n/).filter(l => l.trim());
    const main = lines.map((l, i) => ({ ...newBlock('todo', l.trim()), checked: i === 0 && !!t.done }));
    addFeatureBlocks(target, [...main, ...subBlocks]);
    msg = `✅ ${target.icon} ${target.title || 'Untitled'} me feature ban gaya`;
  } else {
    const { title, rest } = splitNote(t.text);
    earn.pages.push(normalizePage({ title, icon: '💰', blocks: [...notesToBlocks(rest), ...subBlocks], by: t.by || myRef() }));
    msg = '🔒 Earning me naya page ban gaya';
  }
  saveEarn();
  const now = Date.now();
  [t, ...subs].forEach(x => { state.deleted[x.id] = now; });
  const gone = new Set([t.id, ...subs.map(x => x.id)]);
  state.todos = state.todos.filter(x => !gone.has(x.id));
  saveState(); render();
  toast(msg);
}

/* =====================================================================
   SECTION 11B2: 🔑 LOGIN WITH ID + PASSWORD
   Each person has their own ID + password (instead of typing the shared code).
   The password never leaves the device: we send PBKDF2(password, id) and the
   server stores only a scrypt hash of that. A good login gives back the space code.
   ===================================================================== */
const ACCOUNT_API = '/api/account';
const cleanId = id => String(id || '').trim().toLowerCase();
const loginKey = (id, password) => passwordToCode(password, 'app-ideas-login-v1:' + cleanId(id));

async function accountRequest(body) {
  const res = await fetch(ACCOUNT_API, { method: 'POST', cache: 'no-store', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  const data = await res.json().catch(() => ({}));
  return { ok: res.ok, status: res.status, data };
}

// Disable a form's submit button while waiting; returns a function that turns it back on.
function busy(form, label = '…') {
  const btn = form.querySelector('button[type="submit"]');
  const old = btn.textContent;
  btn.disabled = true; btn.textContent = label;
  return () => { btn.disabled = false; btn.textContent = old; };
}

async function loginWithId(form) {
  const id = cleanId(form.elements.uid.value);
  const pw = form.elements.password.value;
  if (!id || !pw) return;
  const done = busy(form);
  try {
    const r = await accountRequest({ action: 'login', id, key: await loginKey(id, pw) }).catch(() => null);
    if (!r) { toast('❌ Internet nahi hai, phir try karo'); return done(); }
    if (!r.ok) { toast('❌ ' + (r.data.error || 'Login nahi hua')); return done(); }
    cloud = { code: r.data.space, verified: true, account: id };
    writeJSON(CLOUD_KEY, cloud);
    ui.person = 'all';
    try { localStorage.setItem(PERSON_KEY, 'all'); } catch { /* ignore */ }
    ui.codeLogin = false;
    await syncNow();
    toast(`✅ Welcome ${fullName(me.name || '')}!`);
    if (parseRoute().page === 'join') location.hash = '#/'; else render();
  } catch (err) {
    console.error(err); toast('❌ ' + err.message); done();
  }
}

/* ----- 🔐 Google login: lose the device, sign in with Google, get everything back -----
   Dashboard → "Google se jodo" links your Google account to this list (and to Earning, if unlocked).
   Login screen → "Sign in with Google" gets the list code (+ Earning) back from the server. */
const GOOGLE_CLIENT_ID = ''; // same as api/_google.js
let gsiLoading = null;
function loadGsi() {
  if (window.google?.accounts?.id) return Promise.resolve();
  return gsiLoading || (gsiLoading = new Promise((ok, fail) => {
    const sc = document.createElement('script');
    sc.src = 'https://accounts.google.com/gsi/client';
    sc.async = true;
    sc.onload = () => ok();
    sc.onerror = () => { gsiLoading = null; fail(new Error('Google load nahi hua (internet?)')); };
    document.head.appendChild(sc);
  }));
}
async function mountGoogleButtons() {
  const slots = [...document.querySelectorAll('.g-btn:not([data-done])')];
  if (!GOOGLE_CLIENT_ID || !slots.length) return;
  slots.forEach(el => { el.dataset.done = '1'; });
  try { await loadGsi(); } catch (err) { slots.forEach(el => { el.innerHTML = `<p class="muted small">${esc(err.message)}</p>`; }); return; }
  google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: onGoogleCredential, auto_select: false, ux_mode: 'popup' });
  slots.forEach(el => google.accounts.id.renderButton(el, {
    theme: 'outline', size: 'large', shape: 'pill', text: el.dataset.gtext || 'continue_with',
    width: Math.min(320, el.parentElement.clientWidth || 320),
  }));
}
const earnLink = () => (earnCloud.code && earnCloud.id ? { code: earnCloud.code, id: earnCloud.id } : null);
async function onGoogleCredential(resp) {
  const credential = resp && resp.credential;
  if (!credential) return;
  try {
    if (!cloud.code) {
      // Login on a new device
      toast('⏳ Google se login ho raha hai…');
      const r = await accountRequest({ action: 'google-login', credential }).catch(() => null);
      if (!r) return toast('❌ Internet nahi hai, phir try karo');
      if (!r.ok) return toast('❌ ' + (r.data.error || 'Login nahi hua'));
      cloud = { code: r.data.space, verified: true, account: r.data.email, google: r.data.email, googleEarn: !!r.data.earn };
      writeJSON(CLOUD_KEY, cloud);
      if (r.data.earn && canEarn()) { earnCloud = { code: r.data.earn.code, id: r.data.earn.id }; writeJSON(EARN_CLOUD_KEY, earnCloud); }
      ui.person = 'all';
      try { localStorage.setItem(PERSON_KEY, 'all'); } catch { /* ignore */ }
      await syncNow();
      if (earnCloud.code) await earnSyncNow();
      toast(`✅ Welcome back! Saara data aa gaya${earnCloud.code ? ' (💰 Earning bhi)' : ''}`);
      if (parseRoute().page === 'join') location.hash = '#/'; else render();
    } else {
      // Link this list (+ Earning) to the Google account
      const r = await accountRequest({ action: 'google-link', credential, space: cloud.code, earn: earnLink() }).catch(() => null);
      if (!r) return toast('❌ Internet nahi hai, phir try karo');
      if (!r.ok) return toast('❌ ' + (r.data.error || 'Nahi juda'));
      cloud.google = r.data.email;
      cloud.googleEarn = !!r.data.earn;
      writeJSON(CLOUD_KEY, cloud);
      toast(`✅ ${r.data.email} se jud gaya${r.data.earn ? ' (💰 Earning bhi)' : ''}`);
      render();
    }
  } catch (err) { console.error(err); toast('❌ ' + err.message); }
}
// Earning got unlocked / its ID+password changed → keep the Google link pointing at it.
async function googleSetEarn() {
  if (!cloud.google || !cloud.code) return;
  const r = await accountRequest({ action: 'google-set-earn', space: cloud.code, earn: earnLink() }).catch(() => null);
  if (r && r.ok && r.data.linked) { cloud.googleEarn = !!earnLink(); writeJSON(CLOUD_KEY, cloud); }
}

const earnKeyFor = (id, pw) => passwordToCode(pw, EARN_SALT + ':' + cleanId(id));
const legacyEarnKey = pw => passwordToCode(pw, EARN_SALT);
const MOVED_EARN = () => ({ kind: 'earning', ideas: [], pages: [], deleted: {}, moved: true, savedAt: Date.now() });

// Copy the Earning data to a new code, then empty the old file (marked "moved")
// so devices still using the old login lock themselves.
async function moveEarnData(fromCode, toCode, data) {
  const target = await cloudRequest('GET', null, toCode);
  if (!target.ok) throw new Error(target.data.error || 'Server error');
  if (target.data.data && (target.data.data.pages || []).length) throw new Error('Ye ID + password pehle se kisi aur Earning ka hai');
  const put = await cloudRequest('PUT', { data: { kind: 'earning', ideas: [], pages: data.pages, deleted: data.deleted || {}, savedAt: Date.now() }, etag: target.data.etag }, toCode);
  if (!put.ok) throw new Error(put.data.error || 'Save nahi hua');
  for (let i = 0; i < 4; i++) {
    const old = await cloudRequest('GET', null, fromCode);
    if (!old.ok || !old.data.data) return;
    const wiped = await cloudRequest('PUT', { data: MOVED_EARN(), etag: old.data.etag }, fromCode);
    if (wiped.status !== 409) return;
  }
}

// Whole-app search: app sections, tasks in every list, Earning pages (when unlocked). Ideas are added by drawerList.
const plain = t => String(t || '').replace(/<[^>]*>/g, '').replace(/&nbsp;/g, ' ');
function searchEverything(q) {
  const words = q.toLowerCase().split(/\s+/).filter(Boolean);
  const hit = text => { const t = text.toLowerCase(); return words.every(w => t.includes(w)); };
  const item = (href, name, meta) => `<a class="drawer-item" href="${href}"><span class="name">${name}</span><span class="meta">${meta}</span></a>`;

    .filter(([, n]) => hit(n));
  if (sections.length) out += `<h3>📂 Sections</h3>` + sections.map(([h, n]) => item(h, hl(n, q), '')).join('');
  // Tasks (every list)
  const tasks = state.todos.filter(t => hit(t.text)).sort((a, b) => (a.done - b.done) || (b.updatedAt - a.updatedAt));
  out += `<h3>✅ Tasks (${tasks.length})</h3>` + (tasks.length
    ? tasks.slice(0, 40).map(t => item(todoLink(t), (t.done ? '✓ ' : '') + hl(t.text, q), esc(todoPlace(t).slice(0, 28)))).join('')
    : '<p class="muted small" style="margin:4px 8px">Koi task nahi mila.</p>');
  // Earning pages: title or anything written inside
  if (canEarn()) {
    if (!earnCloud.code) out += `<h3>💰 Earning</h3><p class="muted small" style="margin:4px 8px">🔒 Earning unlock karo to uske pages bhi search honge.</p>`;
    else {
      const pages = earn.pages.map(p => {
        const title = p.title || 'Untitled';
        if (hit(title)) return { p, score: 2, snip: '' };
        const b = p.blocks.find(b => hit(plain(b.text)));
        return b ? { p, score: 1, snip: plain(b.text).trim().slice(0, 60) } : null;
      }).filter(Boolean).sort((a, b) => (b.score - a.score) || (b.p.updatedAt - a.p.updatedAt));
      out += `<h3>💰 Earning pages (${pages.length})</h3>` + (pages.length

        : '<p class="muted small" style="margin:4px 8px">Koi page nahi mila.</p>');
    }
  }
  return out;
}

const isDrawerOpen = () => document.getElementById('drawer').classList.contains('open');

// Swipe right starting in the left 40% of the screen → open.
// (Not just the very edge: on Android the edge swipe is the phone's own Back gesture.)
// When open: swipe left anywhere → close.
let swipe = null;
document.addEventListener('touchstart', e => {
  const t = e.touches[0];
  if (e.touches.length !== 1 || drag) { swipe = null; return; }
  // skip things that scroll sideways or take typing
  if (!isDrawerOpen() && e.target.closest('.chips-row, input, textarea, select, dialog, [contenteditable], .slash')) { swipe = null; return; }
  if (isDrawerOpen() || t.clientX < window.innerWidth * 0.4) swipe = { x: t.clientX, y: t.clientY, done: false };
  else swipe = null;
}, { passive: true });

document.addEventListener('touchmove', e => {
  if (!swipe || swipe.done) return;
  const t = e.touches[0];
  const dx = t.clientX - swipe.x;
  const dy = Math.abs(t.clientY - swipe.y);
  if (dy * 1.5 > Math.abs(dx)) return; // scrolling up/down, not a sideways swipe
  if (!isDrawerOpen() && dx > 60) { swipe.done = true; openDrawer(); }
  else if (isDrawerOpen() && dx < -50) { swipe.done = true; closeDrawer(); }
}, { passive: true });

document.addEventListener('touchend', () => { swipe = null; });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeDrawer();
  // PC: Ctrl+K (or "/" when not typing) → quick search from any page
  const typing = /INPUT|TEXTAREA|SELECT/.test(e.target.tagName) || e.target.isContentEditable;
  if (cloud.code && ((e.key === 'k' && (e.ctrlKey || e.metaKey)) || (e.key === '/' && !typing))) {
    e.preventDefault();
    if (isDrawerOpen()) document.getElementById('drawer-search')?.focus(); else openDrawer(true);
  }
});


/* =====================================================================
   SECTION 12: DRAG TO REORDER FEATURES
   Uses Pointer Events, so it works with mouse AND touch.
   Grab the ⋮⋮ handle and move up/down.
   ===================================================================== */
let drag = null;

document.addEventListener('pointerdown', e => {
  const handle = e.target.closest('.drag-handle');
  if (!handle) return;
  e.preventDefault();
  const item = handle.closest('.feature');
  drag = { item, list: item.parentElement, pointerId: e.pointerId };
  item.classList.add('dragging');
  handle.setPointerCapture(e.pointerId); // keep receiving moves even outside the handle
});

document.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.pointerId) return;
  e.preventDefault();

  // Find the first item whose middle is below the finger, and drop before it.
  const others = [...drag.list.querySelectorAll('.feature:not(.dragging)')];
  const before = others.find(el => {
    const r = el.getBoundingClientRect();
    return e.clientY < r.top + r.height / 2;
  });
  if (before) { if (before !== drag.item.nextElementSibling) drag.list.insertBefore(drag.item, before); }
  else if (drag.list.lastElementChild !== drag.item) drag.list.appendChild(drag.item);

  // Auto-scroll when dragging near the top/bottom of the screen.
  if (e.clientY < 90) window.scrollBy(0, -12);
  else if (e.clientY > window.innerHeight - 90) window.scrollBy(0, 12);
});

function endDrag() {
  if (!drag) return;
  drag.item.classList.remove('dragging');
  const idea = findIdea(currentIdeaId());
  if (idea) {
    const order = [...drag.list.children].map(li => li.dataset.id);
    const before = idea.features.map(f => f.id).join();
    idea.features.sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id));
    if (before !== order.join()) { touch(idea); saveState(); }
  }
  drag = null;
}
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);

// Photos are shrunk (max 1000px, JPEG) so the synced list stays small.
function shrinkImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1000 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.7));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('bad image')); };
    img.src = url;
  });
}
const imagesBytes = () => state.todos.reduce((n, t) => n + t.images.reduce((m, s) => m + s.length, 0), 0);
async function addTodoImages(id, files) {
  const t = state.todos.find(x => x.id === id);
  if (!t) return;
  let added = 0;
  for (const f of [...files].filter(f => f.type.startsWith('image/'))) {
    if (t.images.length >= 12) { toast('Ek task me 12 photo tak'); break; }
    if (imagesBytes() > 2.8 * 1024 * 1024) { toast('⚠️ Photos ki jagah bhar gayi — purani photos hatao'); break; }
    try { t.images.push(await shrinkImage(f)); added++; } catch { toast('Ye photo nahi khuli'); }
  }
  if (!added) return;
  t.updatedAt = Date.now();
  saveState(); render();
  toast(`🖼️ ${added} photo add ho gayi`);
}

// Move a task (with everything inside it) under another task, or to the top of a list.
function moveTodoInto(id, value) {
  const t = state.todos.find(x => x.id === id);
  if (!t) return;
  const group = [t, ...descendantsOf(t.id)];
  const before = group.map(x => ({ x, folder: x.folder, parentId: x.parentId }));
  let folder, parentId = null, label;
  if (value.startsWith('list:')) { folder = value.slice(5) || null; label = listName(folder); }
  else {
    const target = state.todos.find(x => x.id === value);
    if (!target) return;
    folder = target.folder; parentId = target.id; label = `"${target.text.slice(0, 30)}" ke andar`;
    collapsed.delete(target.id); saveCollapsed();
  }
  const now = Date.now();
  group.forEach(x => { x.folder = folder; x.updatedAt = now; });
  t.parentId = parentId;
  // Open work inside a done task re-opens it.
  if (!t.done) for (let p = state.todos.find(x => x.id === parentId); p && p.done; p = state.todos.find(x => x.id === p.parentId)) {
    p.done = false; p.doneAt = null; p.doneBy = null; p.updatedAt = now;
  }
  closeSheet(); saveState(); render();
  toast(`✅ ${label} shift ho gaya`, () => {
    const t2 = Date.now();
    before.forEach(b => Object.assign(b.x, { folder: b.folder, parentId: b.parentId, updatedAt: t2 }));
    saveState(); render();
  });
}
function openMoveInto(id) {
  const t = state.todos.find(x => x.id === id);
  if (!t) return;
  const skip = new Set([t.id, ...descendantsOf(t.id).map(x => x.id)]);
  const ids = new Set(state.todos.map(x => x.id));
  const opt = (value, label, depth, path) => `<button type="button" class="btn" data-action="todo-move-pick" data-value="${esc(value)}" data-q="${esc(path.toLowerCase())}" style="--d:${10 + depth * 18}px">
    <span class="tree-label">${label}</span><span class="path-label">${esc(path)}</span></button>`;
  const folders = [...new Set(['', TODAY, CURRENT, APPWORK, DOUBTS, INBOX, ...state.todos.map(x => x.folder || '')])];
  const rows = [];
  folders.forEach(f => {
    const name = listName(f);
    rows.push(opt('list:' + f, `<b>${esc(name)}</b> <span class="muted small">— seedha list me</span>`, 0, name));
    const walk = (x, depth, trail) => {
      if (skip.has(x.id)) return;
      const path = `${trail} › ${x.text.slice(0, 50)}`;
      rows.push(opt(x.id, `${x.done ? '✓ ' : '↳ '}${esc(x.text.slice(0, 70))}`, depth, path));
      [...childrenOf(x.id)].reverse().forEach(c => walk(c, depth + 1, path));
    };
    state.todos.filter(x => (x.folder || '') === f && isTopTodo(x, ids)).sort((a, b) => (a.done - b.done) || (b.createdAt - a.createdAt)).forEach(x => walk(x, 1, name));
  });
  const sheet = document.getElementById('sheet');
  sheet.innerHTML = `
    <div class="sheet-inner">
      <h2>↪️ Kahan daalna hai?</h2>
      <p class="small inbox-quote">${esc(t.text)}</p>
      <input id="move-pick-search" type="search" placeholder="🔍 Task ya list ka naam… (Enter = pehle wale me)" aria-label="Search" autocomplete="off" style="margin-bottom:10px">
      <div id="move-pick" class="move-list">${rows.join('')}</div>
      ${canEarn() ? `<button type="button" class="btn block" data-action="todo-to-earn" data-id="${t.id}" style="margin-top:12px">📂 💰 Earning ke kisi page me</button>` : ''}
      <button type="button" class="btn block" data-action="close-sheet" style="margin-top:8px">Cancel</button>
    </div>`;
  sheet.dataset.moveId = t.id;
  if (!sheet.open) sheet.showModal();
  document.getElementById('move-pick-search')?.focus();
}

    const sheet = document.getElementById('sheet');
